const TABS = [
  {key:'choice', label:'选择题', count: DATA.choice.length},
  {key:'match',  label:'匹配题', count: DATA.matching.length},
  {key:'program',label:'程序分析', count: DATA.program.length},
  {key:'short',  label:'简答题', count: DATA.short.length},
  {key:'comp',   label:'综合题', count: DATA.comprehensive.length},
];
let tab = 'choice';
const viewEl = document.getElementById('view');

function esc(s){ return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- tabs (iOS segmented) ---------- */
function renderTabs(){
  const seg = document.getElementById('seg');
  seg.querySelectorAll('button').forEach(b=>b.remove());
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.innerHTML = `${t.label}<span class="cnt">${t.count}</span>`;
    b.className = t.key===tab ? 'active' : '';
    b.onclick = ()=>{ tab = t.key; renderTabs(); render(); window.scrollTo(0,0); };
    seg.appendChild(b);
  });
  const idx = TABS.findIndex(t=>t.key===tab);
  document.getElementById('segThumb').style.transform = `translateX(${idx*100}%)`;
}
/* ---------- theme ---------- */
function paintTheme(){
  const dark = (state.theme==='dark');
  document.getElementById('themeIco').innerHTML = dark ? IC.sun : IC.moon;
  document.getElementById('themeTxt').textContent = dark ? '日间' : '夜间';
}
document.getElementById('themeBtn').onclick = ()=>{
  state.theme = (state.theme==='dark') ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  paintTheme(); save();
};

/* ================ 选择题 ================ */
const C = {sec:'全部', mode:'all', order:'seq', pool:[], idx:0, sel:new Set(), aiOpen:null};
let _autoJumpTimer = null;
function clearAutoJump(){ if(_autoJumpTimer){ clearTimeout(_autoJumpTimer); _autoJumpTimer = null; } }
function goTo(i){ clearAutoJump(); C.idx = i; C.sel = new Set(); C.aiOpen = null; renderChoice(); }
function autoNextIfCorrect(ok){
  clearAutoJump();
  if(ok && C.pool.length){
    _autoJumpTimer = setTimeout(()=>{ _autoJumpTimer = null; goTo((C.idx+1)%C.pool.length); }, 750);
  }
}
const CHOICE = DATA.choice.map((q,i)=>({...q, id:i+1}));
const SECS = ['全部', ...new Set(CHOICE.map(q=>q.sec))];
function buildPool(){
  let qs = CHOICE;
  if(C.sec!=='全部') qs = qs.filter(q=>q.sec===C.sec);
  if(C.mode==='wrong') qs = qs.filter(q=>{const r=state.c[q.id]; return r && r.ok===0;});
  else if(C.mode==='undone') qs = qs.filter(q=>!state.c[q.id]);
  else if(C.mode==='multi') qs = qs.filter(q=>q.multi);
  if(C.order==='rand') qs = shuffle(qs.slice());
  C.pool = qs; C.idx = 0; C.sel = new Set(); C.aiOpen = null;
}
function recOf(q){ return state.c[q.id]; }
function poolStats(){
  let done=0, ok=0;
  for(const q of C.pool){ const r=recOf(q); if(r){ done++; if(r.ok===1) ok++; } }
  return {done, ok, total:C.pool.length};
}
function renderChoice(){
  clearAutoJump();
  const st = poolStats();
  const pct = st.total? Math.round(st.done/st.total*100) : 0;
  const acc = st.done&&st.ok? Math.round(st.ok/st.done*100) : 0;
  viewEl.innerHTML = `
  <div class="ctl">
    ${[['all','全部'],['wrong','只看错题'],['undone','只看未做'],['multi','只看多选']].map(([k,l])=>
      `<button class="chip ${C.mode===k?'on':''}" data-mode="${k}">${l}</button>`).join('')}
    <span class="grow"></span>
    <label class="ioswitch"><span class="sw-label">随机顺序</span>
      <input type="checkbox" id="orderSw" ${C.order==='rand'?'checked':''}>
      <span class="sw-track"><span class="sw-knob"></span></span>
    </label>
    <button class="toolbtn" id="gridBtn">${IC.grid}答题卡</button>
    <button class="toolbtn" id="resetBtn">${IC.trash}重置</button>
  </div>
  <div class="ctl" id="secChips">
    ${SECS.map(s=>`<button class="chip ${C.sec===s?'on':''}" data-sec="${esc(s)}">${esc(s)}</button>`).join('')}
  </div>
  <div class="stats">
    <div class="stat"><span class="v">${st.done}<small> / ${st.total}</small></span><span class="k">已作答</span></div>
    <div class="stat"><span class="v g">${st.ok}</span><span class="k">答对</span></div>
    <div class="stat"><span class="v a">${acc}%</span><span class="k">正确率</span></div>
    <div class="stat"><span class="v">${C.pool.length? (C.idx+1) : 0}<small> / ${st.total}</small></span><span class="k">当前题位</span></div>
  </div>
  <div class="pbar"><div id="statBar" style="width:${pct}%"></div></div>
  <div id="gridWrap" class="gridpanel hidden"></div>
  <div id="qcard"></div>`;
  renderQCard();
  document.getElementById('orderSw').onchange = e=>{ C.order = e.target.checked ? 'rand' : 'seq'; buildPool(); renderChoice(); };
  document.getElementById('gridBtn').onclick = ()=>{ toggleGrid(); };
  document.getElementById('resetBtn').onclick = ()=>{
    if(confirm('确定清空全部选择题答题记录吗？此操作不可撤销。')){ state.c = {}; save(); buildPool(); renderChoice(); }
  };
  viewEl.querySelector('#secChips').addEventListener('click', e=>{
    const b=e.target.closest('[data-sec]'); if(!b) return;
    C.sec=b.dataset.sec; buildPool(); renderChoice();
  });
  viewEl.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ C.mode=b.dataset.mode; buildPool(); renderChoice(); });
}
function toggleGrid(){
  const g = document.getElementById('gridWrap');
  if(!g.classList.contains('hidden')){ g.classList.add('hidden'); return; }
  g.classList.remove('hidden');
  g.innerHTML = `<div class="gp-head">${IC.grid}答题卡（点击题号跳转）</div>
  <div class="gwrap">` + C.pool.map((q,i)=>{
    const r = recOf(q);
    const cls = r? (r.ok===1?'ok':(r.ok===0?'no':'viewed')) : '';
    return `<button class="gnum ${cls} ${i===C.idx?'cur':''}" data-i="${i}">${i+1}</button>`;
  }).join('') + '</div>';
  g.onclick = e=>{ const b=e.target.closest('[data-i]'); if(!b) return; goTo(+b.dataset.i); };
}
function renderQCard(){
  const qcard = document.getElementById('qcard');
  if(!C.pool.length){
    qcard.innerHTML = '<div class="card empty">当前筛选下没有题目，换个筛选条件试试</div>'; return;
  }
  if(C.idx >= C.pool.length) C.idx = 0;
  const q = C.pool[C.idx];
  const r = recOf(q);
  const answered = r && r.s;
  const revealed = r && r.v && !answered;
  let optHtml = q.opts.map(o=>{
    let cls = '';
    if(answered){
      if(q.ans.includes(o.k)) cls='correct';
      else if(r.s.includes(o.k)) cls='wrongpick';
      cls += ' locked';
    } else if(revealed){
      if(q.ans.includes(o.k)) cls='correct locked';
    } else if(C.sel.has(o.k)){
      cls='sel';
    }
    return `<div class="opt ${cls}" data-k="${o.k}" role="button" tabindex="0"><span class="okey">${o.k}</span><span class="otxt">${esc(o.t)}</span></div>`;
  }).join('');
  let resultHtml = '';
  if(answered){
    const ok = r.ok===1;
    resultHtml = `<div class="result ${ok?'ok':'no'}">${ok?IC.check:IC.x}<span>${ok?'回答正确':'回答错误'}　正确答案 ${q.ans}${q.multi?'（多选）':''}${r.s!==q.ans?`<span class="sub">　你的答案 ${r.s}</span>`:''}</span></div>`;
  } else if(revealed){
    resultHtml = `<div class="result view">${IC.eye}<span>已显示答案 ${q.ans}${q.multi?'（多选）':''}<span class="sub">　看答案不计入正确率</span></span></div>`;
  }
  const showNote = (answered||revealed) && q.note;
  const noteHtml = showNote ? `<div class="note">${esc(q.note)}</div>` : '';
  const aiOpen = C.aiOpen === q.id;
  const aiHtml = (q.ex && aiOpen) ? `<div class="aiexp"><div class="ai-head">${IC.sparkle}<span>AI 讲解</span></div><div class="ai-body">${esc(q.ex)}</div></div>` : '';
  const selNote = q.multi && !answered ? `<div style="color:var(--faint);font-size:12px;margin-top:10px">多选题：先点选若干选项，再提交</div>` : '';
  qcard.innerHTML = `
  <div class="card">
    <div class="qmeta">
      <span class="tag accent">${esc(q.sec)}</span>
      <span class="tag">原题 ${q.n}</span>
      ${q.multi?'<span class="tag multi">多选</span>':''}
      <span class="push"></span>
      ${r?`<button class="btn ghost sm" id="redoBtn">${IC.redo}重做本题</button>`:''}
    </div>
    <div class="stem">${esc(q.stem)}</div>
    <div class="opts" id="opts">${optHtml}</div>
    ${selNote}
    <div class="actions">
      ${q.multi && !answered ? `<button class="btn primary" id="submitBtn">提交答案</button>`:''}
      ${!answered ? `<button class="btn" id="revealBtn">${IC.eye}显示答案</button>`:''}
      ${q.ex ? `<button class="btn ai-btn" id="aiBtn">${IC.sparkle}AI 讲解</button>`:''}
    </div>
    ${aiHtml}
    ${resultHtml}
    ${noteHtml}
  </div>
  <div class="qnav">
    <button class="btn" id="prevBtn">${IC.chevL}上一题</button>
    <span class="kbdhint">按 <kbd>←</kbd> <kbd>→</kbd> 翻题，<kbd>1</kbd>-<kbd>5</kbd> 选选项${q.multi?'，<kbd>Enter</kbd> 提交':''}</span>
    <button class="btn" id="nextBtn">下一题${IC.chevR}</button>
  </div>`;
  document.getElementById('prevBtn').onclick = ()=> goTo((C.idx-1+C.pool.length)%C.pool.length);
  document.getElementById('nextBtn').onclick = ()=> goTo((C.idx+1)%C.pool.length);
  const optsEl = document.getElementById('opts');
  if(optsEl) optsEl.addEventListener('click', e=>{
    const o=e.target.closest('[data-k]'); if(!o) return;
    pick(q, o.dataset.k);
  });
  if(optsEl) optsEl.addEventListener('keydown', e=>{
    const o=e.target.closest('[data-k]'); if(!o) return;
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(q, o.dataset.k); }
  });
  const sub=document.getElementById('submitBtn'); if(sub) sub.onclick=()=>submitMulti(q);
  const rev=document.getElementById('revealBtn'); if(rev) rev.onclick=()=>reveal(q);
  const ai=document.getElementById('aiBtn'); if(ai) ai.onclick=()=>{ C.aiOpen = (C.aiOpen===q.id)? null : q.id; renderQCard(); };
  const rd=document.getElementById('redoBtn'); if(rd) rd.onclick=()=>{ delete state.c[q.id]; save(); C.sel=new Set(); renderChoice(); };
}
function pick(q, k){
  const r = recOf(q);
  if(r && r.s) return;
  if(q.multi){
    if(C.sel.has(k)) C.sel.delete(k); else C.sel.add(k);
    renderQCard();
  } else {
    const ok = k===q.ans;
    state.c[q.id] = {s:k, ok: ok?1:0};
    save(); renderQCard(); refreshGrid(); refreshStats();
    autoNextIfCorrect(ok);
  }
}
function submitMulti(q){
  if(!C.sel.size) return;
  const sel = [...C.sel].sort().join('');
  const ok = sel===q.ans;
  state.c[q.id] = {s:sel, ok: ok?1:0};
  save(); renderQCard(); refreshGrid(); refreshStats();
  autoNextIfCorrect(ok);
}
function reveal(q){
  const r = recOf(q);
  if(!r || !r.s){ state.c[q.id] = {v:1}; save(); }
  renderQCard(); refreshGrid(); refreshStats();
}
function refreshGrid(){
  const g=document.getElementById('gridWrap');
  if(g && !g.classList.contains('hidden')) toggleGrid(), toggleGrid();
}
function refreshStats(){
  const st = poolStats();
  const pct = st.total? Math.round(st.done/st.total*100) : 0;
  const acc = st.done&&st.ok? Math.round(st.ok/st.done*100) : 0;
  const stats = viewEl.querySelector('.stats');
  if(!stats) return;
  const vs = stats.querySelectorAll('.stat');
  vs[0].querySelector('.v').innerHTML = `${st.done}<small> / ${st.total}</small>`;
  vs[1].querySelector('.v').textContent = st.ok;
  vs[2].querySelector('.v').textContent = acc + '%';
  vs[3].querySelector('.v').innerHTML = `${C.pool.length? (C.idx+1) : 0}<small> / ${st.total}</small>`;
  const bar=document.getElementById('statBar'); if(bar) bar.style.width = pct + '%';
}

/* ================ 背诵题型 ================ */
const R = {filter:'all'};
const RECITE = {
  match:  {kind:'match',   title:'匹配题',    items: DATA.matching},
  program:{kind:'program', title:'程序分析题', items: DATA.program},
  short:  {kind:'short',   title:'简答题',    items: DATA.short},
  comp:   {kind:'comp',    title:'综合题',    items: DATA.comprehensive},
};
function markKey(kind, id){ return kind + id; }
function markOf(kind, id){ return state.marks[markKey(kind,id)] || ''; }
function setMark(kind, id, val){
  const k = markKey(kind,id);
  if(markOf(kind,id)===val) delete state.marks[k]; else state.marks[k]=val;
  save(); renderRecite();
}
function renderRecite(){
  const cfg = RECITE[tab];
  let items = cfg.items;
  if(R.filter==='ok') items = items.filter(it=>markOf(cfg.kind,it.id)==='ok');
  if(R.filter==='again') items = items.filter(it=>markOf(cfg.kind,it.id)==='again');
  const total = cfg.items.length;
  const okCnt = cfg.items.filter(it=>markOf(cfg.kind,it.id)==='ok').length;
  const againCnt = cfg.items.filter(it=>markOf(cfg.kind,it.id)==='again').length;
  let html = `
  <div class="ctl">
    ${[['all','全部'],['again','再看看'],['ok','已掌握']].map(([k,l])=>
      `<button class="chip ${R.filter===k?'on':''}" data-rf="${k}">${l}</button>`).join('')}
    <span class="grow"></span>
    <button class="toolbtn" id="toggleAllBtn">${IC.book}全部显示答案</button>
  </div>
  <div class="stats">
    <div class="stat"><span class="v g">${okCnt}<small> / ${total}</small></span><span class="k">已掌握</span></div>
    <div class="stat"><span class="v" style="color:var(--orange-txt)">${againCnt}</span><span class="k">再看看</span></div>
    <div class="stat"><span class="v">${items.length}</span><span class="k">当前显示</span></div>
  </div>
  <div class="pbar"><div style="width:${total? Math.round(okCnt/total*100):0}%"></div></div>
  <div id="reciteList">`;
  if(!items.length){
    html += `<div class="card empty">该筛选下没有题目</div>`;
  }
  items.forEach((it, vi)=>{
    const mk = markOf(cfg.kind, it.id);
    html += `<div class="rcard" data-rid="${cfg.kind}-${it.id}" style="--i:${vi}">
      <div class="rhead">
        <span class="rid">${cfg.title} ${String(it.id).padStart(2,'0')}</span>
        ${mk==='ok'?`<span class="rmark ok">已掌握</span>`:mk==='again'?`<span class="rmark again">再看看</span>`:''}
        <span class="push"></span>
        <button class="btn ghost sm" data-mark="ok" data-id="${it.id}">${IC.check}已掌握</button>
        <button class="btn ghost sm" data-mark="again" data-id="${it.id}">${IC.refresh}再看看</button>
      </div>`;
    html += renderReciteBody(cfg.kind, it);
    html += `</div>`;
  });
  html += `</div>`;
  viewEl.innerHTML = html;
  viewEl.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ R.filter=b.dataset.rf; renderRecite(); });
  document.getElementById('toggleAllBtn').onclick = ()=>{
    const anyHidden = viewEl.querySelector('.ansbox.hidden, .pseg .seg-a.hidden');
    const anyHidden2 = anyHidden;
    viewEl.querySelectorAll('.ansbox.hidden').forEach(x=>x.classList.remove('hidden'));
    viewEl.querySelectorAll('.pseg .seg-a.hidden').forEach(x=>x.classList.remove('hidden'));
    viewEl.querySelectorAll('[data-reveal]').forEach(b=>{ b.innerHTML = b.dataset.openHtml; });
    if(!anyHidden2){
      viewEl.querySelectorAll('.ansbox').forEach(x=>x.classList.add('hidden'));
      viewEl.querySelectorAll('.pseg .seg-a').forEach(x=>x.classList.add('hidden'));
      viewEl.querySelectorAll('[data-reveal]').forEach(b=>{ b.innerHTML = b.dataset.revealHtml; });
    }
  };
  viewEl.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>setMark(cfg.kind, +b.dataset.id, b.dataset.mark));
  bindReciteEvents(cfg.kind);
}
const REVEAL_HTML = `${IC.eye}显示答案`;
const OPEN_HTML = `${IC.eye}收起答案`;
function renderReciteBody(kind, it){
  let h = '';
  if(kind==='match'){
    h += `<div class="rtitle">${esc(it.title)}</div>`;
    h += `<div class="matchwrap"><div class="matchcol">`;
    it.left.forEach((l,i)=>{ h += `<div class="mrow"><span class="idx">${i+1}</span><span class="txt">${esc(l)}</span></div>`; });
    h += `</div><div class="matchcol">`;
    it.right.forEach((r,i)=>{ h += `<div class="mrow"><span class="idx">${String.fromCharCode(65+i)}</span><span class="txt">${esc(r)}</span></div>`; });
    h += `</div></div>`;
    if(it.note) h += `<div class="note">${esc(it.note)}</div>`;
    h += `<div class="actions"><button class="btn sm" data-reveal>${REVEAL_HTML}</button></div>`;
    h += `<div class="ansbox hidden"><div class="alabel">${IC.check}答案对应</div>
      <table class="pairs">${it.pairs.map(p=>`<tr><td class="pl">${esc(p[0])}</td><td class="arrow">${IC.arrow}</td><td class="pr">${esc(p[1])}</td></tr>`).join('')}</table></div>`;
  } else if(kind==='program'){
    h += `<div class="rtitle">${esc(it.title)}</div>`;
    if(it.note) h += `<div class="note">${esc(it.note)}</div>`;
    it.segments.forEach((seg,i)=>{
      h += `<div class="pseg">
        <div class="pseg-head"><span class="sid">S${i+1}</span><span class="sq">以上代码的作用是什么？</span>
          <button class="btn ghost sm" data-reveal>${REVEAL_HTML}</button></div>
        <pre class="code">${esc(seg.code)}</pre>
        <div class="seg-body"><div class="seg-a hidden"><b>S${i+1}</b>　${esc(seg.a)}</div></div>
      </div>`;
    });
  } else {
    h += `<div class="rtitle">${esc(it.q)}</div>`;
    if(it.note) h += `<div class="note">${esc(it.note)}</div>`;
    h += `<div class="actions"><button class="btn sm" data-reveal>${REVEAL_HTML}</button></div>`;
    h += `<div class="ansbox hidden"><div class="alabel">${IC.check}参考答案</div>
      <div class="ansbody">${esc(it.a)}</div></div>`;
  }
  return h;
}
function bindReciteEvents(kind){
  viewEl.querySelectorAll('[data-reveal]').forEach(btn=>{
    btn.dataset.revealHtml = REVEAL_HTML;
    btn.dataset.openHtml = OPEN_HTML;
    btn.onclick = ()=>{
      const target = kind==='program' ? btn.closest('.pseg').querySelector('.seg-a') : btn.closest('.rcard').querySelector('.ansbox');
      const hidden = target.classList.toggle('hidden');
      btn.innerHTML = hidden ? btn.dataset.revealHtml : btn.dataset.openHtml;
    };
  });
}

/* ---------- main ---------- */
function render(){
  if(tab==='choice') renderChoice(); else renderRecite();
}
renderTabs(); paintTheme(); buildPool(); render();

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(tab!=='choice') return;
  if(e.key==='ArrowRight'){ document.getElementById('nextBtn')?.click(); }
  else if(e.key==='ArrowLeft'){ document.getElementById('prevBtn')?.click(); }
  else if(e.key==='Enter'){
    if(e.target.closest('.opt')) return;
    const q = C.pool[C.idx];
    if(q && q.multi && !recOf(q)?.s){ document.getElementById('submitBtn')?.click(); }
    else { document.getElementById('nextBtn')?.click(); }
  }
  else if(/^[1-5]$/.test(e.key)){
    const q = C.pool[C.idx];
    if(q && q.opts[e.key-1]) pick(q, q.opts[e.key-1].k);
  }
});
</script>
