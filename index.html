<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1berty独家机器学习期末秘方</title>
<style>
/* ============ Apple-style tokens (iOS/macOS system palette) ============ */
:root{
  --bg:#f5f5f7; --card:#ffffff; --raise:#ffffff;
  --fill:rgba(120,120,128,.14); --fill-strong:rgba(120,120,128,.24);
  --text:#1d1d1f; --muted:#6e6e73; --faint:#86868b;
  --hairline:rgba(0,0,0,.08); --border:rgba(0,0,0,.09);
  --accent:#0071e3; --accent-hover:#0077ed; --accent-tint:rgba(0,113,227,.10);
  --green:#34c759; --green-txt:#1d7a3a; --green-tint:rgba(52,199,89,.13);
  --red:#ff3b30; --red-txt:#c31b12; --red-tint:rgba(255,59,48,.11);
  --orange:#ff9500; --orange-txt:#a04d00; --orange-tint:rgba(255,149,0,.11);
  --purple:#af52de; --purple-txt:#6323b8; --purple-tint:rgba(175,82,222,.11);
  --code-bg:#f5f5f7; --code-head:rgba(120,120,128,.09);
  --shadow-card:0 1px 1px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.05);
  --shadow-pop:0 4px 10px rgba(0,0,0,.10), 0 20px 48px rgba(0,0,0,.14);
  --glass:rgba(251,251,253,.82);
  --knob-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
  --ease:cubic-bezier(.32,.72,0,1);
}
html[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --raise:#2c2c2e;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --text:#f5f5f7; --muted:#98989d; --faint:#8e8e93;
  --hairline:rgba(255,255,255,.10); --border:rgba(255,255,255,.12);
  --accent:#0a84ff; --accent-hover:#409cff; --accent-tint:rgba(10,132,255,.16);
  --green:#30d158; --green-txt:#4cd964; --green-tint:rgba(48,209,88,.14);
  --red:#ff453a; --red-txt:#ff6961; --red-tint:rgba(255,69,58,.14);
  --orange:#ff9f0a; --orange-txt:#ffb340; --orange-tint:rgba(255,159,10,.13);
  --purple:#bf5af2; --purple-txt:#c986f5; --purple-tint:rgba(191,90,242,.14);
  --code-bg:#101012; --code-head:rgba(120,120,128,.14);
  --shadow-card:none;
  --shadow-pop:0 8px 24px rgba(0,0,0,.5);
  --glass:rgba(22,22,24,.74);
  --knob-shadow:0 3px 8px rgba(0,0,0,.45);
}
/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:rgba(0,113,227,.22)}
html[data-theme="dark"] ::selection{background:rgba(10,132,255,.35)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.35);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button:focus-visible,.opt:focus-visible,input:focus-visible+.sw-track{outline:3px solid rgba(0,125,250,.55);outline-offset:2px;border-radius:12px}
svg.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
svg.ic.lg{width:18px;height:18px}
/* ============ topbar ============ */
.topbar{position:sticky;top:0;z-index:40;background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
html[data-theme="dark"] .topbar{box-shadow:none}
.topbar-inner{max-width:1280px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:12px}
.brandmark{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:#ff0029;box-shadow:0 1px 2px rgba(150,0,25,.35), inset 0 1px 0 rgba(255,255,255,.28)}
.brandmark svg{width:22px;height:22px;display:block}
.brand-name{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:900px){
  .topbar-inner{flex-wrap:wrap;row-gap:10px;padding:10px 14px}
  .seg{order:5;flex-basis:100%;max-width:none}
  .iconbtn{margin-left:auto}
}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--fill);
  color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:500;
  transition:all .2s var(--ease)}
.iconbtn:hover{background:var(--fill-strong)}
.iconbtn:active{transform:scale(.96)}
/* iOS segmented control */
.seg{position:relative;display:flex;flex:1;max-width:620px;margin:0 auto;background:var(--fill);
  border-radius:9px;padding:2px;overflow:hidden}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/5);
  background:var(--card);border-radius:8px;
  box-shadow:0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.10);
  transition:transform .3s var(--ease)}
html[data-theme="dark"] .seg-thumb{background:#636366}
.seg button{position:relative;z-index:1;flex:1;border:none;background:transparent;cursor:pointer;
  padding:5.5px 4px;font-size:12.5px;font-weight:500;color:var(--text);border-radius:7px;
  transition:color .2s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:400}
.seg button.active{font-weight:600}
.seg button.active .cnt{color:var(--accent)}
/* ============ layout ============ */
.wrap{max-width:1280px;margin:0 auto;padding:18px 24px 44px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
/* ============ controls ============ */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ctl .grow{flex:1}
.chip{border:none;background:var(--fill);color:var(--text);
  border-radius:999px;padding:5px 14px;cursor:pointer;font-size:12.5px;font-weight:500;transition:all .18s var(--ease)}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.toolbtn{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--fill);
  color:var(--text);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:12.5px;font-weight:500;
  transition:all .18s var(--ease)}
.toolbtn:hover{background:var(--fill-strong)}
.toolbtn:active{transform:scale(.96)}
/* iOS switch */
.ioswitch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.ioswitch .sw-label{font-size:12.5px;font-weight:500;color:var(--muted)}
.ioswitch input{position:absolute;opacity:0;width:0;height:0}
.ioswitch .sw-track{width:44px;height:27px;border-radius:99px;background:var(--fill-strong);
  position:relative;transition:background .25s var(--ease);flex:none}
.ioswitch input:checked + .sw-track{background:var(--green)}
.ioswitch .sw-knob{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;
  background:#fff;box-shadow:var(--knob-shadow);transition:transform .28s var(--ease)}
.ioswitch input:checked + .sw-track .sw-knob{transform:translateX(17px)}
/* stat cluster */
.stats{display:flex;align-items:stretch;background:var(--card);border-radius:18px;
  padding:14px 6px;margin:14px 0 10px;box-shadow:var(--shadow-card);flex-wrap:wrap;
  border:1px solid var(--hairline)}
.stat{flex:1;min-width:112px;padding:2px 16px;display:flex;flex-direction:column;gap:1px}
.stat + .stat{border-left:1px solid var(--hairline)}
.stat .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-size:12.5px;font-weight:500;color:var(--faint)}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v.g{color:var(--green-txt)} html[data-theme="dark"] .stat .v.g{color:var(--green)}
.stat .v.a{color:var(--accent)}
.pbar{width:100%;height:4px;border-radius:99px;background:var(--fill);overflow:hidden;margin:0 0 18px}
.pbar>div{height:100%;border-radius:99px;background:var(--accent);transition:width .4s var(--ease)}
/* ============ question card ============ */
.card{background:var(--card);border-radius:18px;padding:22px 24px 20px;margin-bottom:16px;
  box-shadow:var(--shadow-card);border:1px solid var(--hairline);
  animation:cardIn .34s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.996)}to{opacity:1;transform:none}}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:12px;color:var(--muted);background:var(--fill);border-radius:7px;padding:2.5px 9px;font-weight:500}
.tag.accent{color:var(--accent);background:var(--accent-tint);font-weight:600}
.tag.multi{color:var(--orange-txt);background:var(--orange-tint);font-weight:600}
html[data-theme="dark"] .tag.multi{color:var(--orange)}
.qmeta .push{flex:1}
.stem{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.6;
  letter-spacing:.005em;margin:4px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 15px;
  cursor:pointer;transition:all .2s var(--ease);background:var(--fill);
  border:1.5px solid transparent;user-select:none}
.opt:hover{background:var(--fill-strong);transform:translateY(-1px)}
.opt:active{transform:scale(.99)}
.opt .okey{width:27px;height:27px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--card);font-weight:600;font-size:13px;color:var(--muted);margin-top:0;
  box-shadow:0 1px 2px rgba(0,0,0,.10);transition:all .2s var(--ease)}
html[data-theme="dark"] .opt .okey{background:rgba(0,0,0,.3)}
.opt .otxt{white-space:pre-wrap;word-break:break-word;font-size:15px;padding-top:2.5px}
.opt.sel{background:var(--accent-tint);border-color:var(--accent)}
.opt.sel .okey{background:var(--accent);color:#fff;box-shadow:none}
.opt.correct{background:var(--green-tint);border-color:var(--green)}
.opt.correct .okey{background:var(--green);color:#fff;box-shadow:none}
.opt.correct .otxt{color:var(--green-txt);font-weight:500}
html[data-theme="dark"] .opt.correct .otxt{color:var(--green-txt)}
.opt.wrongpick{background:var(--red-tint);border-color:var(--red)}
.opt.wrongpick .okey{background:var(--red);color:#fff;box-shadow:none}
.opt.wrongpick .otxt{color:var(--red-txt);font-weight:500}
html[data-theme="dark"] .opt.wrongpick .otxt{color:var(--red-txt)}
.opt.locked{cursor:default}
.opt.locked:hover{transform:none;background:var(--green-tint)}
.opt.locked.wrongpick:hover{background:var(--red-tint)}
.opt.locked:active{transform:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:none;background:var(--fill);color:var(--text);border-radius:980px;
  padding:8px 18px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s var(--ease)}
.btn:hover{background:var(--fill-strong)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{padding:5px 14px;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--accent);font-weight:500}
.btn.ghost:hover{background:var(--accent-tint)}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.aiexp{margin-top:14px;background:var(--accent-tint);border-radius:14px;padding:12px 16px;
  animation:cardIn .3s var(--ease) both}
.aiexp .ai-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  color:var(--accent);letter-spacing:.04em;margin-bottom:7px}
.aiexp .ai-head svg.ic{width:15px;height:15px}
.aiexp .ai-body{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.btn.ai-btn{color:var(--accent);background:var(--accent-tint)}
.btn.ai-btn:hover{background:var(--accent-tint);filter:brightness(.97)}
/* result banner */
.result{margin-top:16px;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;
  display:flex;gap:10px;align-items:center;animation:cardIn .3s var(--ease) both}
.result svg.ic{width:19px;height:19px}
.result.ok{background:var(--green-tint);color:var(--green-txt)}
html[data-theme="dark"] .result.ok{color:var(--green)}
.result.no{background:var(--red-tint);color:var(--red-txt)}
html[data-theme="dark"] .result.no{color:var(--red)}
.result.view{background:var(--purple-tint);color:var(--purple-txt)}
html[data-theme="dark"] .result.view{color:var(--purple)}
.result .sub{font-weight:400;opacity:.8}
.note{margin-top:14px;background:var(--orange-tint);border-radius:14px;padding:11px 16px;
  font-size:13px;color:var(--orange-txt);white-space:pre-wrap;word-break:break-word;line-height:1.65;
  animation:cardIn .28s var(--ease) both}
html[data-theme="dark"] .note{color:var(--orange)}
/* nav */
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:4px 0 18px}
.qnav .kbdhint{color:var(--faint);font-size:11.5px}
kbd{background:var(--fill);border-radius:5px;padding:1px 6px;font-size:10.5px;font-family:inherit;color:var(--muted)}
/* answer grid */
.gridpanel{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:16px;
  box-shadow:var(--shadow-card);border:1px solid var(--hairline);animation:cardIn .28s var(--ease) both}
.gridpanel .gp-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;
  font-size:12px;color:var(--muted);font-weight:500}
.gwrap{display:flex;flex-wrap:wrap;gap:6px;max-height:224px;overflow-y:auto}
.gnum{min-width:34px;height:30px;border-radius:9px;border:none;background:var(--fill);
  cursor:pointer;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  font-weight:500;transition:all .15s var(--ease)}
.gnum:hover{background:var(--fill-strong);color:var(--text)}
.gnum.ok{background:var(--green-tint);color:var(--green-txt)}
html[data-theme="dark"] .gnum.ok{color:var(--green)}
.gnum.no{background:var(--red-tint);color:var(--red-txt)}
html[data-theme="dark"] .gnum.no{color:var(--red)}
.gnum.viewed{background:var(--purple-tint);color:var(--purple-txt)}
html[data-theme="dark"] .gnum.viewed{color:var(--purple)}
.gnum.cur{outline:3px solid rgba(0,125,250,.5);outline-offset:1px;color:var(--text);font-weight:600}
.empty{text-align:center;color:var(--faint);padding:56px 0;font-size:14px}
.hidden{display:none}
/* ============ recite ============ */
.rcard{background:var(--card);border-radius:18px;padding:20px 24px 18px;margin-bottom:16px;
  box-shadow:var(--shadow-card);border:1px solid var(--hairline);
  animation:cardIn .36s var(--ease) both;animation-delay:calc(min(var(--i,0)*40ms,440ms))}
.rhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rid{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--accent);
  background:var(--accent-tint);border-radius:7px;padding:2.5px 9px}
.rmark{font-size:11.5px;border-radius:7px;padding:2.5px 9px;font-weight:600}
.rmark.ok{color:var(--green-txt);background:var(--green-tint)}
html[data-theme="dark"] .rmark.ok{color:var(--green)}
.rmark.again{color:var(--orange-txt);background:var(--orange-tint)}
html[data-theme="dark"] .rmark.again{color:var(--orange)}
.rhead .push{flex:1}
.rtitle{white-space:pre-wrap;word-break:break-word;font-size:15px;color:var(--text);
  margin:8px 0 12px;line-height:1.65;font-weight:500}
/* matching */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:14px;overflow:hidden;
  background:var(--fill);margin:6px 0 2px}
.matchcol{display:flex;flex-direction:column}
.matchcol + .matchcol{border-left:1px solid var(--hairline)}
.mrow{padding:9px 14px;font-size:13.5px;border-bottom:1px solid var(--hairline);
  display:flex;gap:9px;align-items:flex-start}
.matchcol .mrow:last-child{border-bottom:none}
.mrow .idx{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;min-width:16px;font-weight:600}
.mrow .txt{white-space:pre-wrap;word-break:break-word}
.pairs{margin-top:14px;border-collapse:separate;border-spacing:0;width:100%;
  background:var(--fill);border-radius:14px;overflow:hidden}
.pairs td{border-bottom:1px solid var(--hairline);padding:10px 15px;font-size:14px;
  white-space:pre-wrap;word-break:break-word;vertical-align:middle}
.pairs tr:last-child td{border-bottom:none}
.pairs td.pl{width:42%;color:var(--muted)}
.pairs td.pr{font-weight:600}
.pairs td.arrow{width:30px;color:var(--accent);text-align:center;padding:6px 4px}
/* code + segments */
pre.code{background:var(--code-bg);border-radius:0;overflow-x:auto;
  font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
  font-size:12.5px;line-height:1.6;margin:0;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.pseg{border-radius:14px;overflow:hidden;margin:14px 0;background:var(--code-bg);border:1px solid var(--hairline)}
.pseg-head{display:flex;gap:9px;align-items:center;padding:9px 15px;background:var(--code-head);
  border-bottom:1px solid var(--hairline)}
.pseg-head .sid{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:11.5px;font-weight:700;
  letter-spacing:.06em;color:var(--accent)}
.pseg-head .sq{flex:1;font-size:12.5px;color:var(--muted)}
.pseg pre.code{border:none}
.seg-body{padding:0 15px 14px;background:var(--card)}
.seg-a{margin-top:12px;background:var(--green-tint);border-radius:11px;padding:10px 14px;
  font-size:13.8px;color:var(--green-txt);white-space:pre-wrap;word-break:break-word;
  animation:cardIn .25s var(--ease) both}
html[data-theme="dark"] .seg-a{color:var(--green-txt)}
.seg-a b{font-variant-numeric:tabular-nums}
/* answer area */
.ansbox{margin-top:16px;border-top:1px solid var(--hairline);padding-top:14px;animation:cardIn .28s var(--ease) both}
.ansbox .alabel{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.1em;
  color:var(--green-txt);font-weight:600;margin-bottom:9px}
html[data-theme="dark"] .ansbox .alabel{color:var(--green)}
.ansbody{font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--text)}
/* footer */
.footer{color:var(--faint);font-size:11.5px;text-align:center;padding:28px 0 8px;line-height:2}
/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>

<script type="application/json" id="quiz-data">{"choice":[{"n":1,"sec":"第一章 绪论·概述","stem":"机器学习的定义（ ）。","opts":[{"k":"A","t":"一种自动化的数据处理技术"},{"k":"B","t":"一种通过数据训练模型以进行预测或决策的技术"},{"k":"C","t":"一种用于数据可视化的技术"},{"k":"D","t":"一种用于网络编程的技术"}],"ans":"B","multi":false,"note":"","ex":"考点是机器学习的定义。机器学习通过数据训练模型，使计算机具备预测或决策能力，故选B；A、C、D分别将其误解为数据处理、数据可视化和网络编程技术，均不准确。"},{"n":2,"sec":"第一章 绪论·概述","stem":"机器学习的主要目标（ ）：","opts":[{"k":"A","t":"提高数据处理速度"},{"k":"B","t":"使计算机能够自动学习并改进性能"},{"k":"C","t":"优化网络连接"},{"k":"D","t":"提高软件开发效率"}],"ans":"B","multi":false,"note":"","ex":"考点是机器学习的主要目标。机器学习让计算机从数据中自动学习并不断改进自身性能，故选B；提速、优化网络、提高软件开发效率都不是它的核心目标。"},{"n":3,"sec":"第一章 绪论·概述","stem":"下列不属于机器学习任务的是（ ）。","opts":[{"k":"A","t":"人脸识别"},{"k":"B","t":"网页编写"},{"k":"C","t":"文本分类"},{"k":"D","t":"销量预测"}],"ans":"B","multi":false,"note":"","ex":"考点是机器学习任务的范围。人脸识别、文本分类、销量预测都是典型机器学习任务，网页编写属于编程开发工作，与从数据中学习无关，故选B。"},{"n":4,"sec":"第一章 绪论·概述","stem":"下列不属于机器学习典型应用场景的是（ ）。","opts":[{"k":"A","t":"垃圾邮件过滤"},{"k":"B","t":"商品推荐系统"},{"k":"C","t":"自动驾驶汽车"},{"k":"D","t":"电脑硬件组装"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的典型应用。垃圾邮件过滤、商品推荐、自动驾驶都依赖机器学习实现，电脑硬件组装是纯手工装配工作，故选D。"},{"n":5,"sec":"第一章 绪论·概述","stem":"下列不属于常见机器学习任务类型的是（ ）。","opts":[{"k":"A","t":"分类任务"},{"k":"B","t":"回归任务"},{"k":"C","t":"操作系统开发"},{"k":"D","t":"聚类任务"}],"ans":"C","multi":false,"note":"","ex":"考点是机器学习的任务类型。分类、回归、聚类都是常见任务类型，操作系统开发属于系统软件范畴，不是机器学习任务，故选C。"},{"n":6,"sec":"第一章 绪论·概述","stem":"下列不属于机器学习中监督学习应用的是（ ）。","opts":[{"k":"A","t":"房价预测"},{"k":"B","t":"图像识别"},{"k":"C","t":"手写数字识别"},{"k":"D","t":"网页设计"}],"ans":"D","multi":false,"note":"","ex":"考点是监督学习的应用。房价预测、图像识别、手写数字识别都基于带标签数据训练模型，网页设计不涉及从数据中学习，故选D。"},{"n":7,"sec":"第一章 绪论·概述","stem":"下列日常应用或技术中，没有直接应用机器学习技术的是（ ）。","opts":[{"k":"A","t":"智能手机的语音助手"},{"k":"B","t":"电脑自带的计算器软件"},{"k":"C","t":"购物 APP 的“猜你喜欢”"},{"k":"D","t":"输入法的智能联想输入"}],"ans":"B","multi":false,"note":"","ex":"考点是机器学习的日常应用辨析。语音助手、猜你喜欢、输入法联想都靠机器学习驱动，计算器按固定程序运算，没有学习过程，故选B。"},{"n":8,"sec":"第一章 绪论·概述","stem":"机器翻译属于下列哪个领域的应用（ ）。","opts":[{"k":"A","t":"自然语言系统"},{"k":"B","t":"机器学习"},{"k":"C","t":"专家系统"},{"k":"D","t":"人类感官模拟"}],"ans":"A","multi":false,"note":"","ex":"考点是机器翻译的领域归属。机器翻译实现人类语言之间的自动转换，属于自然语言系统的应用，故选A；机器学习是实现它的常用技术手段，不是应用领域归属。"},{"n":9,"sec":"第一章 绪论·概述","stem":"以下哪个不是机器学习的常见应用领域（ ）","opts":[{"k":"A","t":"医疗诊断"},{"k":"B","t":"股票市场预测"},{"k":"C","t":"图像识别"},{"k":"D","t":"网络安全"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的常见应用领域。医疗诊断、股票市场预测、图像识别是教材列举的典型应用，网络安全通常归入信息安全方向，本题判其不属于常见应用领域，故选D。"},{"n":10,"sec":"第一章 绪论·概述","stem":"以下哪个不是机器学习的常见任务（ ）。","opts":[{"k":"A","t":"分类"},{"k":"B","t":"回归"},{"k":"C","t":"聚类"},{"k":"D","t":"编译"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的常见任务。分类、回归、聚类都是常见任务，编译是把源代码翻译为目标代码的编译原理内容，与机器学习无关，故选D。"},{"n":11,"sec":"第一章 绪论·概述","stem":"机器学习是一门 ( )的科学。","opts":[{"k":"A","t":"人工智能"},{"k":"B","t":"计算机"},{"k":"C","t":"网格"},{"k":"D","t":"统计学"}],"ans":"A","multi":false,"note":"","ex":"考点是机器学习的学科定位。机器学习是人工智能的核心分支，研究如何利用经验改善系统性能，因此它是一门人工智能的科学，故选A。"},{"n":12,"sec":"第一章 绪论·概述","stem":"机器学习利用经验 ，须对以下（ ）进行分析。 （ ）","opts":[{"k":"A","t":"天气"},{"k":"B","t":"数据"},{"k":"C","t":"生活"},{"k":"D","t":"语言"}],"ans":"B","multi":false,"note":"","ex":"考点是经验的载体。机器学习利用经验改善系统性能，而经验在计算机中以数据形式存在，须对数据进行分析才能学习，故选B。"},{"n":13,"sec":"第一章 绪论·概述","stem":"下列哪位是人工智能之父（ ）","opts":[{"k":"A","t":"Marniv Lee Minsky simon"},{"k":"B","t":"Herbert"},{"k":"C","t":"Allen Newell"},{"k":"D","t":"John Clifford Shaw"}],"ans":"A","multi":false,"note":"","ex":"考点是人工智能先驱人物。题库认定A为人工智能之父，对应Marvin Minsky即马文·明斯基，人工智能奠基人之一；Herbert Simon、Allen Newell、John Clifford Shaw也是先驱，但本题不选。"},{"n":14,"sec":"第一章 绪论·概述","stem":"机器学习的流程包括：分析案例、数据获取、（ ）和模型验证这四个过\n程。","opts":[{"k":"A","t":"数据清洗"},{"k":"B","t":"数据分析"},{"k":"C","t":"模型训练"},{"k":"D","t":"模型搭建"}],"ans":"C","multi":false,"note":"","ex":"考点是机器学习的流程。流程为分析案例、数据获取、模型训练、模型验证四个过程，题干缺的一环是用数据训练出模型的模型训练，故选C。"},{"n":15,"sec":"第一章 绪论·概述","stem":"机器翻译属于下列哪个领域的应用（ ）？","opts":[{"k":"A","t":"自然语言系统"},{"k":"B","t":"机器学习"},{"k":"C","t":"专家系统"},{"k":"D","t":"人类感官模拟"}],"ans":"A","multi":false,"note":"","ex":"考点是机器翻译的领域归属。机器翻译实现语言之间的自动转换，属于自然语言系统的应用，故选A；机器学习只是实现它的技术手段之一。"},{"n":16,"sec":"第一章 绪论·概述","stem":"为了解决如何模拟人类的感性思维，例如视觉理解、直觉思维、悟性等，研\n究人员找到了一个重要的信息处理机制是（ ）？","opts":[{"k":"A","t":"专家系统"},{"k":"B","t":"人工神经网络"},{"k":"C","t":"模式识别"},{"k":"D","t":"智能代理"}],"ans":"B","multi":false,"note":"","ex":"考点是模拟人类感性思维的信息处理机制。人工神经网络模拟神经元连接结构，擅长视觉理解、直觉等感性信息处理，故选B；专家系统偏重逻辑推理。"},{"n":17,"sec":"第一章 绪论·概述","stem":"要想让机器具有智能，必须让机器具有知识。因此，在人工智能中有一个研\n究领域，主要研究计算机如何自动获取知识和技能，实现自我完善，这门研究分\n支叫（ ）？","opts":[{"k":"A","t":"专家系统"},{"k":"B","t":"神经网络"},{"k":"C","t":"模式识别"},{"k":"D","t":"机器学习"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的定位。研究计算机如何自动获取知识和技能、实现自我完善的分支正是机器学习，故选D；专家系统、神经网络、模式识别是其他研究方向。"},{"n":18,"sec":"第一章 绪论·概述","stem":"下列选项中不属于机器学习研究内容的是（ ）？","opts":[{"k":"A","t":"学习机理"},{"k":"B","t":"自动控制"},{"k":"C","t":"学习方法"},{"k":"D","t":"计算机存储系统"}],"ans":"B","multi":false,"note":"","ex":"考点是机器学习的研究内容。学习机理、学习方法都属于机器学习的研究范畴，自动控制是自动化与控制学科的方向，不属于机器学习研究内容，故选B。"},{"n":19,"sec":"第一章 绪论·概述","stem":"机器学习研究如何通过计算的手段，利用经验来改善系统自身的性能，请问\n机器学习利用数据训练出什么（ ）？","opts":[{"k":"A","t":"模型"},{"k":"B","t":"表结构"},{"k":"C","t":"结果"},{"k":"D","t":"报表"}],"ans":"A","multi":false,"note":"","ex":"考点是机器学习的产出。机器学习利用数据训练出模型，模型是对数据潜在规律的刻画，可用于后续预测和决策，故选A；表结构、报表都不是训练产物。"},{"n":20,"sec":"第一章 绪论·概述","stem":"以下哪个不是机器学习的常见工具（ ）。","opts":[{"k":"A","t":"Python"},{"k":"B","t":"R"},{"k":"C","t":"MATLAB"},{"k":"D","t":"Photoshop"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的常用工具。Python、R、MATLAB是机器学习常用的语言与环境，Photoshop是图像处理软件，故选D。"},{"n":21,"sec":"第一章 绪论·概述","stem":"以下哪个不是机器学习中常用的编程语言或框架（ ）。","opts":[{"k":"A","t":"Python"},{"k":"B","t":"R"},{"k":"C","t":"HTML"},{"k":"D","t":"MATLAB"}],"ans":"C","multi":false,"note":"","ex":"考点是机器学习常用的编程语言或框架。Python、R、MATLAB都常用于机器学习建模，HTML是网页标记语言，不属于机器学习语言或框架，故选C。"},{"n":22,"sec":"第一章 绪论·概述","stem":"以下哪个不属于常见的机器学习开源框架或库（ ）。","opts":[{"k":"A","t":"Scikit-learn"},{"k":"B","t":"TensorFlow"},{"k":"C","t":"PyTorch"},{"k":"D","t":"Excel"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习开源框架或库。Scikit-learn、TensorFlow、PyTorch都是主流开源框架，Excel是办公表格软件，故选D。"},{"n":23,"sec":"第一章 绪论·概述","stem":"以下哪个不是进行机器学习数据科学计算的常用工具或环境（ ）。","opts":[{"k":"A","t":"Jupyter Notebook"},{"k":"B","t":"Photoshop"},{"k":"C","t":"Anaconda"},{"k":"D","t":"Spyder"}],"ans":"B","multi":false,"note":"","ex":"考点是数据科学计算的工具或环境。Jupyter Notebook、Anaconda、Spyder都是Python数据科学常用环境，Photoshop用于图像编辑，故选B。"},{"n":24,"sec":"第一章 绪论·概述","stem":"以下哪个不是用于机器学习模型训练或数据处理的常用 Python 库（ ）。","opts":[{"k":"A","t":"Pandas"},{"k":"B","t":"NumPy"},{"k":"C","t":"Scikit-learn"},{"k":"D","t":"Django"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习常用Python库。Pandas、NumPy、Scikit-learn分别用于数据处理、数值计算和建模，Django是Web开发框架，故选D。"},{"n":25,"sec":"第一章 绪论·概述","stem":"如下属于机器学习应用的包括（ ）","opts":[{"k":"A","t":"自动计算，通过编程计算 456*457*458*459 的值"},{"k":"B","t":"文字识别，如通过 OCR 快速获得图像中的汉字，保存问文本"},{"k":"C","t":"语音输入，通过话筒将讲话内容转成文本"},{"k":"D","t":"麦克风阵列，如利用灵云该技术实现远程语音交互的电视"}],"ans":"A","multi":false,"note":"","ex":"考点是机器学习应用的辨析。通常OCR文字识别、语音输入、麦克风阵列才是机器学习应用，编程直接计算不属于；本题题库判A正确，与常规口径相反，按题库答案选A。（按题库答案口径）"},{"n":26,"sec":"第一章 绪论·概述","stem":"有如下数据，欲对其进行种类划分，请问该数据集中样本数有几个？（ ）\n萼片长度 萼片宽度 花瓣长度 花瓣宽度 种类\n5.1 3.5 1.4 0.2 se\n7.0 3.2 4.7 1.4 ve\n6.3 3.3 6.0 2.6 vi\n5.3 3.4 5.0 2.1 se","opts":[{"k":"A","t":"3 个"},{"k":"B","t":"4 个"},{"k":"C","t":"5 个"},{"k":"D","t":"6 个"}],"ans":"B","multi":false,"note":"","ex":"考点是样本数的识别。表中每一行是一个样本，共4行，故样本数为4个，选B；3是类别数，5是每条数据的属性个数，注意区分。"},{"n":27,"sec":"第一章 绪论·概述","stem":"有如下数据，欲对其进行种类划分，请问该数据集中数据的维度是多少？\n（ ）\n萼片长度 萼片宽度 花瓣长度 花瓣宽度 种类\n5.1 3.5 1.4 0.2 se\n7.0 3.2 4.7 1.4 ve\n6.3 3.3 6.0 2.6 vi\n5.3 3.4 5.0 2.1 se","opts":[{"k":"A","t":"3 维"},{"k":"B","t":"4 维"},{"k":"C","t":"5 维"},{"k":"D","t":"6 维"}],"ans":"C","multi":false,"note":"","ex":"考点是数据维度的含义。每条样本由萼片长度、萼片宽度、花瓣长度、花瓣宽度、种类共5个属性描述，故数据维度为5维，选C。"},{"n":28,"sec":"第一章 绪论·概述","stem":"有如下数据，欲对其进行种类划分，请问该数据集中数据特征的维度是多\n少？（ ）\n萼片长度 萼片宽度 花瓣长度 花瓣宽度 种类\n5.1 3.5 1.4 0.2 se\n7.0 3.2 4.7 1.4 ve\n6.3 3.3 6.0 2.6 vi\n5.3 3.4 5.0 2.1 se","opts":[{"k":"A","t":"3 维"},{"k":"B","t":"4 维"},{"k":"C","t":"5 维"},{"k":"D","t":"6 维"}],"ans":"B","multi":false,"note":"","ex":"考点是特征维度与数据维度的区别。特征维度只统计作为输入的属性，萼片和花瓣的长宽共4个，种类是标签不计入特征，故选B。"},{"n":29,"sec":"第一章 绪论·概述","stem":"有如下数据，欲对其进行种类划分，请问该数据集中样本有几类？（ ）\n萼片长度 萼片宽度 花瓣长度 花瓣宽度 种类\n5.1 3.5 1.4 0.2 se\n7.0 3.2 4.7 1.4 ve\n6.3 3.3 6.0 2.6 vi\n5.3 3.4 5.0 2.1 se","opts":[{"k":"A","t":"3 类"},{"k":"B","t":"4 类"},{"k":"C","t":"5 类"},{"k":"D","t":"6 类"}],"ans":"A","multi":false,"note":"","ex":"考点是类别数的识别。种类列取值有se、ve、vi共3种，故样本分为3类，选A；4是样本数，5是属性个数，注意区分。"},{"n":30,"sec":"第一章 绪论·概述","stem":"当训练样本线性不可划分时可采用（ ）来缓解和解决。","opts":[{"k":"A","t":"增加正例样本"},{"k":"B","t":"核函数"},{"k":"C","t":"训练误差最小"},{"k":"D","t":"测试误差最小"}],"ans":"B","multi":false,"note":"","ex":"考点是线性不可分问题的处理。核函数把样本映射到更高维空间，使原空间线性不可分的数据变得可分，故选B；增减样本或追求误差最小都不能直接解决不可分。"},{"n":31,"sec":"第一章 绪论·概述","stem":"下列有关机器学习基本术语说法错误的是（ ）","opts":[{"k":"A","t":"从训练数据中学得模型的过程称为“学习”或“训练”"},{"k":"B","t":"训练过程中使用的数据称为“训练数据”,每一个样本称为一个“训练样本”,训练样本组成的集合称为“训练集"},{"k":"C","t":"学得模型对应了关于数据的某种潜在规律,称为“假设”"},{"k":"D","t":"学习过程就是为了找出数据的某种潜在规律,这个规律自身,一般称为“数据特征”"}],"ans":"D","multi":false,"note":"这个规律自身,一般称为“真相“或“真实”，学习过程就是为了找出或逼近真相","ex":"考点是机器学习基本术语。学得的模型对应数据的潜在规律，该规律本身一般称为真相或真实，学习就是为了找出或逼近真相，D把它称为数据特征，说法错误，故选D。"},{"n":32,"sec":"第一章 绪论·概述","stem":"以下哪个不是机器学习的常见数据类型（ ）。","opts":[{"k":"A","t":"结构化数据"},{"k":"B","t":"半结构化数据"},{"k":"C","t":"非结构化数据"},{"k":"D","t":"无结构化数据"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的常见数据类型。通常分为结构化、半结构化、非结构化三类，无结构化数据不是通用的数据类型术语，故选D。"},{"n":33,"sec":"第一章 绪论·概述","stem":"机器学习中的“超参数”是指（ ）。","opts":[{"k":"A","t":"模型训练过程中自动学习的参数"},{"k":"B","t":"需要手动设置的参数"},{"k":"C","t":"模型的输出参数"},{"k":"D","t":"数据集的特征参数"}],"ans":"B","multi":false,"note":"","ex":"考点是超参数的概念。超参数在训练前由人工设定，如学习率、树的最大深度；训练过程中自动学得的是模型参数，故选B。"},{"n":34,"sec":"第一章 绪论·概述","stem":"以下哪个不是机器学习的常见算法（ ）","opts":[{"k":"A","t":"决策树"},{"k":"B","t":"支持向量机"},{"k":"C","t":"线性回归"},{"k":"D","t":"HTML 解析"}],"ans":"D","multi":false,"note":"","ex":"考点是机器学习的常见算法。决策树、支持向量机、线性回归都是常见算法，HTML解析是网页内容提取技术，不是机器学习算法，故选D。"},{"n":35,"sec":"第一章 绪论·概述","stem":"下列说法错误的是（ ）。","opts":[{"k":"A","t":"模型是通过学习算法得到的"},{"k":"B","t":"机器学习通常解决高度不确定性和复杂性的问题"},{"k":"C","t":"分类和回归是监督学习的代表"},{"k":"D","t":"机器学习一定需要类别标记"}],"ans":"D","multi":false,"note":"机器学习不一定需要类别标记，如无监督学习中聚类的训练样本不包含标记","ex":"考点是机器学习是否必须依赖标记。无监督学习如聚类的训练样本不含类别标记，因此机器学习不一定需要标记，D说法过于绝对，故选D。"},{"n":36,"sec":"第一章 绪论·概述","stem":"回归问题与分类问题的区别在于（ ）。（ ）","opts":[{"k":"A","t":"前者预测函数值为连续值，后者为离散值"},{"k":"B","t":"前者预测函数值为离散值，后者为连续值"},{"k":"C","t":"前者是无监督学习"},{"k":"D","t":"后者是无监督学习"}],"ans":"A","multi":false,"note":"","ex":"考点是回归与分类的区别。回归预测连续值如房价，分类预测离散值如类别标签，两者都属于监督学习，故选A。"},{"n":37,"sec":"第一章 绪论·概述","stem":"以下哪类模型不是分类模型（ ）？","opts":[{"k":"A","t":"最近邻"},{"k":"B","t":"K 均值"},{"k":"C","t":"朴素贝叶斯"},{"k":"D","t":"逻辑回归"}],"ans":"B","multi":false,"note":"","ex":"考点是分类模型的辨析。最近邻、朴素贝叶斯、逻辑回归都可用于分类，K均值是聚类算法，不是分类模型，故选B。"},{"n":38,"sec":"第一章 绪论·概述","stem":"以下属于回归任务的是（ ）?（ ）","opts":[{"k":"A","t":"预测一个房子的价格"},{"k":"B","t":"根据一个人的头像判断性别"},{"k":"C","t":"预测云南野生大象未来的走向"},{"k":"D","t":"判断一个西瓜是本地瓜还是外地瓜"}],"ans":"A","multi":false,"note":"","ex":"考点是回归任务的识别。房价是连续数值，预测房价属回归任务，故选A；判断性别、判断西瓜产地是分类，预测大象走向也不是连续值预测。"},{"n":39,"sec":"第一章 绪论·概述","stem":"某学习器预测的是离散值，则此类学习任务称为（ ）?（ ）","opts":[{"k":"A","t":"分类"},{"k":"B","t":"聚类"},{"k":"C","t":"回归"},{"k":"D","t":"强化学习"}],"ans":"A","multi":false,"note":"","ex":"考点是学习任务类型的判断。预测离散值对应分类任务，预测连续值才是回归，故选A。"},{"n":40,"sec":"第一章 绪论·概述","stem":"一监狱人脸识别准入系统用来识别待进入人员的身份，此系统一共包括识别\n4 种不同的人员：狱警、小偷、送餐员、其他，下面哪种学习方法最适合此种应\n用需求?（ ）","opts":[{"k":"A","t":"二分类问题"},{"k":"B","t":"多分类问题"},{"k":"C","t":"层次聚类问题"},{"k":"D","t":"K-mean 聚类问题"}],"ans":"B","multi":false,"note":"","ex":"考点是分类问题类型的判断。系统需区分狱警、小偷、送餐员、其他共4个类别，类别数大于2，属多分类问题，故选B。"},{"n":41,"sec":"第一章 绪论·概述","stem":"下列描述无监督学习错误的是（ ）","opts":[{"k":"A","t":"无标签"},{"k":"B","t":"核心是聚类"},{"k":"C","t":"不需要降维"},{"k":"D","t":"具有很好的解释性"}],"ans":"C","multi":false,"note":"","ex":"考点是无监督学习的特点。无监督学习无标签、核心是聚类，除聚类外还包括降维等任务，所以不需要降维的说法错误，故选C。"},{"n":42,"sec":"第一章 绪论·概述","stem":"下列描述有监督学习错误的是（ ）","opts":[{"k":"A","t":"有标签"},{"k":"B","t":"核心是分类"},{"k":"C","t":"所有数据都相互独立"},{"k":"D","t":"分类原因不透明"}],"ans":"C","multi":false,"note":"","ex":"考点是有监督学习的特点。有监督学习使用有标签数据、以分类为核心，但所有数据都相互独立的说法过于绝对，样本间可能相关，故选C。"},{"n":43,"sec":"第一章 绪论·概述","stem":"下列方法中属于监督学习的机器学习算法是（ ）。","opts":[{"k":"A","t":"贝叶斯分类器"},{"k":"B","t":"主成分分析"},{"k":"C","t":"K-Means"},{"k":"D","t":"高斯混合聚类"}],"ans":"A","multi":false,"note":"","ex":"考点是监督学习算法的识别。贝叶斯分类器基于带标签数据训练，属监督学习，故选A；主成分分析、K均值、高斯混合聚类都是无监督方法。"},{"n":44,"sec":"第一章 绪论·概述","stem":"以下哪个算法属于监督学习的是（ ）。","opts":[{"k":"A","t":"K-Means"},{"k":"B","t":"决策树"},{"k":"C","t":"DBSCAN"},{"k":"D","t":"PCA"}],"ans":"B","multi":false,"note":"","ex":"考点是监督学习算法的识别。决策树用带标签数据学习划分规则，属监督学习，故选B；K均值、DBSCAN是聚类，PCA是降维，均属无监督。"},{"n":45,"sec":"第一章 绪论·概述","stem":"下列方法中属于无监督学习的机器学习算法是（ ）。（ ）","opts":[{"k":"A","t":"支持向量机"},{"k":"B","t":"Logistic 回归"},{"k":"C","t":"层次聚类"},{"k":"D","t":"决策树"}],"ans":"C","multi":false,"note":"","ex":"考点是无监督学习算法的识别。层次聚类无需标签即可对数据分组，属无监督学习，故选C；支持向量机、逻辑回归、决策树都是监督学习算法。"},{"n":46,"sec":"第一章 绪论·概述","stem":"以下哪个算法属于无监督学习（ ）。","opts":[{"k":"A","t":"线性回归"},{"k":"B","t":"K-Means"},{"k":"C","t":"逻辑回归"},{"k":"D","t":"支持向量机"}],"ans":"B","multi":false,"note":"","ex":"考点是无监督学习算法的识别。K均值在无标签数据上按距离聚类，属无监督学习，故选B；线性回归、逻辑回归、支持向量机都是监督学习算法。"},{"n":47,"sec":"第一章 绪论·概述","stem":"下列方法中属于无监督学习算法的是（ ）。（ ）","opts":[{"k":"A","t":"线性回归"},{"k":"B","t":"支持向量机"},{"k":"C","t":"决策树"},{"k":"D","t":"K-means 聚类"}],"ans":"D","multi":false,"note":"","ex":"考点是无监督学习算法的识别。K均值聚类不依赖标签，按距离把样本分成K簇，属无监督学习，故选D；线性回归、支持向量机、决策树都是监督算法。"},{"n":48,"sec":"第一章 绪论·概述","stem":"监督学习与无监督学习的主要区别（ ）：","opts":[{"k":"A","t":"是否需要标签数据"},{"k":"B","t":"是否需要计算机"},{"k":"C","t":"是否需要网络连接"},{"k":"D","t":"是否需要数据"}],"ans":"A","multi":false,"note":"","ex":"考点是监督学习与无监督学习的区别。监督学习使用带标签数据训练，无监督学习直接在无标签数据上学习，主要区别是是否需要标签数据，故选A。"},{"n":49,"sec":"第一章 绪论·概述","stem":"如何在监督式学习中使用聚类算法（多选）？（ ）","opts":[{"k":"A","t":"首先，可以创建聚类，然后分别在不同的集群上应用监督式学习算法"},{"k":"B","t":"在应用监督式学习算法之前，可以将其类别 ID 作为特征空间中的一个额外的特征"},{"k":"C","t":"在应用监督式学习之前，不能创建聚类"},{"k":"D","t":"在应用监督式学习算法之前，不能将其类别 ID 作为特征空间中的一个额外的特征"}],"ans":"AB","multi":true,"note":"解析：本题考查的是聚类算法与监督式学习。\n我们可以为不同的集群构建独立的机器学习模型，并且可以提高预测精度。将每\n个类别的 ID 作为特征空间中的一个额外的特征可能会提高的精度结果。","ex":"考点是聚类与监督式学习的结合。多选AB：A先聚类再对不同簇分别应用监督算法，B把聚类得到的类别ID作为额外特征，两者都可能提升预测精度；C、D与这两种可行做法相反，不选。"},{"n":50,"sec":"第一章 绪论·概述","stem":"机器学习中的“特征工程”是指（ ）","opts":[{"k":"A","t":"选择和构造用于模型训练的特征"},{"k":"B","t":"选择合适的机器学习算法"},{"k":"C","t":"优化模型的超参数"},{"k":"D","t":"评估模型的性能"}],"ans":"A","multi":false,"note":"","ex":"考点是特征工程的概念。特征工程指从原始数据中选择并构造适合模型训练的特征，以提升模型效果，故选A；选算法、调超参数、评估性能是其他环节。"},{"n":51,"sec":"第一章 绪论·概述","stem":"下列方法不受数据归一化影响的是（ ）。（ ）","opts":[{"k":"A","t":"SVM"},{"k":"B","t":"神经网络"},{"k":"C","t":"Logistic 回归"},{"k":"D","t":"决策树"}],"ans":"D","multi":false,"note":"","ex":"考点是归一化的适用范围。决策树按特征取值选择分裂点，与量纲无关，不受归一化影响，故选D；SVM、神经网络、逻辑回归都受特征尺度影响。"},{"n":52,"sec":"第一章 绪论·概述","stem":"以下机器学习中，在数据预处理时，不需要考虑归一化处理的是（ ）。（ ）","opts":[{"k":"A","t":"Logistic 回归"},{"k":"B","t":"支撑向量机"},{"k":"C","t":"树形模型"},{"k":"D","t":"神经网络"}],"ans":"C","multi":false,"note":"","ex":"考点是数据预处理中归一化的适用范围。树形模型按特征阈值分裂节点，对量纲不敏感，不需要归一化，故选C；逻辑回归、SVM、神经网络需考虑归一化。"},{"n":53,"sec":"第一章 绪论·概述","stem":"以下哪些机器学习算法可用不对特征做归一化处理（ ）","opts":[{"k":"A","t":"随机森林"},{"k":"B","t":"逻辑回归"},{"k":"C","t":"SVM"},{"k":"D","t":"决策树"}],"ans":"AD","multi":true,"note":"","ex":"考点是不需要归一化的算法。多选AD：随机森林和决策树基于树结构按阈值分裂，对特征量纲不敏感，可不做归一化；逻辑回归和SVM依赖距离或梯度，受量纲影响，需要归一化。"},{"n":54,"sec":"第一章 绪论·概述","stem":"在标准化公式z(i) norm = z(i)¡¹p ¾2+²中使用²的目的是（ ）。（ ）","opts":[{"k":"A","t":"为了加速收敛"},{"k":"B","t":"如果¹过小"},{"k":"C","t":"使结果更准确"},{"k":"D","t":"防止分母为零"}],"ans":"D","multi":false,"note":"","ex":"考点是标准化公式中小量ε的作用。分母为方差加ε后开方，当特征方差为零时分母会变成零，加入ε是为了防止分母为零，故选D。"},{"n":55,"sec":"第一章 绪论·概述","stem":"西瓜数据集中，“好瓜、坏瓜”是一个西瓜样例的什么（ ）?","opts":[{"k":"A","t":"属性"},{"k":"B","t":"类别标记"},{"k":"C","t":"属性值"},{"k":"D","t":"数据集名称"}],"ans":"B","multi":false,"note":"","ex":"考点是数据集基本概念。样例的属性描述其特征，如色泽、根蒂；好瓜、坏瓜是对样例结果的判定标记，属于类别标记，故选B；它不是属性或属性值，也与数据集名称无关。"},{"n":56,"sec":"第一章 绪论·概述","stem":"机器学习把数据集分成训练集和（ ）。","opts":[{"k":"A","t":"分析集"},{"k":"B","t":"测试集"},{"k":"C","t":"导入集"},{"k":"D","t":"备用集"}],"ans":"B","multi":false,"note":"","ex":"考点是数据集划分。训练集用来训练模型，划分出的另一部分用来评估模型对新样本的泛化能力，称为测试集，故选B；分析集、导入集、备用集不是标准说法。"},{"n":57,"sec":"第一章 绪论·概述","stem":"以下哪些方法不可以直接来对文本分类？（ ）","opts":[{"k":"A","t":"K-Means"},{"k":"B","t":"决策树"},{"k":"C","t":"支持向量机"},{"k":"D","t":"kNN"}],"ans":"A","multi":false,"note":"解析：K-Means 是无监督算法，它之所以不能称为分类是因为它之前并没有类\n别标签，因此只能聚类。","ex":"考点是监督与无监督算法的区别。K-Means是无监督聚类算法，事先没有类别标签，只能聚类不能直接分类，故选A；决策树、支持向量机、kNN都是监督分类算法，可直接用于文本分类。"},{"n":58,"sec":"第一章 绪论·概述","stem":"下列哪个不属于常用的文本分类的特征选择算法（ ）。（ ）","opts":[{"k":"A","t":"卡方检验值"},{"k":"B","t":"互信息"},{"k":"C","t":"信息增益"},{"k":"D","t":"主成分分析"}],"ans":"D","multi":false,"note":"","ex":"考点是文本分类的特征选择方法。卡方检验、互信息、信息增益是常用的特征选择算法；主成分分析是降维方法，通过特征变换生成新特征而非挑选子集，不属于特征选择，故选D。"},{"n":59,"sec":"第一章 绪论·概述","stem":"以下哪种距离会侧重考虑向量方向（ ）。（ ）","opts":[{"k":"A","t":"欧式距离"},{"k":"B","t":"海明距离"},{"k":"C","t":"Jaccard 距离"},{"k":"D","t":"余弦距离"}],"ans":"D","multi":false,"note":"","ex":"考点是距离度量。余弦距离用向量夹角余弦衡量差异，只关注方向、忽略模长，故选D；欧式距离衡量位置差异，海明距离统计不同位数，Jaccard距离基于集合，都不侧重方向。"},{"n":60,"sec":"第一章 绪论·概述","stem":"给定两个特征向量，以下哪些方法不可以计算这两个向量的相似度（ ）","opts":[{"k":"A","t":"欧式距离"},{"k":"B","t":"夹角余弦"},{"k":"C","t":"信息熵"},{"k":"D","t":"哈曼顿距离"}],"ans":"ABD","multi":true,"note":"","ex":"考点是向量相似度度量。欧式距离、夹角余弦、哈曼顿距离都能度量两向量的距离或相似度，信息熵只衡量单个分布的不确定性、不能比较两个向量；题面的不可以疑似为可以之误，按答案选ABD。（按题库答案口径）"},{"n":61,"sec":"第一章 绪论·概述","stem":"从文件中导入已训练好的模型，使用（ ）进行加载","opts":[{"k":"A","t":"导入数据"},{"k":"B","t":"反序列化模型"},{"k":"C","t":"序列化模型"},{"k":"D","t":"导出数据"}],"ans":"B","multi":false,"note":"","ex":"考点是模型的保存与加载。反序列化把硬盘上的模型文件读回内存、还原成可用的模型对象，加载已训练好的模型用的就是它，故选B；序列化是方向相反的保存过程。"},{"n":62,"sec":"第一章 绪论·概述","stem":"模型训练完成以后，可以用（ ）进行保存","opts":[{"k":"A","t":"导入数据"},{"k":"B","t":"反序列化模型"},{"k":"C","t":"序列化模型"},{"k":"D","t":"导出数据"}],"ans":"C","multi":false,"note":"序列化指的是将内存中的对象保存到硬盘当中，以二进制序列的形式存储下来。反序列化指的是将硬盘当中的二进制序列反序列化的存储到内存中，得到对象，这样，我们就可以在内存中使用这个模型。序列化与反序列的目的是将数据、模型长久的保存。","ex":"考点是模型的保存与加载。序列化把内存中训练好的模型对象以二进制序列形式写入硬盘长期保存，故选C；反序列化用于从硬盘把模型读回内存，与保存方向相反。"},{"n":63,"sec":"第一章 绪论·概述","stem":"下列哪种归纳学习采用符号表示方式？（ ）","opts":[{"k":"A","t":"经验归纳学习"},{"k":"B","t":"遗传算法"},{"k":"C","t":"链接学习"},{"k":"D","t":"强化学习"}],"ans":"A","multi":false,"note":"","ex":"考点是归纳学习的表示方式。经验归纳学习从训练示例中归纳出以符号形式表达的知识，如规则、决策树，故选A；遗传算法、链接学习和强化学习不以符号表示为特征。"},{"n":64,"sec":"第一章 绪论·概述","stem":"下面属于非线性模型的机器学习的方法（ ）","opts":[{"k":"A","t":"决策树"},{"k":"B","t":"PCA"},{"k":"C","t":"多层感知机"},{"k":"D","t":"单层感知机"}],"ans":"AC","multi":true,"note":"","ex":"考点是线性与非线性模型。决策树逐层划分特征空间，多层感知机有隐藏层和非线性激活函数，都能表达非线性关系，故选AC；PCA是线性降维方法，单层感知机只能做线性划分。"},{"n":65,"sec":"第一章 绪论·概述","stem":"以下那种方法不是常见的类别不平衡学习方法? （ ）","opts":[{"k":"A","t":"最小二乘法"},{"k":"B","t":"过采样"},{"k":"C","t":"欠采样"},{"k":"D","t":"闽值移动"}],"ans":"A","multi":false,"note":"","ex":"考点是类别不平衡学习。过采样增加少数类样本、欠采样减少多数类样本、阈值移动调整判决门槛，都是常见处理类别不平衡的方法；最小二乘法是回归的参数求解方法，与此无关，故选A。"},{"n":66,"sec":"第一章 绪论·概述","stem":"当我们使用一个多项式函数去逼近数据集时,下列哪些说法是错误的? （ ）","opts":[{"k":"A","t":"多项式的次数时超参数"},{"k":"B","t":"多项式的系数是超参数"},{"k":"C","t":"多项式的次数必须通过数据去学习"},{"k":"D","t":"多项式的次数可以人工设置"}],"ans":"BC","multi":true,"note":"次数可以设置，系数需要训练求解","ex":"考点是超参数与参数的区分。多项式次数是人工设定的超参数，不由数据学习，系数才是训练求得的参数，所以系数是超参数、次数必须通过数据学习两句都错误，故选BC；A、D说法正确。"},{"n":67,"sec":"第一章 绪论·概述","stem":"卡方检验是检验定性自变量对定性因变量的相关性方法。欲使用卡方检验，\n应该使用哪个类（ ）","opts":[{"k":"A","t":"chi2"},{"k":"B","t":"mutual_info_regression"},{"k":"C","t":"F_regression"},{"k":"D","t":"f_classif用于回归：f_regression, mutual_info_regression"}],"ans":"A","multi":false,"note":"注：用于分类：chi2, f_classif, mutual_info_classif","ex":"考点是特征选择接口。卡方检验对应的类是chi2，用于分类问题的特征选择，故选A；f_classif、mutual_info_classif同样用于分类，f_regression、mutual_info_regression用于回归，不符合题意。"},{"n":68,"sec":"第一章 绪论·概述","stem":"下列关于极大似然估计（Maximum Likelihood Estimate，MLE），说法正确\n的是（多选）？（ ）","opts":[{"k":"A","t":"MLE 可能并不存在"},{"k":"B","t":"MLE 总是存在"},{"k":"C","t":"如果 MLE 存在，那么它的解可能不是唯一的"},{"k":"D","t":"如果 MLE 存在，那么它的解一定是唯一的"}],"ans":"AC","multi":true,"note":"解析：如果极大似然函数 L(θ) 在极大值处不连续，一阶导数不存在，则 MLE\n不存在。","ex":"考点是极大似然估计的性质。似然函数在极大值处不连续、一阶导数不存在时MLE可能不存在，存在时似然也可能有多个相等极大点、解不唯一，故选AC；B、D的总是存在、一定唯一过于绝对。"},{"n":69,"sec":"第一章 绪论·概述","stem":"在 n 维空间中（n > 1），下列哪种方法最适合用来检测异常值？（ ）","opts":[{"k":"A","t":"正态概率图"},{"k":"B","t":"箱形图"},{"k":"C","t":"马氏距离"},{"k":"D","t":"散点图"}],"ans":"C","multi":false,"note":"马氏距离（Mahalonobis distance）多用来计算某样本点与数据集的距离，优点是\n具有尺度无关性。马氏距离的计算公式如下：\nDM(~x) =\np\n(~x¡ ~¹)S¡1(~x¡ ~¹)\n其中，μ 是样本集均值，S 是样本集协方差矩阵。我们注意到马氏距离的公式\n与欧式距离公式只是多了一个协方差矩阵的逆。这也正是马氏距离的优点之处，\n它考虑了不同特征之间的协方差不同，将其进行归一化，使得距离度量与尺度无\n关。","ex":"考点是异常值检测。马氏距离引入协方差矩阵，把各特征尺度归一化、与量纲无关，适合在多维空间中度量样本偏离程度、发现异常值，故选C；概率图、箱形图、散点图主要面向一二维可视化。"},{"n":70,"sec":"第一章 绪论·概述","stem":"（ ）机器学习模型经过训练，能够根据其行为获得的奖励和反馈做出一\n系列决策？","opts":[{"k":"A","t":"监督学习"},{"k":"B","t":"无监督学习"},{"k":"C","t":"强化学习"},{"k":"D","t":"以上全部"}],"ans":"C","multi":false,"note":"","ex":"考点是机器学习范式。强化学习中智能体与环境交互，依据行为获得的奖励和反馈调整策略、完成一系列决策，故选C；监督学习依赖带标签样本，无监督学习挖掘无标签数据结构，都没有奖励机制。"},{"n":71,"sec":"第一章 绪论·机器学习理论","stem":"机器学习的理论基础是（ ）。","opts":[{"k":"A","t":"统计论"},{"k":"B","t":"概率论"},{"k":"C","t":"计算学习理论"},{"k":"D","t":"推断论"}],"ans":"C","multi":false,"note":"","ex":"考点是机器学习的理论基础。计算学习理论研究学习可行性与算法性能分析，如PAC可学习性，是机器学习的理论基础，故选C；概率论、统计学是重要数学工具，但不是这门理论的名称。"},{"n":72,"sec":"第一章 绪论·机器学习理论","stem":"模型复杂度越大，训练误差 ，测试误差 。（ ）","opts":[{"k":"A","t":"增大，减小"},{"k":"B","t":"增大，增大"},{"k":"C","t":"减小，增大"},{"k":"D","t":"减小，减小"}],"ans":"C","multi":false,"note":"","ex":"考点是模型复杂度与误差的关系。复杂度越大，模型对训练数据拟合越充分，训练误差减小；但对新样本的适应能力下降，测试误差增大，走向过拟合方向，故选C。"},{"n":73,"sec":"第一章 绪论·机器学习理论","stem":"缓解维数灾难的操作是（ ）。","opts":[{"k":"A","t":"降维"},{"k":"B","t":"升维"},{"k":"C","t":"低维度嵌入"},{"k":"D","t":"流型处理"}],"ans":"A","multi":false,"note":"","ex":"考点是维数灾难的应对。维数灾难指维度过高导致数据稀疏、计算和泛化困难，降维把高维样本映射到低维空间来缓解，故选A；升维会加剧维数灾难，低维嵌入与流形学习属于降维的具体思路。"},{"n":74,"sec":"第一章 绪论·机器学习理论","stem":"要想让机器具有智能，必须让机器具有知识。因此，在人工智能中有一个研\n究领域，主要研究计算机如何自动获取知识和技能，实现自我完善，这门研究分\n支学科叫做（ ）","opts":[{"k":"A","t":"专家系统"},{"k":"B","t":"机器学习"},{"k":"C","t":"神经网络"},{"k":"D","t":"模式识别"}],"ans":"B","multi":false,"note":"","ex":"考点是机器学习的定义。机器学习正是研究计算机如何自动获取知识和技能、实现自我完善的分支学科，故选B；专家系统的知识靠人工注入，神经网络与模式识别是具体技术或相关领域。"},{"n":75,"sec":"第一章 绪论·机器学习理论","stem":"下列说法错误的是（ ）","opts":[{"k":"A","t":"学得模型适用于新样本的能力称为“泛化”能力"},{"k":"B","t":"机器学习一般有“独立同分布”"},{"k":"C","t":"机器学习在只要见过的数据上做好了就行,未见过样本的性能不重要"},{"k":"D","t":"半假设拿到的所有数据都来自一个潜在的分布"}],"ans":"C","multi":false,"note":"泛化能力很重要","ex":"考点是泛化能力的重要性。机器学习的目标是让模型在未见过的新样本上也表现好，只顾见过的数据、不管新样本性能的说法错误，故选C；A、B、D分别正确陈述泛化概念与独立同分布假设。"},{"n":76,"sec":"第一章 绪论·机器学习理论","stem":"下列说法错误的是（ ）","opts":[{"k":"A","t":"色泽”取值为“青绿”,这里的“青绿”是属性值"},{"k":"B","t":"输出是离散值的学习任务为分类任务"},{"k":"C","t":"模型找出的规律一定是正确的"},{"k":"D","t":"般假设正类和反类是可交换的"}],"ans":"C","multi":false,"note":"模型找出的规律不一定正确","ex":"考点是模型与规律的关系。模型是从有限训练数据中学到的假设，只是对真实规律的近似，不一定正确，C错误故选C；青绿是属性值、输出离散为分类任务、正反类通常可交换，都是正确说法。"},{"n":77,"sec":"第一章 绪论·机器学习理论","stem":"下列关于归纳偏好的说法错误的是（ ）","opts":[{"k":"A","t":"机器学习算法在学习过程中对某种类型假设的偏好,称为“归纳偏好”,或简称为“偏好"},{"k":"B","t":"一般来说,任何一个有效的机器学习算法都有其归纳偏好"},{"k":"C","t":"“奥卡姆剃刀”原则在某些情况下可以指导选择偏好"},{"k":"D","t":"在任何情况下,总有一个最优的学习算法"}],"ans":"D","multi":false,"note":"","ex":"考点是归纳偏好与没有免费午餐定理。有效的学习算法都有归纳偏好，奥卡姆剃刀可作指导；但该定理表明脱离具体问题谈不上谁更优，任何情况下总存在最优算法的说法错误，故选D。"},{"n":78,"sec":"第一章 绪论·机器学习理论","stem":"二项式分布的共轭分布是（ ）。（ ）","opts":[{"k":"A","t":"正态分布"},{"k":"B","t":"Dirichlet 分布"},{"k":"C","t":"Beta 分布"},{"k":"D","t":"指数分布"}],"ans":"C","multi":false,"note":"","ex":"考点是共轭先验。Beta分布是二项分布的共轭先验，后验仍为Beta分布，便于贝叶斯推断，故选C；Dirichlet分布是多项分布的共轭，正态分布、指数分布与之不匹配。"},{"n":79,"sec":"第一章 绪论·机器学习理论","stem":"多项式分布的共轭分布是（ ）。（ ）","opts":[{"k":"A","t":"正态分布"},{"k":"B","t":"Dirichlet 分布"},{"k":"C","t":"Beta 分布"},{"k":"D","t":"指数分布"}],"ans":"B","multi":false,"note":"","ex":"考点是共轭先验。多项分布的共轭先验是Dirichlet分布，其后验仍是Dirichlet分布，故选B；注意区分：二项分布的共轭先验是Beta分布，这两题容易混淆。"},{"n":80,"sec":"第一章 绪论·机器学习理论","stem":"下列方法使用最大似然估计的是（ ）。（ ）","opts":[{"k":"A","t":"线性判别分析"},{"k":"B","t":"感知机"},{"k":"C","t":"Logistic 回归"},{"k":"D","t":"SVM"}],"ans":"C","multi":false,"note":"","ex":"考点是参数估计方法。Logistic回归通过最大化样本的对数似然求解参数，使用最大似然估计，故选C；感知机按误分类损失求解，SVM追求间隔最大化，LDA通常直接估计均值与协方差。"},{"n":81,"sec":"第一章 绪论·机器学习理论","stem":"在机器学习中，学得的模型适用于新样本的能力。称为（ ）?（ ）","opts":[{"k":"A","t":"泛化能力"},{"k":"B","t":"分析能力"},{"k":"C","t":"训练能力"},{"k":"D","t":"验证能力"}],"ans":"A","multi":false,"note":"","ex":"考点是泛化能力定义。学得的模型适用于未见过的新样本的能力称为泛化能力，它是衡量模型好坏的核心指标，故选A；分析能力、训练能力、验证能力都不是这一术语。"},{"n":82,"sec":"第一章 绪论·机器学习理论","stem":"“啤酒-纸尿布”问题讲述的是，超市购物中，通过分析购物单发现，买了纸\n尿布的男士，往往又买了啤酒。这是一个什么问题？（ ）。（ ）","opts":[{"k":"A","t":"关联分析"},{"k":"B","t":"回归"},{"k":"C","t":"聚类"},{"k":"D","t":"分类"}],"ans":"A","multi":false,"note":"","ex":"考点是数据挖掘任务类型。从大量购物单中发现买纸尿布的人往往同时买啤酒，是在挖掘项与项之间的关联规则，属于关联分析，故选A；回归、分类、聚类都不描述这种共现关系。"},{"n":83,"sec":"第一章 绪论·机器学习理论","stem":"KL 散度是根据什么构造的可分性判据（ ）。（ ）","opts":[{"k":"A","t":"最小损失准则"},{"k":"B","t":"后验概率"},{"k":"C","t":"类概率密度"},{"k":"D","t":"几何距离"}],"ans":"C","multi":false,"note":"","ex":"考点是可分性判据。KL散度即相对熵，度量两个类别概率密度分布的差异，差异越大类别越可分，是基于类概率密度构造的可分性判据，故选C。"},{"n":84,"sec":"第一章 绪论·机器学习理论","stem":"类密度聚类方法充分考虑了样本间的什么关系（ ）。（ ）","opts":[{"k":"A","t":"范数距离"},{"k":"B","t":"集合运算"},{"k":"C","t":"密度可达"},{"k":"D","t":"样本与集合运算"}],"ans":"C","multi":false,"note":"","ex":"考点是密度聚类。密度聚类以DBSCAN为代表，依据样本间的密度可达关系把高密度区域的样本连成簇，能发现任意形状的簇，故选C；它不靠范数距离或集合运算来定义簇结构。"},{"n":85,"sec":"第一章 绪论·机器学习理论","stem":"混合高斯聚类中，运用了以下哪种过程（ ）。（ ）","opts":[{"k":"A","t":"EM 算法"},{"k":"B","t":"集合运算"},{"k":"C","t":"密度可达"},{"k":"D","t":"样本与集合运算"}],"ans":"A","multi":false,"note":"","ex":"考点是高斯混合模型的求解。混合高斯聚类中样本属于哪个高斯成分是隐变量，无法直接观测，常用EM算法交替执行期望步与最大化步来估计参数，故选A。"},{"n":86,"sec":"第一章 绪论·机器学习理论","stem":"当训练一个神经网络来做图像识别任务时，通常会绘制一张训练集误差和验\n证集误差图来进行调试。在下图中，最好在哪个时间停止训练（ ）。（ ）","opts":[{"k":"A","t":"A"},{"k":"B","t":"B"},{"k":"C","t":"C"},{"k":"D","t":"D"}],"ans":"C","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考点是早停时机。应在验证误差降到最低、即将回升的拐点处停止训练，此时泛化最好，再训练会过拟合，训练误差仍在下降不能作为停止依据，故选C。原题含图，此讲解基于题面信息。"},{"n":87,"sec":"第一章 绪论·机器学习理论","stem":"下面哪句话是正确的？（ ）","opts":[{"k":"A","t":"机器学习模型的精准度越高，则模型的性能越好"},{"k":"B","t":"增加模型的复杂度，总能减小测试样本误差"},{"k":"C","t":"增加模型的复杂度，总能减小训练样本误差"},{"k":"D","t":"以上说法都不对"}],"ans":"C","multi":false,"note":"","ex":"考点是复杂度与误差。增加模型复杂度总能减小训练样本误差，因为模型拟合能力更强，C正确；精准度高不代表性能好，还要看泛化，A错；复杂度增大会使测试误差先降后升，B错。"},{"n":88,"sec":"第一章 绪论·机器学习理论","stem":"以下那个选项是指“奥卡姆剃刀”原则?（ ）","opts":[{"k":"A","t":"若有多个假设与观察一致,则随机选一个"},{"k":"B","t":"若有多个假设与观察一致,则选即不简单又不复杂的那个"},{"k":"C","t":"若有多个假设与观察一致,则选最简单的那个"},{"k":"D","t":"若有多个假设与观察一致,则选最复杂的那个"}],"ans":"C","multi":false,"note":"","ex":"考点是奥卡姆剃刀原则。该原则主张若有多个假设与观察一致，选择最简单的那一个，即如无必要勿增实体，故选C；随机选择、选最复杂或取中间都不符合这一原则。"},{"n":89,"sec":"第一章 绪论·过拟合","stem":"机器学习中的“过拟合”是指（ ）","opts":[{"k":"A","t":"模型在训练数据上表现很好，但在测试数据上表现很差"},{"k":"B","t":"模型在训练数据上表现很差"},{"k":"C","t":"模型在测试数据上表现很好"},{"k":"D","t":"模型训练时间过长"}],"ans":"A","multi":false,"note":"","ex":"考点是过拟合的定义。过拟合指模型把训练数据特有的性质当成一般规律学进去，在训练数据上表现很好，但在测试数据上表现很差，故选A；B只说训练差，更接近欠拟合。"},{"n":90,"sec":"第一章 绪论·过拟合","stem":"机器学习中的“欠拟合”是指（ ）","opts":[{"k":"A","t":"模型在训练数据上表现很好，但在测试数据上表现很差"},{"k":"B","t":"模型在训练数据上表现很差"},{"k":"C","t":"模型在测试数据上表现很好"},{"k":"D","t":"模型训练时间过短"}],"ans":"B","multi":false,"note":"","ex":"考点是欠拟合的定义。欠拟合指模型学习能力不足，连训练数据上的一般规律都没学好，在训练数据上表现就很差，故选B；它与过拟合方向相反，过拟合是训练好测试差。"},{"n":91,"sec":"第一章 绪论·过拟合","stem":"有的情况下 ，模型学习到了训练数据本身的特有性质，但这些性质不是一\n般规律，这种现象被称为（ ）。","opts":[{"k":"A","t":"欠拟合"},{"k":"B","t":"过拟合"},{"k":"C","t":"欠配"},{"k":"D","t":"以上都不是"}],"ans":"B","multi":false,"note":"","ex":"考点是过拟合的成因。模型学到的是训练数据本身的特有性质而非一般规律，在新样本上会失效，这正是过拟合，故选B；欠拟合是连训练数据的一般规律都没学到，与题意相反。"},{"n":92,"sec":"第一章 绪论·过拟合","stem":"以下属于解决模型欠拟合的方法是（ ）","opts":[{"k":"A","t":"增加训练数据量"},{"k":"B","t":"对模型进行裁剪"},{"k":"C","t":"增加训练过程的迭代次数"},{"k":"D","t":"正则化"}],"ans":"C","multi":false,"note":"","ex":"考点是欠拟合的对策。欠拟合源于模型学习不充分，增加训练过程的迭代次数能让模型学得更充分，可缓解欠拟合，故选C；增加数据量、裁剪模型、正则化都是针对过拟合的手段。"},{"n":93,"sec":"第一章 绪论·过拟合","stem":"以下可以不是有效解决过拟合的方法是（ ）","opts":[{"k":"A","t":"增加样本数量"},{"k":"B","t":"通过特征选择减少特征数量"},{"k":"C","t":"训练更多的迭代次数"},{"k":"D","t":"采用正则化方法"}],"ans":"C","multi":false,"note":"","ex":"考点是过拟合的对策。增加样本数量、减少特征数量、正则化都是缓解过拟合的有效手段；训练更多迭代次数会让模型更贴合训练数据，往往加重过拟合，因此它可以不是有效方法，故选C。"},{"n":94,"sec":"第一章 绪论·过拟合","stem":"下列哪种方法不可以用来减小过拟合？（ ）","opts":[{"k":"A","t":"更多的训练数据"},{"k":"B","t":"L1 正则化"},{"k":"C","t":"L2 正则化"},{"k":"D","t":"增加模型的复杂度"}],"ans":"D","multi":false,"note":"","ex":"考点是过拟合的对策。更多训练数据、L1正则化、L2正则化都能限制模型复杂度或缓解数据不足，减小过拟合；增加模型复杂度会让模型记住更多训练细节，反而加剧过拟合，故选D。"},{"n":95,"sec":"第一章 绪论·过拟合","stem":"以下哪种方法会增加模型的欠拟合风险（ ）。","opts":[{"k":"A","t":"添加新特征"},{"k":"B","t":"增加模型复杂度"},{"k":"C","t":"减小正则化系数"},{"k":"D","t":"数据增强"}],"ans":"D","multi":false,"note":"","ex":"考点是欠拟合的风险来源。数据增强扩充训练样本，模型能力不变时更难完全拟合训练集，会增加欠拟合风险，故选D；添加新特征、增加复杂度、减小正则化系数都在增强拟合能力，降低欠拟合风险。"},{"n":96,"sec":"第一章 绪论·过拟合","stem":"过拟合现象中（ ）。（ ）","opts":[{"k":"A","t":"训练样本的测试误差最小，测试样本的正确识别率缺很低"},{"k":"B","t":"训练样本的测试误差最小，测试样本的正确识别率也很高"},{"k":"C","t":"模型的泛化能力很高"},{"k":"D","t":"通常为线性模型"}],"ans":"A","multi":false,"note":"","ex":"考点是过拟合的表现。过拟合时模型在训练样本上误差最小，但泛化能力差，测试样本的正确识别率很低，故选A；B、C描述的是理想模型，D过拟合多由复杂模型引起，与是否线性无关。"},{"n":97,"sec":"第一章 绪论·过拟合","stem":"下列关于过拟合现象的描述中，哪个是正确的（ ）。（ ）","opts":[{"k":"A","t":"训练误差小，测试误差大"},{"k":"B","t":"训练误差小，测试误差小"},{"k":"C","t":"模型的泛化能力大"},{"k":"D","t":"都不对"}],"ans":"A","multi":false,"note":"","ex":"考点是过拟合的表现。过拟合模型训练误差很小，但对新样本泛化差、测试误差大，故选A；训练误差小测试误差小是理想状态，泛化能力大也与过拟合相反。"},{"n":98,"sec":"第一章 绪论·过拟合","stem":"在其他条件不变的前提下，以下哪种做法容易引起机器学习中的过拟合问题\n（ ）。（ ）","opts":[{"k":"A","t":"增加训练样本量"},{"k":"B","t":"减少神经网络隐藏层节点数"},{"k":"C","t":"删除稀疏的特征"},{"k":"D","t":"SVM 算法中使用高斯核代替线性核"}],"ans":"D","multi":false,"note":"","ex":"考点是过拟合的诱因。SVM用高斯核把样本映射到更高维甚至无限维空间，模型复杂度大幅提高，容易过拟合，故选D；增加训练样本、减少隐藏层节点、删除稀疏特征都在缓解过拟合。"},{"n":99,"sec":"第一章 绪论·过拟合","stem":"假如使用一个较复杂的回归模型来拟合样本数据，使用岭回归，调试正则化\n参数¸，来降低模型复杂度。若¸较大时，关于偏差（bias）和方差（variance），\n下列说法正确的是（ ）。（ ）","opts":[{"k":"A","t":"若¸较大时，偏差减小，方差减小"},{"k":"B","t":"若¸较大时，偏差减小，方差减大"},{"k":"C","t":"若¸较大时，偏差减大，方差减小"},{"k":"D","t":"若¸较大时，偏差减大，方差减大"}],"ans":"C","multi":false,"note":"","ex":"考点是正则化与偏差方差权衡。岭回归正则化参数较大时，模型被压得更简单，拟合能力下降使偏差增大（选项写作减大），对数据扰动更不敏感使方差减小，故选C。"},{"n":100,"sec":"第一章 绪论·过拟合","stem":"机器学习中的“正则化”是指（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少模型的复杂度以防止过拟合"},{"k":"C","t":"增加数据量"},{"k":"D","t":"提高模型的训练速度"}],"ans":"B","multi":false,"note":"","ex":"考点是正则化的含义。正则化在损失函数中加入参数惩罚项，限制模型复杂度以防止过拟合、提升泛化，故选B；它不增加复杂度，也不涉及增加数据量或提高训练速度。"},{"n":101,"sec":"第一章 绪论·过拟合","stem":"正则化的回归分析，可以避免（ ）。","opts":[{"k":"A","t":"线性化"},{"k":"B","t":"过拟合"},{"k":"C","t":"欠拟合"},{"k":"D","t":"连续值逼近"}],"ans":"B","multi":false,"note":"","ex":"考点是正则化的作用。正则化约束回归系数大小，抑制模型过度贴合训练数据，从而避免过拟合，故选B；正则化过强反而可能引起欠拟合，所以它不能用来避免欠拟合。"},{"n":102,"sec":"第一章 绪论·过拟合","stem":"为了使用线性回归拟合下图，应该先进行（ ）","opts":[{"k":"A","t":"什么都不做"},{"k":"B","t":"生成特征多项式"},{"k":"C","t":"填补缺失值"},{"k":"D","t":"特征选择"}],"ans":"A","multi":false,"note":"本题原卷含图，此处未收录图片\n注：该线拟合较好，不需要进行进一步操作","ex":"线性回归适合拟合线性关系明显的数据。若图示数据本身线性趋势明显、直线已拟合较好，则无需额外处理，直接拟合即可，故选A；生成特征多项式、填补缺失值、特征选择只在对应问题存在时才需要。原题含图，此讲解基于题面信息。"},{"n":103,"sec":"第一章 绪论·过拟合","stem":"为了使用线性回归拟合下图，应该先进行（ ）","opts":[{"k":"A","t":"什么都不做"},{"k":"B","t":"生成特征多项式"},{"k":"C","t":"正则化"},{"k":"D","t":"特征选择"}],"ans":"C","multi":false,"note":"本题原卷含图，此处未收录图片\n注：该图为过拟合，处理过拟合方法有：增加数据量、简化模型、正则化\n补充判断是否过拟合的图（见基于 sklearn 和 pytorch 的机器学习）","ex":"考点是过拟合的处理。图示拟合曲线过度贴合样本点，属于过拟合，常用对策有增加数据量、简化模型、正则化，选项中对应正则化，故选C。原题含图，此讲解基于题面信息。"},{"n":104,"sec":"第一章 绪论·过拟合","stem":"下列哪个结果可能发生过拟合（ ）。（ ）","opts":[{"k":"A","t":"A"},{"k":"B","t":"B"},{"k":"C","t":"C"},{"k":"D","t":"不确定"}],"ans":"C","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考点是过拟合的图形判断。过拟合表现为拟合曲线过度贴合每个训练样本点、起伏剧烈，训练误差虽小但泛化差；原题含图，此讲解基于题面信息，按题库答案选C。"},{"n":105,"sec":"第一章 绪论·过拟合","stem":"下列哪个结果可能发生欠拟合（ ）。（ ）","opts":[{"k":"A","t":"A"},{"k":"B","t":"B"},{"k":"C","t":"C"},{"k":"D","t":"不确定"}],"ans":"A","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考点是欠拟合的图形判断。欠拟合表现为拟合曲线过于简单平直，连训练样本的基本趋势都跟不上，训练误差大；原题含图，此讲解基于题面信息，按题库答案选A。"},{"n":106,"sec":"第一章 绪论·过拟合","stem":"下列哪个拟合效果最好（ ）。（ ）","opts":[{"k":"A","t":"A"},{"k":"B","t":"B"},{"k":"C","t":"C"},{"k":"D","t":"不确定"}],"ans":"B","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考点是拟合效果的比较。效果最好的曲线应既贴合数据整体趋势又平滑不过度弯曲，训练与测试表现都好；原题含图，此讲解基于题面信息，按题库答案选B。"},{"n":107,"sec":"第一章 绪论·过拟合","stem":"下列说法正确的是（ ）。（ ）","opts":[{"k":"A","t":"Boosting 和 bagging 都是组合多个分类器投票的方法，二者都是根据单个分类器的正确率决定其权重"},{"k":"B","t":"梯度下降有时会陷于局部极小值，但 EM 算法不会"},{"k":"C","t":"除了 EM 算法，梯度下降法也可求混合高斯模型的参数"},{"k":"D","t":"基于最小二乘的线性回归问题中，增加 L2 正则项，总能降低在测试集上的MSE 误差"}],"ans":"C","multi":false,"note":"","ex":"考点是集成与优化算法的正误判断。梯度下降同样能优化混合高斯模型的对数似然，C正确；bagging对各分类器简单投票、不按正确率加权，A错；EM也会陷入局部极小，B错；L2正则不保证降低测试集MSE，D错。"},{"n":108,"sec":"第一章 绪论·过拟合","stem":"在线性回回归中使用正则项，你会发现解的不少 coefficient 都是 0，则这个\n正则项可能是（ ）。（ ）\n（1）L0-norm; （2）L1-norm；（3）L2-norm","opts":[{"k":"A","t":"（1）、（2）"},{"k":"B","t":"（2）、（3）"},{"k":"C","t":"（2）"},{"k":"D","t":"（3）"}],"ans":"A","multi":false,"note":"","ex":"考点是范数与稀疏性。L0范数直接限制非零系数个数，L1范数的最优解常落在坐标轴上、能把部分系数压成零，两者都产生稀疏解，故选A；L2范数只整体缩小系数，一般不会得到精确为零的系数。"},{"n":109,"sec":"第一章 绪论·过拟合","stem":"观察样本次数如何影响过拟合（多选）？注意：所有情况的参数都保持一\n致。（ ）","opts":[{"k":"A","t":"观察次数少，容易发生过拟合"},{"k":"B","t":"观察次数少，不容易发生过拟合"},{"k":"C","t":"观察次数多，容易发生过拟合"},{"k":"D","t":"观察次数多，不容易发生过拟合"}],"ans":"AD","multi":true,"note":"解析：如果样本观察次数较少，且样本数量较少，通过提高模型复杂度，例如多\n项式阶数，很容易对所有样本点都拟合的非常好，造成过拟合。但是，如果观察\n次数多，样本更具有代表性，这时候，即使模型复杂，也不容易发生过拟合，得\n到的模型能够较真实地反映真实的数据分布。","ex":"考查观察次数与过拟合的关系。观察次数少、样本量小时，提高模型复杂度很容易把有限样本点都拟合得很好，造成过拟合，A对；观察次数多时样本更具代表性，模型不易死记噪声，D对。B、C与事实相反。"},{"n":110,"sec":"第一章 绪论·过拟合","stem":"如果随机森林模型现在处于欠拟合状态,则下列哪些操作可以提升其性能?\n（ ）","opts":[{"k":"A","t":"增大叶了结点的最小样本数"},{"k":"B","t":"增大决策树的最大深度"},{"k":"C","t":"增大中间结点分裂的最小样本数"},{"k":"D","t":"减小叶子结点的最小样本数"}],"ans":"BD","multi":true,"note":"欠拟合就进行可能过拟合的操作，BD 就属于容易过拟合的操作","ex":"考查欠拟合的调优方向。欠拟合说明模型太弱，应做容易过拟合的调整：增大决策树最大深度让树更复杂，B对；减小叶子结点最小样本数允许更细的分裂，D对。A、C都是限制树生长，会加重欠拟合。"},{"n":111,"sec":"第二章 模型评估与选择","stem":"将数据集 D 进行适当的处理，产生出训练集 S 和测试集 T，有哪些常见的\n做法（ ）？","opts":[{"k":"A","t":"留出法"},{"k":"B","t":"交叉验证法"},{"k":"C","t":"自助法"},{"k":"D","t":"以上都是"}],"ans":"D","multi":false,"note":"","ex":"考查数据集划分的常见做法。留出法、交叉验证法、自助法都是产生训练集与测试集的常见方式，故选D。"},{"n":112,"sec":"第二章 模型评估与选择","stem":"机器学习性能评估是对（ ）进行评估。","opts":[{"k":"A","t":"学习能力"},{"k":"B","t":"查准率和查全率"},{"k":"C","t":"学习方法"},{"k":"D","t":"学习效率"}],"ans":"B","multi":false,"note":"","ex":"考查性能评估的对象。按题库口径，机器学习性能评估是对查准率和查全率这类结果指标进行评估，学习能力、学习方法、学习效率都不是评估对象，故选B。"},{"n":113,"sec":"第二章 模型评估与选择","stem":"在训练集上的误差被称作（ ）。","opts":[{"k":"A","t":"泛化误差"},{"k":"B","t":"经验误差"},{"k":"C","t":"测试误差"},{"k":"D","t":"以上都不对"}],"ans":"B","multi":false,"note":"","ex":"考查经验误差的定义。学习器在训练集上的误差称为经验误差；泛化误差是在新样本上的误差，A项易误选，注意区分，故选B。"},{"n":114,"sec":"第二章 模型评估与选择","stem":"下列（ ）方法可以用来获得从原始数据集中划分出“测试集”?","opts":[{"k":"A","t":"留出法"},{"k":"B","t":"交叉验证法"},{"k":"C","t":"自助法"},{"k":"D","t":"以上都可以"}],"ans":"D","multi":false,"note":"","ex":"考查测试集的获取方式。留出法直接切出一部分作测试集，交叉验证法轮流以某个子集作测试集，自助法用未被抽到的样本作测试集，三者皆可，故选D。"},{"n":115,"sec":"第二章 模型评估与选择","stem":"当学习任务对数据集分布的轻微变化比较鲁棒且数据量较少时,适合使用什\n么样的数据集划分方式? （ ）","opts":[{"k":"A","t":"留出法"},{"k":"B","t":"交又验证法"},{"k":"C","t":"自助法"},{"k":"D","t":"以上三个选项都可以"}],"ans":"C","multi":false,"note":"本题关键是考虑“数据量较少”，此时无论是使用留出法还是交叉验证法，都会使\n得训练集数据量进一步变少，而使用自助法则不改变样本数量（训练集与原样本\n集同规模）；其次考虑“对数据分布轻微变化比较鲁棒”，说明使用自助法时带来\n的训练数据分布变化不会有太多负面影响。综上，本题应该选 C。","ex":"考查小数据量下的划分方式选择。数据少时留出法和交叉验证会进一步缩减训练集，自助法有放回抽样后训练集与原集同规模；题目设定对分布轻微变化鲁棒，正好容忍自助法带来的分布改变，故选C。"},{"n":116,"sec":"第二章 模型评估与选择","stem":"两种算法在某种情况下取得评估结果后不能直接比较以评判优劣的原因中,\n正确的是（ ）","opts":[{"k":"A","t":"测试性能不等于泛化性能"},{"k":"B","t":"测试性能随着测试集的变化而变化"},{"k":"C","t":"很多机器学习算法本身有一定随机性"},{"k":"D","t":"以上均正确"}],"ans":"D","multi":false,"note":"","ex":"考查评估结果不能直接比较的原因。测试性能不等于泛化性能，测试性能随测试集变化而变化，算法本身又有随机性，三个原因都成立，故选D。"},{"n":117,"sec":"第二章 模型评估与选择","stem":"对于留出法,下列说法正确的是（ ）","opts":[{"k":"A","t":"测试集小的时候,评估结果的方差较大"},{"k":"B","t":"训练集小的时候,评估结果的偏差较大"},{"k":"C","t":"留出法需要对数据集进行多次切分并将结果取平均值"},{"k":"D","t":"以上说法均正确"}],"ans":"D","multi":false,"note":"","ex":"考查留出法的性质。测试集小则评估结果方差大，训练集小则偏差大，实践中还常多次随机切分并取平均，三种说法均正确，故选D。"},{"n":118,"sec":"第二章 模型评估与选择","stem":"我们通常将数据集划分为训练集,验证集和测试集进行模型的训练,参数的\n验证需要在____上进行,参数确定后_____重新训练模型。（ ）","opts":[{"k":"A","t":"训练集,需要"},{"k":"B","t":"训练集,不需要"},{"k":"C","t":"验证集,需要"},{"k":"D","t":"验证集,不需要"}],"ans":"C","multi":false,"note":"","ex":"考查验证集的作用。模型参数的验证需在验证集上进行，验证集不参与训练；参数确定后还需重新训练模型，故选C。"},{"n":119,"sec":"第二章 模型评估与选择","stem":"分类错误的样本数占样本总数的比例称为（ ）?（ ）","opts":[{"k":"A","t":"正确率"},{"k":"B","t":"错误率"},{"k":"C","t":"精度"},{"k":"D","t":"误差"}],"ans":"B","multi":false,"note":"","ex":"考查错误率的定义。分类错误的样本数占样本总数的比例称为错误率；精度是分类正确的比例，两者互补，故选B。"},{"n":120,"sec":"第二章 模型评估与选择","stem":"学习器在训练集上的误差称为（ ）?（ ）","opts":[{"k":"A","t":"测试误差"},{"k":"B","t":"训练误差"},{"k":"C","t":"验证误差"},{"k":"D","t":"泛化误差"}],"ans":"B","multi":false,"note":"","ex":"考查训练误差的定义。学习器在训练集上的误差称为训练误差；在新样本上的误差才是泛化误差，注意区分，故选B。"},{"n":121,"sec":"第二章 模型评估与选择","stem":"学习器在新样本上的误差称为（ ）?（ ）","opts":[{"k":"A","t":"测试误差"},{"k":"B","t":"训练误差"},{"k":"C","t":"验证误差"},{"k":"D","t":"泛化误差"}],"ans":"D","multi":false,"note":"","ex":"考查泛化误差的定义。学习器在新样本上的误差称为泛化误差，反映模型的泛化能力；训练集上的误差是训练误差，故选D。"},{"n":122,"sec":"第二章 模型评估与选择","stem":"下列哪个不是常用的训练集与测试集的划分方法（ ）?（ ）","opts":[{"k":"A","t":"留出法"},{"k":"B","t":"最小二乘法"},{"k":"C","t":"交叉验证法"},{"k":"D","t":"自助法"}],"ans":"B","multi":false,"note":"","ex":"考查划分方法辨识。留出法、交叉验证法、自助法都是常用的训练集与测试集划分方法，最小二乘法是线性回归的参数估计方法，故选B。"},{"n":123,"sec":"第二章 模型评估与选择","stem":"若用户关心“检索出的信息中有多少比例是用户感兴趣的”，则应更加看\n重以下哪个性能指标（ ）?（ ）","opts":[{"k":"A","t":"查准率"},{"k":"B","t":"查全率"},{"k":"C","t":"正确率"},{"k":"D","t":"错误率"}],"ans":"A","multi":false,"note":"","ex":"考查查准率的含义。检索出的信息中用户感兴趣的比例，衡量查出的结果有多准，即查准率；若关心所有感兴趣信息被查出的比例才是查全率，故选A。"},{"n":124,"sec":"第二章 模型评估与选择","stem":"关于 k 折交叉验证，下列说法正确的是？（ ）","opts":[{"k":"A","t":"k 值并不是越大越好，k 值过大，会降低运算速度"},{"k":"B","t":"选择更大的 k 值，会让偏差更小，因为 k 值越大，训练集越接近整个训练样本"},{"k":"C","t":"选择合适的 k 值，能减小验方差"},{"k":"D","t":"以上说法都正确"}],"ans":"D","multi":false,"note":"解析：机器学习中，在样本量不充足的情况下，为了充分利用数据集对算法效果\n进行测试，将数据集随机分为 k 个包，每次将其中一个包作为测试集，剩下 k-1\n个包作为训练集进行训练。\nk 折交叉验证的的 k 值不能太大，也不能太小。k 值过大，会降低运算速度。\n若 k 与样本数量 N 相同，则是留一法（Leave-One-Out）。k 值较大，训练集\n越接近整个训练样本，有利于减小模型偏差（bias）。一般可以将 k 作为超参\n数调试，根据表现选择合适的 k 值。\nk 折交叉验证能够有效提高模型的学习能力，类似于增加了训练样本数量，使得\n学习的模型更加稳健，鲁棒性更强。选择合适的 k 值能够有效避免过拟合。","ex":"考查k折交叉验证的性质。k值过大会增加训练次数、降低运算速度；k越大训练集越接近全部样本，偏差更小；选合适的k能减小方差、避免过拟合。三者都对，故选D。"},{"n":125,"sec":"第二章 模型评估与选择","stem":"评估完模型之后，发现模型存在高偏差（high bias），应该如何解决？（ ）","opts":[{"k":"A","t":"减少模型的特征数量"},{"k":"B","t":"增加模型的特征数量"},{"k":"C","t":"增加样本数量"},{"k":"D","t":"以上说法都正确"}],"ans":"B","multi":false,"note":"解析：如果模型存在高偏差（high bias），意味着模型过于简单。为了使模型更\n加健壮，我们可以在特征空间中添加更多的特征。而添加样本数量将减少方差。","ex":"考查高偏差的处理。高偏差说明模型过于简单、欠拟合，应增加特征数量提升模型表达能力；增加样本数量主要用来降低方差，故选B。"},{"n":126,"sec":"第二章 模型评估与选择","stem":"机器学习中的“交叉验证”是指（ ）。","opts":[{"k":"A","t":"将数据集分成多个子集进行多次训练和验证"},{"k":"B","t":"使用外部数据进行验证"},{"k":"C","t":"使用同一数据集进行多次训练"},{"k":"D","t":"使用不同的算法进行验证"}],"ans":"A","multi":false,"note":"","ex":"考查交叉验证的含义。交叉验证是把数据集分成多个子集，多次进行训练和验证，每次用不同子集作验证；用外部数据或换算法验证都不属于交叉验证，故选A。"},{"n":127,"sec":"第二章 模型评估与选择","stem":"下面是交叉验证的几种方法：\n1. Bootstrap\n2. 留一法交叉验证\n3. 5 折交叉验证\n4. 重复使用两次 5 折交叉验证\n请对上面四种方法的执行时间进行排序，样本数量为 1000。（ ）","opts":[{"k":"A","t":"1 > 2 > 3 > 4"},{"k":"B","t":"2 > 4 > 3 > 1"},{"k":"C","t":"4 > 1 > 2 >３"},{"k":"D","t":"2 > 4 > 3 > 1"}],"ans":"D","multi":false,"note":"","ex":"考查验证方法耗时排序。留一法要对1000个样本各训练一次，最耗时；重复两次5折共训练10次；5折共训练5次；Bootstrap相对最快，故为2>4>3>1。选项B与D文字相同，按题库口径取D。"},{"n":128,"sec":"第二章 模型评估与选择","stem":"机器学习中的“混淆矩阵”用于（ ）。","opts":[{"k":"A","t":"评估模型的性能"},{"k":"B","t":"选择特征"},{"k":"C","t":"优化模型的超参数"},{"k":"D","t":"增加数据量"}],"ans":"A","multi":false,"note":"","ex":"考查混淆矩阵的用途。混淆矩阵汇总预测类别与真实类别的组合，用于评估模型性能，并派生出查准率、查全率等指标，与选特征、调超参数无关，故选A。"},{"n":129,"sec":"第二章 模型评估与选择","stem":"以下哪个不是机器学习的常见评估指标（ ）。","opts":[{"k":"A","t":"准确率"},{"k":"B","t":"召回率"},{"k":"C","t":"F1 值"},{"k":"D","t":"网络延迟"}],"ans":"D","multi":false,"note":"","ex":"考查评估指标辨识。准确率、召回率、F1值都是常用模型评估指标，网络延迟衡量系统响应速度，不属于模型评估指标，故选D。"},{"n":130,"sec":"第二章 模型评估与选择","stem":"回归模型性能评估中，均方误差的英文缩写是（ ）。","opts":[{"k":"A","t":"RMSE"},{"k":"B","t":"MSE"},{"k":"C","t":"RMS"},{"k":"D","t":"R Square"}],"ans":"B","multi":false,"note":"","ex":"考查均方误差的英文缩写。均方误差Mean Squared Error缩写为MSE；RMSE是均方根误差的缩写，易混，故选B。"},{"n":131,"sec":"第二章 模型评估与选择","stem":"回归模型性能评估中，均方根误差的英文缩写是（ ） 。","opts":[{"k":"A","t":"RMSE"},{"k":"B","t":"MSE"},{"k":"C","t":"RMS"},{"k":"D","t":"R Square"}],"ans":"A","multi":false,"note":"","ex":"考查均方根误差的英文缩写。均方根误差Root Mean Squared Error缩写为RMSE，即对MSE开平方，故选A。"},{"n":132,"sec":"第二章 模型评估与选择","stem":"回归模型性能评估中，平均绝对误差的英文缩写是（ ）。","opts":[{"k":"A","t":"MSE"},{"k":"B","t":"RMSE"},{"k":"C","t":"MAE"},{"k":"D","t":"MAPE"}],"ans":"C","multi":false,"note":"","ex":"考查平均绝对误差的英文缩写。平均绝对误差Mean Absolute Error缩写为MAE，衡量预测值与真实值绝对误差的平均，故选C。"},{"n":133,"sec":"第二章 模型评估与选择","stem":"以下哪个指标用来衡量回归模型对数据方差的解释程度，越接近 1 表示模\n型越好（ ）。","opts":[{"k":"A","t":"RMSE"},{"k":"B","t":"MSE"},{"k":"C","t":"MAE"},{"k":"D","t":"R2（决定系数）"}],"ans":"D","multi":false,"note":"","ex":"考查决定系数的含义。R2衡量回归模型对数据方差的解释程度，越接近1拟合越好；RMSE、MSE、MAE是误差指标，数值越小越好，故选D。"},{"n":134,"sec":"第二章 模型评估与选择","stem":"与均方误差（MSE）相比，下列哪个指标对异常值（离群点）的鲁棒性更\n好（ ）。","opts":[{"k":"A","t":"RMSE"},{"k":"B","t":"SSE"},{"k":"C","t":"MAE"},{"k":"D","t":"R2（决定系数）"}],"ans":"C","multi":false,"note":"","ex":"考查指标对异常值的鲁棒性。MSE对误差取平方，会放大大误差异常值的影响；MAE只取绝对值，受异常值影响更小、更鲁棒，故选C。"},{"n":135,"sec":"第二章 模型评估与选择","stem":"混淆矩阵的假正是指（ ）","opts":[{"k":"A","t":"模型预测为正的正样本"},{"k":"B","t":"模型预测为正的负样本"},{"k":"C","t":"模型预测为负的正样本"},{"k":"D","t":"模型预测为负的负样本"}],"ans":"B","multi":false,"note":"","ex":"考查混淆矩阵中假正FP的定义。假正指模型预测为正而真实为负的样本，即预测为正的负样本；预测为负的正样本是假负FN，故选B。"},{"n":136,"sec":"第二章 模型评估与选择","stem":"混淆矩阵的真负率公式是为（ ）","opts":[{"k":"A","t":"TP/(TP+FN)"},{"k":"B","t":"FP/(FP+TN)"},{"k":"C","t":"FN/(TP+FN)"},{"k":"D","t":"TN/(TN+FP)"}],"ans":"D","multi":false,"note":"真负率（True Negative Rate, TNR）的公式是 TNR = TN / (TN + FP)。真负率，也称为特指度（specificity），是评估分类模型性能的一个重要指标，特别是在处理不平衡数据集时。它关注的是模型在负类别上的性能，即模型正确预测为负类的样本数占总负类样本数的比例。真负率衡量的是模型在负例上的识别能力，即在真实负例中，模型能够正确识别为负例的比例。这个指标有助于了解模型在避免将负类错误地分类为正类方面的表现。","ex":"考查真负率公式。真负率TNR表示真实负样本中被正确判为负的比例，等于TN/(TN+FP)；TP/(TP+FN)是真正率，故选D。"},{"n":137,"sec":"第二章 模型评估与选择","stem":"有关机器学习分类算法的 precision 和 recall，以下定义中正确的是（假定 tp=\ntrue positive, tn = true negative, fp=false positive, fn= false negative）（ ）。（ ）","opts":[{"k":"A","t":"precision=tp/(tp+fp), recall=tp/(tp+fn)"},{"k":"B","t":"precision=tp/(tn+fp), recall=tp/(tp+fn)"},{"k":"C","t":"precision=tp/(tp+fn), recall=tp/(tp+fp)"},{"k":"D","t":"precision=tp/(tp+fp), recall=tp/(tn+fn)"}],"ans":"A","multi":false,"note":"","ex":"考查precision与recall的公式。precision=tp/(tp+fp)，即预测为正的样本中真正例占比；recall=tp/(tp+fn)，即真实正样本中被查出的占比，故选A。"},{"n":138,"sec":"第二章 模型评估与选择","stem":"混淆矩阵中的 TP=16, FP=12, FN=8, TN=4，则准确率是（ ）","opts":[{"k":"A","t":"1/4"},{"k":"B","t":"1/2"},{"k":"C","t":"4/7"},{"k":"D","t":"4/6"}],"ans":"B","multi":false,"note":"","ex":"考查准确率计算。准确率等于预测正确的样本占比，即(TP+TN)除以总样本数40，(16+4)/40=1/2，故选B。"},{"n":139,"sec":"第二章 模型评估与选择","stem":"混淆矩阵中的 TP=16, FP=12, FN=8, TN=4，则精确率是（ ）","opts":[{"k":"A","t":"1/4"},{"k":"B","t":"1/2"},{"k":"C","t":"4/7"},{"k":"D","t":"2/3"}],"ans":"C","multi":false,"note":"","ex":"考查精确率计算。精确率=TP/(TP+FP)=16/(16+12)=16/28=4/7，故选C。"},{"n":140,"sec":"第二章 模型评估与选择","stem":"混淆矩阵中的 TP=16, FP=12, FN=8, TN=4，则召回率是（ ）","opts":[{"k":"A","t":"1/4"},{"k":"B","t":"1/2"},{"k":"C","t":"4/7"},{"k":"D","t":"2/3"}],"ans":"D","multi":false,"note":"","ex":"考查召回率计算。召回率=TP/(TP+FN)=16/(16+8)=16/24=2/3，故选D。"},{"n":141,"sec":"第二章 模型评估与选择","stem":"混淆矩阵中的 TP=40, FP=10, FN=20, TN=30，则召回率是（ ）。","opts":[{"k":"A","t":"2/3"},{"k":"B","t":"4/5"},{"k":"C","t":"3/4"},{"k":"D","t":"1/3"}],"ans":"A","multi":false,"note":"","ex":"考查召回率计算。召回率=TP/(TP+FN)=40/(40+20)=40/60=2/3，故选A。"},{"n":142,"sec":"第二章 模型评估与选择","stem":"混淆矩阵中的 TP=40, FP=10, FN=20, TN=30，则精确率是（ ）。","opts":[{"k":"A","t":"4/5"},{"k":"B","t":"2/3"},{"k":"C","t":"3/4"},{"k":"D","t":"1/2"}],"ans":"C","multi":false,"note":"","ex":"考查精确率计算。按公式精确率=TP/(TP+FP)=40/(40+10)=4/5，对应选项A的数值；题库标注答案为C即3/4，与公式结果不符。（按题库答案口径）"},{"n":143,"sec":"第二章 模型评估与选择","stem":"混淆矩阵中的 TP=16, FP=12, FN=8, TN=4，则 F1 score 是（ ）","opts":[{"k":"A","t":"4/13"},{"k":"B","t":"8/13"},{"k":"C","t":"4/7"},{"k":"D","t":"2/3"}],"ans":"B","multi":false,"note":"","ex":"考查F1值计算。精确率=16/28=4/7，召回率=16/24=2/3，F1=2PR/(P+R)=8/13，故选B。"},{"n":144,"sec":"第二章 模型评估与选择","stem":"机器学习中的“ROC 曲线”用于（ ）。","opts":[{"k":"A","t":"评估模型的性能"},{"k":"B","t":"选择特征"},{"k":"C","t":"优化模型的超参数"},{"k":"D","t":"增加数据量"}],"ans":"A","multi":false,"note":"","ex":"考查ROC曲线的用途。ROC曲线刻画真正例率随假正例率的变化，用来评估分类模型性能，AUC越大越好，与特征选择、超参数优化无关，故选A。"},{"n":145,"sec":"第二章 模型评估与选择","stem":"ROC 曲线的横轴是（ ）?（ ）","opts":[{"k":"A","t":"真正例率"},{"k":"B","t":"假正例率"},{"k":"C","t":"真负例率"},{"k":"D","t":"假负例率"}],"ans":"B","multi":false,"note":"","ex":"考查ROC曲线的坐标轴。ROC曲线横轴是假正例率，纵轴是真正例率，两者易记反，故选B。"},{"n":146,"sec":"第二章 模型评估与选择","stem":"ROC 曲线的纵轴是（ ）?（ ）","opts":[{"k":"A","t":"真正例率"},{"k":"B","t":"假正例率"},{"k":"C","t":"真负例率"},{"k":"D","t":"假负例率ROC 曲线以真正例率为纵轴，假正例率为横轴，用于研究学习器的泛化能力"}],"ans":"A","multi":false,"note":"注：","ex":"考查ROC曲线的坐标轴。ROC曲线以真正例率为纵轴、假正例率为横轴，用于研究学习器的泛化能力，故选A。"},{"n":147,"sec":"第二章 模型评估与选择","stem":"下图是三个模型在同一个数据集上测试的 ROC 曲线，请问那个模型的效果\n最好（ ）。","opts":[{"k":"A","t":"Random forest"},{"k":"B","t":"Logistic Regression"},{"k":"C","t":"Decision Tree"},{"k":"D","t":"不能判断"}],"ans":"A","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考查用ROC曲线比较模型。ROC曲线越靠左上角、AUC越大，模型越好；题库口径下随机森林的曲线最优，故选A。原题含图，此讲解基于题面信息。"},{"n":148,"sec":"第二章 模型评估与选择","stem":"下图是三个模型在同一个数据集上测试的 ROC 曲线，请问那个模型的效果\n最好（ ）。","opts":[{"k":"A","t":"KNN"},{"k":"B","t":"Naive Bayes"},{"k":"C","t":"Decision Tree"},{"k":"D","t":"不能判断"}],"ans":"B","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考查用ROC曲线比较模型。曲线越靠左上角AUC越大性能越好，题库口径下朴素贝叶斯最优，故选B。原题含图，此讲解基于题面信息。"},{"n":149,"sec":"第二章 模型评估与选择","stem":"PR 曲线中 P 代表的是（ ）。","opts":[{"k":"A","t":"预测出正例的保证性"},{"k":"B","t":"预测出正例的正确率"},{"k":"C","t":"预测出负例的保证性"},{"k":"D","t":"预测出负例的正确率"}],"ans":"B","multi":false,"note":"","ex":"考查PR曲线中P的含义。P指查准率，即预测出的正例中真正例的比例，也就是预测出正例的正确率；R指查全率，故选B。"},{"n":150,"sec":"第二章 模型评估与选择","stem":"下图是不同学习器的 PR 曲线。请问哪个学习器的效果最好？（ ）。","opts":[{"k":"A","t":"学习器 A"},{"k":"B","t":"学习器 B"},{"k":"C","t":"学习器 C"},{"k":"D","t":"没法确定"}],"ans":"A","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考查PR曲线比较学习器。PR曲线越靠右上方的学习器性能越好，题库口径下学习器A最优，故选A。原题含图，此讲解基于题面信息。"},{"n":151,"sec":"第二章 模型评估与选择","stem":"当西瓜收购公司去瓜摊收购西瓜时既希望把好瓜都收走 J 尽可能的少，请\n问他应该考虑( )评价指标?","opts":[{"k":"A","t":"精度"},{"k":"B","t":"查全率"},{"k":"C","t":"查准率"},{"k":"D","t":"F1 度量"}],"ans":"D","multi":false,"note":"","ex":"考查评价指标的选择。既希望好瓜都收走对应查全率要高，又希望收进来的坏瓜尽可能少对应查准率要高，两者需兼顾，F1度量综合查全与查准，故选D。"},{"n":152,"sec":"第二章 模型评估与选择","stem":"收购西瓜的公司希望把瓜摊的好瓜都尽量收走，请问他的评价标准是?（ ）","opts":[{"k":"A","t":"错误率"},{"k":"B","t":"精度"},{"k":"C","t":"查准率"},{"k":"D","t":"查全率"}],"ans":"D","multi":false,"note":"","ex":"考查查全率的含义。把瓜摊的好瓜都尽量收走，关注的是所有好瓜中被收走的比例，即查全率；查准率关注收走的瓜中好瓜比例，故选D。"},{"n":153,"sec":"第二章 模型评估与选择","stem":"当西瓜收购公司去瓜摊收购西瓜时即希望把好瓜都收走又保证收到的瓜中\n坏瓜尽可能的少,请问他应该考虑什么评价指标?（ ）","opts":[{"k":"A","t":"精度"},{"k":"B","t":"查全率"},{"k":"C","t":"查准率"},{"k":"D","t":"F1 度量"}],"ans":"D","multi":false,"note":"本题希望“既” 把好瓜都收走，“又”要求坏瓜尽可能的少，所以需要一个综合考\n虑查全率、查准率的性能度量，而 F1 度量恰好对查全率、查准率均有所考虑，\n因此本题选 D。","ex":"考查F1度量适用场景。把好瓜都收走是查全率高，收到的瓜中坏瓜少是查准率高，两个目标同时要求，F1作为查全率与查准率的调和平均恰好兼顾，故选D。"},{"n":154,"sec":"第二章 模型评估与选择","stem":"下列哪个指标不是用于评估回归算法（ ）？","opts":[{"k":"A","t":"F1"},{"k":"B","t":"MAE"},{"k":"C","t":"MSE"},{"k":"D","t":"R2"}],"ans":"A","multi":false,"note":"","ex":"考查回归评估指标辨识。MAE、MSE、R2都是回归常用指标，F1基于查准率与查全率，用于分类任务，不用于回归，故选A。"},{"n":155,"sec":"第二章 模型评估与选择","stem":"哪个指标可以用于评估分类算法（ ）","opts":[{"k":"A","t":"F1"},{"k":"B","t":"MAE"},{"k":"C","t":"MSE"},{"k":"D","t":"R2"}],"ans":"A","multi":false,"note":"","ex":"考查分类评估指标辨识。F1综合查准率与查全率，是分类任务的评价指标；MAE、MSE、R2用于回归任务，故选A。"},{"n":156,"sec":"第二章 模型评估与选择","stem":"决定系数是（ ）","opts":[{"k":"A","t":"R2"},{"k":"B","t":"F1"},{"k":"C","t":"MAE"},{"k":"D","t":"MSE"}],"ans":"A","multi":false,"note":"","ex":"考查决定系数的记号。决定系数记作R2，衡量回归模型对数据方差的解释程度；F1、MAE、MSE分别是分类指标与回归误差指标，故选A。"},{"n":157,"sec":"第二章 模型评估与选择","stem":"平均绝对误差是（ ）","opts":[{"k":"A","t":"R2"},{"k":"B","t":"F1"},{"k":"C","t":"MSE"},{"k":"D","t":"MAE平均绝对误差是所有单个观测值与算术平均值的偏差的绝对值的平均平均绝对误差(Mean Absolute Error,简称 MAE)是一种用于衡量预测模型在连续性数据上的预测精度的指标。它衡量了预测值与真实值之间的平均绝对差异"}],"ans":"D","multi":false,"note":"","ex":"考查平均绝对误差的名称。平均绝对误差即MAE，衡量预测值与真实值之间平均绝对差异；MSE是均方误差，R2是决定系数，故选D。"},{"n":158,"sec":"第二章 模型评估与选择","stem":"均方误差是（ ）","opts":[{"k":"A","t":"R2"},{"k":"B","t":"F1"},{"k":"C","t":"MSE"},{"k":"D","t":"MAE"}],"ans":"C","multi":false,"note":"","ex":"考查均方误差的名称。均方误差即MSE，对预测误差取平方后求平均；MAE是平均绝对误差，易混，故选C。"},{"n":159,"sec":"第二章 模型评估与选择","stem":"下面有关分类算法的准确率，召回率，F1 值的描述，错误的是？ （ ）","opts":[{"k":"A","t":"准确率是检索出相关文档数与检索出的文档总数的比率，衡量的是检索系统的查准率"},{"k":"B","t":"召回率是指检索出的相关文档数和文档库中所有的相关文档数的比率，衡量的是检索系统的查全率"},{"k":"C","t":"正确率、召回率和 F 值取值都在 0 和 1 之间，数值越接近 0，查准率或查全率就越高"},{"k":"D","t":"为了解决准确率和召回率冲突问题，引入了 F1 分数"}],"ans":"C","multi":false,"note":"解析：对于二类分类问题常用的评价指标是精准度（precision）与召回率（recall）。\n通常以关注的类为正类，其他类为负类，分类器在测试数据集上的预测或正确或\n不正确，\n精准率和召回率和 F1 取值都在 0 和 1 之间，精准率和召回率高，F1 值也会\n高，不存在数值越接近 0 越高的说法，应该是数值越接近 1 越高。","ex":"考查准确率召回率F1的性质。三者取值均在0与1之间，且越接近1查准或查全越高，C项说越接近0越高，说法错误，故选C。"},{"n":160,"sec":"第二章 模型评估与选择","stem":"下面哪句话是正确的（ ）？","opts":[{"k":"A","t":"机器学习模型的精准度越高，则模型的性能越好"},{"k":"B","t":"增加模型的复杂度，总能减小测试样本误差"},{"k":"C","t":"增加模型的复杂度，总能减小训练样本误差"},{"k":"D","t":"以上说法都不对"}],"ans":"C","multi":false,"note":"","ex":"考查模型复杂度与误差的关系。模型越复杂对训练数据拟合能力越强，总能减小训练误差，故C对；精度高不代表性能好，测试误差也可能因过拟合而增大，A、B错误。"},{"n":161,"sec":"第二章 模型评估与选择","stem":"下面是交叉验证的几种方法：\n1. Bootstrap\n2. 留一法交叉验证\n3. 5 折交叉验证\n4. 重复使用两次 5 折交叉验证\n请对上面四种方法的执行时间进行排序，样本数量为 1000。（ ）","opts":[{"k":"A","t":"1 > 2 > 3 > 4"},{"k":"B","t":"2 > 4 > 3 > 1"},{"k":"C","t":"4 > 1 > 2 >３"},{"k":"D","t":"2 > 4 > 3 > 1"}],"ans":"D","multi":false,"note":"注：boostrap 是又放回地抽取样本","ex":"考查验证方法耗时排序。留一法要对1000个样本各训练一次，最耗时；重复两次5折共训练10次；5折共训练5次；Bootstrap相对最快，故为2>4>3>1。选项B与D文字相同，按题库口径取D。"},{"n":162,"sec":"第三章 线性模型","stem":"线性回归模型的核心目的是？（ ）","opts":[{"k":"A","t":"分类数据"},{"k":"B","t":"预测连续值"},{"k":"C","t":"降维处理"},{"k":"D","t":"聚类分析"}],"ans":"B","multi":false,"note":"","ex":"考查线性回归的目的。线性回归通过拟合直线或超平面来预测连续值输出；分类、降维、聚类分别是其他类型任务，故选B。"},{"n":163,"sec":"第三章 线性模型","stem":"线性回归模型的目标是什么？（ ）","opts":[{"k":"A","t":"最大化数据点与拟合线之间的残差绝对值之和"},{"k":"B","t":"最小化数据点与拟合线之间的残差绝对值之和"},{"k":"C","t":"最大化数据点与拟合线之间的残差平方和"},{"k":"D","t":"最小化数据点与拟合线之间的残差平方和"}],"ans":"D","multi":false,"note":"","ex":"考点是线性回归的优化目标。线性回归用最小二乘思想拟合直线，让所有样本到拟合线的残差平方和最小，故选D；A、C是最大化残差，方向相反，B用的是绝对值而非平方。"},{"n":164,"sec":"第三章 线性模型","stem":"下列哪项是线性回归的基本假设？（ ）","opts":[{"k":"A","t":"特征间完全独立"},{"k":"B","t":"误差项均值为 1"},{"k":"C","t":"误差项服从正态分布"},{"k":"D","t":"因变量必须是离散的"}],"ans":"C","multi":false,"note":"","ex":"考点是线性回归的基本假设。经典线性回归假设误差项服从正态分布，故选C；误差项均值应为0不是1，因变量是连续值而非离散值，特征间也不要求完全独立。"},{"n":165,"sec":"第三章 线性模型","stem":"线性回归模型的假设不包括以下哪一项？（ ）","opts":[{"k":"A","t":"线性假设"},{"k":"B","t":"同方差性假设"},{"k":"C","t":"高斯假设"},{"k":"D","t":"独立性假设"}],"ans":"C","multi":false,"note":"","ex":"考点是线性回归的经典假设。线性假设、同方差性、独立性都是标准基本假设，高斯假设不属于其中的标准提法，故选C。"},{"n":166,"sec":"第三章 线性模型","stem":"线性回归中，损失函数通常采用？（ ）","opts":[{"k":"A","t":"交叉熵"},{"k":"B","t":"平方误差"},{"k":"C","t":"铰链损失"},{"k":"D","t":"对数损失"}],"ans":"B","multi":false,"note":"","ex":"考点是线性回归的损失函数。线性回归用平方误差衡量预测与真实值的差距，最小化它可得参数闭式解，故选B；交叉熵与对数损失用于分类，铰链损失用于支持向量机。"},{"n":167,"sec":"第三章 线性模型","stem":"线性回归模型中的损失函数通常是（ ）。","opts":[{"k":"A","t":"交叉熵损失"},{"k":"B","t":"均方误差（MSE）"},{"k":"C","t":"二元交叉熵损失"},{"k":"D","t":"信息熵"}],"ans":"B","multi":false,"note":"","ex":"考点是线性回归的损失函数。均方误差MSE是残差平方的均值，是线性回归的标准损失，故选B；交叉熵损失用于分类问题，信息熵衡量不确定性，都不是回归损失。"},{"n":168,"sec":"第三章 线性模型","stem":"在线性回归中，特征缩放的主要目的是（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"提高模型的准确性"},{"k":"D","t":"使特征具有相同的尺度"}],"ans":"D","multi":false,"note":"","ex":"考点是特征缩放的目的。特征缩放把不同量纲的特征统一到相同尺度，让梯度下降更新更均衡、收敛更稳定，故选D；它不增加模型复杂度，也不直接保证提高准确性。"},{"n":169,"sec":"第三章 线性模型","stem":"线性回归模型中的特征选择方法不包括（ ）。","opts":[{"k":"A","t":"前向选择"},{"k":"B","t":"后向消除"},{"k":"C","t":"逐步选择"},{"k":"D","t":"随机选择"}],"ans":"D","multi":false,"note":"","ex":"考点是特征选择方法。前向选择逐个加入特征，后向消除逐个剔除，逐步选择将两者结合，都是系统化方法；随机选择没有准则，不属于特征选择方法，故选D。"},{"n":170,"sec":"第三章 线性模型","stem":"在线性回归中，以下哪个指标用于评估模型的拟合优度？（ ）","opts":[{"k":"A","t":"R²"},{"k":"B","t":"F1 分数"},{"k":"C","t":"精确度"},{"k":"D","t":"召回率"}],"ans":"A","multi":false,"note":"","ex":"考点是回归拟合优度指标。R2表示模型能解释因变量变异的比例，越接近1拟合越好，故选A；F1分数、精确度、召回率都是分类任务的评价指标，不适用于回归。"},{"n":171,"sec":"第三章 线性模型","stem":"用于评估线性回归模型拟合效果的指标是？（ ）","opts":[{"k":"A","t":"准确率"},{"k":"B","t":"召回率"},{"k":"C","t":"R² 值"},{"k":"D","t":"F1 分数"}],"ans":"C","multi":false,"note":"","ex":"考点是回归评估指标。R2值衡量线性回归对数据变异的解释程度，是拟合效果指标，故选C；准确率、召回率、F1分数均针对分类任务。"},{"n":172,"sec":"第三章 线性模型","stem":"简单线性回归中，自变量的数量是？（ ）","opts":[{"k":"A","t":"1 个"},{"k":"B","t":"2 个"},{"k":"C","t":"3 个"},{"k":"D","t":"任意个"}],"ans":"A","multi":false,"note":"","ex":"考点是简单线性回归的定义。简单线性回归只含一个自变量，形式为y=ax+b；自变量多于一个时称为多元线性回归，故选A。"},{"n":173,"sec":"第三章 线性模型","stem":"多重线性回归中，若特征间存在高度相关性会导致？（ ）","opts":[{"k":"A","t":"过拟合"},{"k":"B","t":"欠拟合"},{"k":"C","t":"多重共线性"},{"k":"D","t":"误差减小"}],"ans":"C","multi":false,"note":"","ex":"考点是多重共线性。多元线性回归中特征之间高度相关就是多重共线性，会使系数估计不稳定、难以解释单个特征的作用，故选C；过拟合由模型过于复杂引起，与共线性是两回事。"},{"n":174,"sec":"第三章 线性模型","stem":"线性回归参数估计中，最小二乘法的目标是？（ ）","opts":[{"k":"A","t":"最大化似然函数"},{"k":"B","t":"最小化误差平方和"},{"k":"C","t":"最小化绝对误差和"},{"k":"D","t":"最大化 R² 值"}],"ans":"B","multi":false,"note":"","ex":"考点是最小二乘法。最小二乘法通过最小化误差即残差的平方和来估计回归参数，故选B；最小化绝对误差和对应最小绝对偏差法，不是最小二乘。"},{"n":175,"sec":"第三章 线性模型","stem":"下列哪种情况可能导致线性回归模型过拟合？（ ）","opts":[{"k":"A","t":"特征数量过少"},{"k":"B","t":"训练数据过多"},{"k":"C","t":"模型过于复杂"},{"k":"D","t":"正则化强度过大"}],"ans":"C","multi":false,"note":"","ex":"考点是过拟合的成因。模型过于复杂会把训练数据中的噪声细节也学进去，导致过拟合，故选C；特征过少容易欠拟合，正则化强度过大抑制模型复杂度，同样偏向欠拟合。"},{"n":176,"sec":"第三章 线性模型","stem":"L1 正则化在线性回归中的应用被称为？（ ）","opts":[{"k":"A","t":"Ridge 回归"},{"k":"B","t":"Lasso 回归"},{"k":"C","t":"Elastic Net"},{"k":"D","t":"逻辑回归"}],"ans":"B","multi":false,"note":"","ex":"考点是正则化与模型名的对应。L1正则化加入线性回归后称为Lasso回归，L1惩罚可把部分系数压缩为零，故选B；L2对应Ridge回归，L1加L2是Elastic Net。"},{"n":177,"sec":"第三章 线性模型","stem":"L2 正则化在线性回归中的应用被称为？（ ）","opts":[{"k":"A","t":"Ridge 回归"},{"k":"B","t":"Lasso 回归"},{"k":"C","t":"Elastic Net"},{"k":"D","t":"逻辑回归"}],"ans":"A","multi":false,"note":"","ex":"考点是正则化与模型名的对应。L2正则化加入线性回归后称为Ridge回归即岭回归，通过惩罚系数平方项控制模型复杂度，故选A；L1对应Lasso回归。"},{"n":178,"sec":"第三章 线性模型","stem":"线性回归模型中的正则化方法不包括（ ）。","opts":[{"k":"A","t":"L1 正则化（Lasso）"},{"k":"B","t":"L2 正则化（Ridge）"},{"k":"C","t":"Dropout"},{"k":"D","t":"Elastic Net"}],"ans":"C","multi":false,"note":"","ex":"考点是正则化方法的适用范围。Lasso、Ridge、Elastic Net都是线性回归常用的正则化；Dropout是神经网络中随机丢弃神经元的正则化手段，不用于线性回归，故选C。"},{"n":179,"sec":"第三章 线性模型","stem":"线性回归中，偏回归系数表示？（ ）","opts":[{"k":"A","t":"自变量每变化 1 单位，因变量的平均变化量"},{"k":"B","t":"因变量对自变量的影响程度"},{"k":"C","t":"特征的重要性排序"},{"k":"D","t":"误差项的大小"}],"ans":"A","multi":false,"note":"","ex":"考点是回归系数的含义。偏回归系数表示其他自变量保持不变时，该自变量每变化1个单位，因变量平均变化的数量，故选A；系数大小不等于特征重要性，还受量纲影响。"},{"n":180,"sec":"第三章 线性模型","stem":"下列哪项不属于线性回归的扩展模型？（ ）","opts":[{"k":"A","t":"多项式回归"},{"k":"B","t":"岭回归"},{"k":"C","t":"决策树回归"},{"k":"D","t":"Lasso 回归"}],"ans":"C","multi":false,"note":"","ex":"考点是线性回归的扩展模型。多项式回归、岭回归、Lasso回归都建立在线性模型框架上，属于其扩展；决策树回归基于树结构切分数据，是非线性模型，故选C。"},{"n":181,"sec":"第三章 线性模型","stem":"线性回归模型中，误差项的方差应满足？（ ）","opts":[{"k":"A","t":"异方差性"},{"k":"B","t":"同方差性"},{"k":"C","t":"随自变量增大而增大"},{"k":"D","t":"随自变量增大而减小"}],"ans":"B","multi":false,"note":"","ex":"考点是同方差性假设。经典线性回归要求误差项方差保持恒定，即同方差性，故选B；方差随自变量变化属于异方差，违反该假设会影响估计的有效性。"},{"n":182,"sec":"第三章 线性模型","stem":"用梯度下降法求解线性回归参数时，学习率过大可能导致？（ ）","opts":[{"k":"A","t":"收敛速度过快"},{"k":"B","t":"陷入局部最优"},{"k":"C","t":"无法收敛"},{"k":"D","t":"参数更新缓慢"}],"ans":"C","multi":false,"note":"","ex":"考点是梯度下降的学习率。学习率过大会使每步更新跨度过大，损失在最小值附近来回震荡甚至发散，无法收敛，故选C；学习率过小才是参数更新缓慢、收敛慢。"},{"n":183,"sec":"第三章 线性模型","stem":"线性回归假设自变量与因变量的关系是？（ ）","opts":[{"k":"A","t":"非线性"},{"k":"B","t":"线性"},{"k":"C","t":"指数关系"},{"k":"D","t":"对数关系"}],"ans":"B","multi":false,"note":"","ex":"考点是线性假设。线性回归假设自变量与因变量之间存在线性关系，模型是特征的线性组合，这也是其名称由来，故选B。"},{"n":184,"sec":"第三章 线性模型","stem":"下列哪种工具不适合实现线性回归模型？（ ）","opts":[{"k":"A","t":"Python 的 scikit-learn 库"},{"k":"B","t":"R 的 lm 函数"},{"k":"C","t":"SQL"},{"k":"D","t":"TensorFlow"}],"ans":"C","multi":false,"note":"","ex":"考点是建模工具的选择。scikit-learn、R的lm函数、TensorFlow都能实现线性回归；SQL是数据库查询语言，不能直接训练模型，故选C。"},{"n":185,"sec":"第三章 线性模型","stem":"当线性回归模型的 R² 值为 0 时，表示？（ ）","opts":[{"k":"A","t":"模型完全拟合数据"},{"k":"B","t":"自变量与因变量无线性关系"},{"k":"C","t":"误差项为 0"},{"k":"D","t":"特征选择最优"}],"ans":"B","multi":false,"note":"","ex":"考点是R2的含义。R2为0说明模型对因变量变异的解释能力为零，自变量与因变量没有线性关系，故选B；R2为1才代表完全拟合，误差项为0与R2无关。"},{"n":186,"sec":"第三章 线性模型","stem":"多项式回归本质上属于？（ ）","opts":[{"k":"A","t":"非线性模型"},{"k":"B","t":"线性模型"},{"k":"C","t":"树模型"},{"k":"D","t":"概率模型"}],"ans":"B","multi":false,"note":"","ex":"考点是多项式回归的实质。多项式回归只是把特征替换为多项式项，模型参数仍是线性组合的形式，对参数而言是线性的，因此本质上仍属于线性模型，故选B。"},{"n":187,"sec":"第三章 线性模型","stem":"线性回归中，对异常值敏感的原因是使用了？（ ）","opts":[{"k":"A","t":"平方误差"},{"k":"B","t":"绝对误差"},{"k":"C","t":"对数误差"},{"k":"D","t":"铰链误差"}],"ans":"A","multi":false,"note":"","ex":"考点是平方损失对异常值的敏感性。平方误差把残差平方放大，个别异常值产生的大残差会主导总损失，拉动拟合线偏移，故选A；绝对误差对大残差的放大程度小得多。"},{"n":188,"sec":"第三章 线性模型","stem":"岭回归（Ridge Regression）使用的正则化方式是？（ ）","opts":[{"k":"A","t":"L1 正则化"},{"k":"B","t":"L2 正则化"},{"k":"C","t":"L1+L2 正则化"},{"k":"D","t":"无正则化"}],"ans":"B","multi":false,"note":"","ex":"考点是岭回归的正则化。岭回归在平方损失后加入系数的L2范数惩罚项，用于压缩系数、缓解多重共线性，故选B；L1正则化对应的是Lasso回归。"},{"n":189,"sec":"第三章 线性模型","stem":"线性回归模型的预测结果不可能出现的情况是？（ ）","opts":[{"k":"A","t":"大于训练数据中的最大值"},{"k":"B","t":"小于训练数据中的最小值"},{"k":"C","t":"等于因变量的真实值"},{"k":"D","t":"只能是训练数据中已有的值"}],"ans":"D","multi":false,"note":"","ex":"考点是回归输出的性质。线性回归输出连续数值，完全可以大于训练数据的最大值或小于最小值，也可能恰好等于真实值；它并不局限于训练数据中出现过的取值，因此D是不可能出现的情况。"},{"n":190,"sec":"第三章 线性模型","stem":"线性回归模型中的参数更新通常使用哪种优化算法？（ ）","opts":[{"k":"A","t":"梯度下降"},{"k":"B","t":"随机梯度下降"},{"k":"C","t":"动量梯度下降"},{"k":"D","t":"所有上述选项"}],"ans":"D","multi":false,"note":"","ex":"考点是线性回归的优化算法。梯度下降、随机梯度下降、动量梯度下降都是可用的参数更新方法，只是批量和动量策略不同，故选D，全部适用。"},{"n":191,"sec":"第三章 线性模型","stem":"线性回归模型中的特征工程不包括（ ）。","opts":[{"k":"A","t":"多项式特征"},{"k":"B","t":"交互特征"},{"k":"C","t":"编码分类特征"},{"k":"D","t":"数据清洗"}],"ans":"D","multi":false,"note":"","ex":"考点是特征工程的边界。构造多项式特征、交互特征、编码分类特征都是在生成或转换特征，属于特征工程；数据清洗处理缺失值和异常值，属于数据预处理环节，故选D。"},{"n":192,"sec":"第三章 线性模型","stem":"线性回归模型中的残差是指（ ）。","opts":[{"k":"A","t":"预测值与实际值之间的差异"},{"k":"B","t":"预测值与均值之间的差异"},{"k":"C","t":"实际值与均值之间的差异"},{"k":"D","t":"预测值与中位数之间的差异"}],"ans":"A","multi":false,"note":"","ex":"考点是残差的定义。残差是单个样本的预测值与实际值之差，反映拟合误差，故选A；实际值与均值之差用于方差分解，与残差概念不同。"},{"n":193,"sec":"第三章 线性模型","stem":"线性回归模型中的多重共线性是指（ ）。","opts":[{"k":"A","t":"特征之间存在线性关系"},{"k":"B","t":"特征之间完全独立"},{"k":"C","t":"特征之间存在非线性关系"},{"k":"D","t":"特征之间没有相关性"}],"ans":"A","multi":false,"note":"","ex":"考点是多重共线性的定义。多重共线性指特征变量之间存在近似的线性关系，会使最小二乘系数估计不稳定，故选A；特征完全独立或没有相关性恰是希望的情况。"},{"n":194,"sec":"第三章 线性模型","stem":"线性回归模型中的最大似然估计（MLE）通常用于（ ）。","opts":[{"k":"A","t":"估计模型参数"},{"k":"B","t":"评估模型性能"},{"k":"C","t":"选择特征"},{"k":"D","t":"优化损失函数"}],"ans":"A","multi":false,"note":"","ex":"考点是最大似然估计的作用。MLE通过让观测数据出现的概率最大来估计模型参数，在线性回归中与最小二乘等价，故选A；评估性能、选择特征不是它的用途。"},{"n":195,"sec":"第三章 线性模型","stem":"线性回归模型中的岭回归（Ridge Regression）主要用于（ ）。","opts":[{"k":"A","t":"增加模型复杂度"},{"k":"B","t":"减少模型复杂度"},{"k":"C","t":"增加数据量"},{"k":"D","t":"减少数据量"}],"ans":"B","multi":false,"note":"","ex":"考点是岭回归的目的。岭回归用L2惩罚压缩系数，降低模型复杂度、防止过拟合，故选B；它不是用来增减数据量的手段。"},{"n":196,"sec":"第三章 线性模型","stem":"线性回归模型中的 Lasso 回归主要用于（ ）。","opts":[{"k":"A","t":"增加模型复杂度"},{"k":"B","t":"减少模型复杂度"},{"k":"C","t":"增加数据量"},{"k":"D","t":"减少数据量"}],"ans":"B","multi":false,"note":"","ex":"考点是Lasso回归的目的。Lasso用L1惩罚减少有效特征数量，从而降低模型复杂度、防止过拟合，还兼具特征选择作用，故选B。"},{"n":197,"sec":"第三章 线性模型","stem":"线性回归模型中的 Elastic Net 回归主要用于（ ）。","opts":[{"k":"A","t":"增加模型复杂度"},{"k":"B","t":"减少模型复杂度"},{"k":"C","t":"增加数据量"},{"k":"D","t":"减少数据量"}],"ans":"B","multi":false,"note":"","ex":"考点是弹性网络的目的。Elastic Net结合L1与L2两种惩罚，同样用于降低模型复杂度、防止过拟合，故选B；与数据量的增减无关。"},{"n":198,"sec":"第三章 线性模型","stem":"线性回归能完成的任务是（ ）。","opts":[{"k":"A","t":"预测离散值"},{"k":"B","t":"预测连续值"},{"k":"C","t":"分类"},{"k":"D","t":"聚类"}],"ans":"B","multi":false,"note":"","ex":"考点是线性回归的任务类型。线性回归输出连续数值，用于回归预测任务，故选B；预测离散类别是分类任务，聚类属于无监督学习，线性回归都不能直接完成。"},{"n":199,"sec":"第三章 线性模型","stem":"下列属于线性分类方法的是（ ）。","opts":[{"k":"A","t":"决策树"},{"k":"B","t":"感知机"},{"k":"C","t":"最近邻"},{"k":"D","t":"集成学习"}],"ans":"B","multi":false,"note":"","ex":"考点是线性分类方法。感知机用一个线性超平面把两类样本分开，是典型的线性分类方法，故选B；决策树按特征阈值划分空间，最近邻基于距离，集成学习是模型组合。"},{"n":200,"sec":"第三章 线性模型","stem":"以下哪个模型没有超参数? （ ）","opts":[{"k":"A","t":"最小二乘线性回归"},{"k":"B","t":"岭回归"},{"k":"C","t":"Lasso 回归"},{"k":"D","t":"弹性网络回归"}],"ans":"A","multi":false,"note":"最小二乘回归无正则项","ex":"考点是超参数。最小二乘线性回归没有正则项，直接解正规方程即可，不含需要人为设定的超参数，故选A；岭回归、Lasso、弹性网络都有正则化强度等超参数。"},{"n":201,"sec":"第三章 线性模型","stem":"【多选】回归算法有（ ）。","opts":[{"k":"A","t":"简单线
