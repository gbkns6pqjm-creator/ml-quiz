性回归"},{"k":"B","t":"多元线性回归"},{"k":"C","t":"有限元回归"},{"k":"D","t":"多项式回归"}],"ans":"ACD","multi":true,"note":"","ex":"考点是回归算法的识别。按题库口径，简单线性回归、有限元回归、多项式回归均计入回归算法，选ACD；多元线性回归通常也属回归算法，本题未计入（按题库答案口径）。"},{"n":202,"sec":"第三章 线性模型","stem":"【多选】回归模型有（ ）.","opts":[{"k":"A","t":"简单线性回归"},{"k":"B","t":"多元线性回归"},{"k":"C","t":"最小算子回归"},{"k":"D","t":"弹性回归"}],"ans":"ABD","multi":true,"note":"","ex":"考点是回归模型的识别。简单线性回归、多元线性回归、弹性回归即弹性网络回归都是回归模型，选ABD；最小算子回归不是常见的回归模型名称，不选。"},{"n":203,"sec":"第三章 线性模型","stem":"构建一个最简单的线性回归模型需要几个系数（只有一个特征）？（ ）","opts":[{"k":"A","t":"1 个"},{"k":"B","t":"2 个"},{"k":"C","t":"3 个"},{"k":"D","t":"4 个"}],"ans":"B","multi":false,"note":"解析：最简单的线性回归模型，只有一个特征，即 Y = aX + b，包含 a 和 b 两\n个系数。","ex":"考点是模型参数个数。只有一个特征的最简单线性回归形如y=ax+b，包含斜率a和截距b两个系数，故选B。"},{"n":204,"sec":"第三章 线性模型","stem":"最小二乘法的求解步骤是什么?（ ）\n(1)均方误差对 w 与 b 求偏导; (2) 令偏导为 0; (3)求解线性方程组。","opts":[{"k":"A","t":"（1）（2）（3）"},{"k":"B","t":"（1）（3）（2）"},{"k":"C","t":"（2）（1）（3）"},{"k":"D","t":"（3）（1）（2）"}],"ans":"A","multi":false,"note":"","ex":"考点是最小二乘法的求解流程。先对均方误差关于w和b求偏导，再令偏导为零得到方程组，最后求解该线性方程组，顺序为（1）（2）（3），故选A。"},{"n":205,"sec":"第三章 线性模型","stem":"当下列那个条件满足时，多元线性回归的最小二乘解唯一?（ ）","opts":[{"k":"A","t":"X>X 不满秩"},{"k":"B","t":"X>X 满秩"},{"k":"C","t":"XX> 满秩"},{"k":"D","t":"XX> 不满秩"}],"ans":"B","multi":false,"note":"线性代数知识：满秩才有唯一解","ex":"考点是最小二乘解的唯一性条件。当样本矩阵X的转置与自身相乘所得矩阵满秩时，正规方程存在唯一解；不满秩时会有多个解，故选B。"},{"n":206,"sec":"第三章 线性模型","stem":"假如使用一个较复杂的回归模型来拟合样本数据，使用 Ridge 回归，调试\n正则化参数 λ，来降低模型复杂度。若 λ 较大时，关于偏差（bias）和方差\n（variance），下列说法正确的是（ ）？","opts":[{"k":"A","t":"若 λ 较大时，偏差减小，方差减小"},{"k":"B","t":"若 λ 较大时，偏差减小，方差增大"},{"k":"C","t":"若 λ 较大时，偏差增大，方差减小"},{"k":"D","t":"若 λ 较大时，偏差增大，方差增大差增大，方差减小。做个简单总结：λ 较小：偏差减小，方差增大，容易发生过拟合λ 较大：偏差增大，方差减小，容易发生欠拟合"}],"ans":"C","multi":false,"note":"解析：若 λ 较大时，意味着模型复杂度较低，这时候容易发生欠拟合，对应偏","ex":"考点是正则化参数与偏差方差的权衡。λ越大，惩罚越强，模型越简单，方差减小而偏差增大，容易欠拟合，故选C；λ较小时则相反，容易过拟合。"},{"n":207,"sec":"第三章 线性模型","stem":"假如使用一个较复杂的回归模型来拟合样本数据，使用 Ridge 回归，调试\n正则化参数 λ，来降低模型复杂度。若 λ 较小时，关于偏差（bias）和方差\n（variance），下列说法正确的是（ ）？","opts":[{"k":"A","t":"若 λ 较小时，偏差减小，方差减小"},{"k":"B","t":"若 λ 较小时，偏差减小，方差增大"},{"k":"C","t":"若 λ 较小时，偏差增大，方差减小"},{"k":"D","t":"若 λ 较小时，偏差增大，方差增大"}],"ans":"B","multi":false,"note":"","ex":"考点是正则化参数与偏差方差的权衡。λ较小，正则化约束弱，模型接近原始复杂模型，偏差减小、方差增大，容易过拟合，故选B；与λ较大时的情形正好相反。"},{"n":208,"sec":"第三章 线性模型","stem":"以下不属于线性分类器的是（ ）。（ ）","opts":[{"k":"A","t":"感知机"},{"k":"B","t":"支持向量机"},{"k":"C","t":"贝叶斯分类"},{"k":"D","t":"Fisher 判别"}],"ans":"C","multi":false,"note":"","ex":"考点是线性分类器的识别。感知机、线性支持向量机、Fisher判别的决策边界都是线性超平面；贝叶斯分类基于后验概率决策，决策面一般不是线性的，故选C。"},{"n":209,"sec":"第三章 线性模型","stem":"以下属于线性分类器最佳准则的是（ ）。（ ）","opts":[{"k":"A","t":"决策树"},{"k":"B","t":"感知机"},{"k":"C","t":"最近邻"},{"k":"D","t":"集成学习"}],"ans":"B","multi":false,"note":"","ex":"考点是线性分类方法。四个选项中只有感知机以线性判别函数划分样本，属于线性分类器，故选B；决策树、最近邻、集成学习都不基于线性判别面。"},{"n":210,"sec":"第三章 线性模型","stem":"关于线性判别分析的描述最准确的是，找到一个投影方向，使得（ ）。\n（ ）","opts":[{"k":"A","t":"类内距离最大，类间距离最小"},{"k":"B","t":"类内距离最小，类间距离最大"},{"k":"C","t":"类内距离最大，类间距离最大"},{"k":"D","t":"类内距离最小，类间距离最小"}],"ans":"B","multi":false,"note":"","ex":"考点是线性判别分析LDA。LDA寻找一个投影方向，使同类样本投影后尽量聚集、类内距离最小，不同类样本尽量分开、类间距离最大，故选B。"},{"n":211,"sec":"第三章 线性模型","stem":"避免直接的复杂非线性变换，采用线性手段实现非线性学习的方法是（ ）。\n（ ）","opts":[{"k":"A","t":"核函数"},{"k":"B","t":"集成学习"},{"k":"C","t":"线性判别分析"},{"k":"D","t":"Logistic 回归"}],"ans":"A","multi":false,"note":"","ex":"考点是核方法的思想。核函数把样本隐式映射到高维特征空间，在高维空间中用线性方法完成原本非线性的学习，避免直接做复杂非线性变换，故选A。"},{"n":212,"sec":"第三章 线性模型","stem":"最小二乘回归方法的等效方法是（ ）。（ ）","opts":[{"k":"A","t":"Logistic 回归"},{"k":"B","t":"多项式回归"},{"k":"C","t":"非线性基函数回归"},{"k":"D","t":"线性均值和正态误差的最大似然回归"}],"ans":"D","multi":false,"note":"","ex":"考点是最小二乘与极大似然的关系。假设误差服从零均值正态分布时，对线性模型做最大似然估计得到的解与最小二乘解等价，故选D，这是两者的经典联系。"},{"n":213,"sec":"第三章 线性模型","stem":"【多选】正规化回归模型有（ ）。","opts":[{"k":"A","t":"简单线性回归"},{"k":"B","t":"岭回归"},{"k":"C","t":"最小绝对收缩与选择算子"},{"k":"D","t":"弹性网络"}],"ans":"BCD","multi":true,"note":"","ex":"考点是正则化回归模型。岭回归用L2惩罚、最小绝对收缩与选择算子即Lasso用L1惩罚、弹性网络结合L1与L2，都带正则项，选BCD；简单线性回归没有正则项，不选A。"},{"n":214,"sec":"第三章 线性模型","stem":"下列两个变量之间的关系中，哪一个是线性关系（ ）","opts":[{"k":"A","t":"学生的性别与他/她的数学成绩"},{"k":"B","t":"人的工作环境与他的身体健康状况"},{"k":"C","t":"儿子的身高与父亲的身高"},{"k":"D","t":"正方形的边长与周长"}],"ans":"D","multi":false,"note":"","ex":"考点是线性关系的判断。正方形周长等于边长的4倍，周长随边长按固定比例线性变化，是严格线性关系，故选D；其余选项要么是分类因素，要么只是相关而非确定的线性函数。"},{"n":215,"sec":"第三章 线性模型","stem":"下列关于对数几率回归的描述中错误的是?（ ）","opts":[{"k":"A","t":"无需事先加上数据分布"},{"k":"B","t":"使用对数函数作为联系函数"},{"k":"C","t":"可得到类别的近似概率预测"},{"k":"D","t":"可直接应用现有数值优化算法求取最优解"}],"ans":"B","multi":false,"note":"以对数函数作为联系函数的广义线性模型叫对数线性回归；对数几率回归是以\nsigmoid 函数为联系函数的模型，是分类学习方法。书中段落比较靠近，易混淆。","ex":"考点是对数几率回归的联系函数。对数几率回归用sigmoid即对数几率函数作为联系函数，说成对数函数是错误的，故选B；无需预设数据分布、可给近似概率、可直接数值优化都是其特点。"},{"n":216,"sec":"第三章 线性模型","stem":"孙悟空想请你帮他预测下一次妖精会在多久后出现,你会使用下列哪种方法?\n（ ）","opts":[{"k":"A","t":"使用历史上妖精出现的时间以及八戒每日食量数据并使用对率回归模型"},{"k":"B","t":"使用历史上妖精出现的时间以及师父念紧箍咒的时间数据,并使用指数线性回归模型"},{"k":"C","t":"使用历史上妖精出现的时间以及师徒四人的前进速度数据,并使用多元线性回归模型"},{"k":"D","t":"使用历史上妖精出现的时间以及沙和尚每日体重数据.并使用对数线性回归模型"}],"ans":"C","multi":false,"note":"","ex":"考点是按任务选择模型。预测妖精多久后出现是连续值回归问题，用历史上出现时间与师徒四人前进速度建立多元线性回归最合理，故选C；对率回归用于分类，指数和对数线性回归与题意不符。"},{"n":217,"sec":"第三章 线性模型","stem":"处理类别不平衡问题时,复制小类样本不是一种好的过采样方法,下列哪个\n不是其原因?（ ）","opts":[{"k":"A","t":"复制样本效率低下"},{"k":"B","t":"容易过拟合"},{"k":"C","t":"受噪声影响大"},{"k":"D","t":"有过拟合噪声的风险"}],"ans":"A","multi":false,"note":"复制小类样本之后，过拟合的可能性会大大增加，并且，如果小类样本中有噪声，\n则噪声的影响会被成倍放大，模型过拟合噪声的风险也会大幅度增加。","ex":"考点是复制式过采样为何不佳。复制让模型反复看到相同小类样本，容易记住它们而过拟合；小类中的噪声也会被成倍放大，加大过拟合噪声的风险，故 B、C、D 都是原因；复制本身并不低效，选 A。"},{"n":218,"sec":"第三章 线性模型","stem":"Jerry 想通过西瓜的重量、西瓜的颜色、西瓜根蒂的长短来判断一个西瓜是\n否是好瓜,Jerry 记录了一些购买西瓜的记录如下:(5500g,乌黑,长,否)，(6000g,青绿,\n很长,是)，(5800g,翠绿,短,是)。如果 Jerry 想收集更多西瓜数据并利用线性模型判\n断西瓜好坏.下列哪个选项是上述三个记录的合理表示?（ ）","opts":[{"k":"A","t":"(5500,1,2),(6000,2,4),(5800,3,1)"},{"k":"B","t":"(5.5,1,0,0,3),(6,0,0,1,5),(5.8,0,1,0,1)"},{"k":"C","t":"(5500,1,0,0,5),(6000,0,1,0,3),(5800,0,0,1,1)"},{"k":"D","t":"(5.5,1,0,0,3),(6,0,1,0,2),(5.8,0,0,1,1)"}],"ans":"B","multi":false,"note":"用 5.5 表示 5500，6 表示 6000，对于连续变量大小表示合理；对于没有大小关系\n的特征采用独热编码：（1，0，0）表示乌黑，（0，0，1）表示青绿，（0，1，\n0）表示翠绿。对于有大小关系的特征值，3 表示为长，5 表示很长，1 表示短也\n很合理。","ex":"考点是特征的数值化表示。重量是连续量，用 5.5、6 表示 5500、6000 克合理；颜色没有大小关系，应采用独热编码，乌黑为（1,0,0）、翠绿为（0,1,0）、青绿为（0,0,1）；根蒂长短有大小关系，可用 1 表短、3 表长、5 表很长，B 与此口径一致。"},{"n":219,"sec":"第三章 线性模型","stem":"小明想利用心率数据、运动与用餐时间间隔这两项数据来预测是否会发生\n低血糖,他利用平时锻炼数据收集了 100 个末发生低血糖的数据与 3 个发生低血\n糖的数据 3 个发生低血糖的数据为:(180,比较久),(170,久),(165,非常久)。小明想\n请你帮他过采样一些低血糖数据,你认为下列哪个数据是合理的过采样数据?（ ）","opts":[{"k":"A","t":"(175,比较久)"},{"k":"B","t":"(200,久)"},{"k":"C","t":"(150,非常久)"},{"k":"D","t":"(175,不久)"}],"ans":"A","multi":false,"note":"插值需要在现有数据之间插值，排除 BC，显然 A 比 D 更加合理。","ex":"考点是过采样的插值思想。新样本应在已有小类样本的取值范围内插值：B 的心率 200、C 的 150 超出 165 到 180 的范围，先排除；D 的间隔「不久」与发生低血糖时隔较久的特征矛盾；A 的心率 175 在范围内、间隔「比较久」贴近原有样本，选 A。"},{"n":220,"sec":"第三章 线性模型","stem":"下列哪个选项不是多元线性回归使用正则化的原因?（ ）","opts":[{"k":"A","t":"计算机数值精度有限"},{"k":"B","t":"样例维度大于样例数"},{"k":"C","t":"样例的采样过程存在偏差"},{"k":"D","t":"存在大量线性相关的样例"}],"ans":"C","multi":false,"note":"根据线性代数相关知识可以知道，B、D 选项所描述的两种情况对应的 XTX 一\n定不满秩导致有无限个解，我们需要引入正则化来表达我们的归纳偏好。当 XTX\n可逆但是病态矩阵（条件数很大）时，标记微小的误差都会导致解产生巨大的变\n化。\n由于计算机数值精度有限，标记存储在计算机中的数值与采样值很可能并不完全\n相等，加之计算时的舍入误差、截断误差，最终计算出的数值解很可能与理论值\n相差甚远，此时也需要引入正则化。","ex":"考点是多元线性回归引入正则化的原因。样例维度大于样例数或样例大量线性相关时 XTX 不满秩，解有无穷多个；计算机数值精度有限时，舍入误差也会使病态矩阵的解大幅失真，这些都需正则化；采样过程存在偏差是数据收集问题，与此无关，选 C。"},{"n":221,"sec":"第三章 线性模型","stem":"如果使用线性回归模型，下列说法正确的是？（ ）","opts":[{"k":"A","t":"检查异常值是很重要的，因为线性回归对离群效应很敏感"},{"k":"B","t":"线性回归分析要求所有变量特征都必须具有正态分布"},{"k":"C","t":"线性回归假设数据中基本没有多重共线性"},{"k":"D","t":"以上说法都不对"}],"ans":"A","multi":false,"note":"解析：本题考查的是线性回归的一些基本原理。\n异常值是数据中的一个非常有影响的点，它可以改变最终回归线的斜率。因此，\n去除或处理异常值在回归分析中一直是很重要的。\n了解变量特征的分布是有用的。类似于正态分布的变量特征对提升模型性能很有\n帮助。例如，数据预处理的时候经常做的一件事就是将数据特征归一化到（0，1）\n分布。但这也不是必须的。\n当模型包含相互关联的多个特征时，会发生多重共线性。因此，线性回归中变量\n特征应该尽量减少冗余性。C 选择绝对化了。","ex":"考点是线性回归的基本性质。均方误差目标下，个别离群点会明显拉动回归线，因此检查异常值很重要，A 正确；特征并非必须服从正态分布，多重共线性也只要求尽量减少而非完全没有，B、C 过于绝对。"},{"n":222,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型主要用于解决哪种类型的问题？（ ）","opts":[{"k":"A","t":"回归问题"},{"k":"B","t":"分类问题"},{"k":"C","t":"聚类问题"},{"k":"D","t":"降维问题"}],"ans":"B","multi":false,"note":"","ex":"考点是 Logistic 回归的用途。它对线性输出套 Sigmoid 函数得到概率，再按阈值划分正负类，实质是经典分类模型，不是回归、聚类或降维方法，选 B。"},{"n":223,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型的输出是什么？（ ）","opts":[{"k":"A","t":"连续值"},{"k":"B","t":"概率值"},{"k":"C","t":"类别标签"},{"k":"D","t":"特征向量"}],"ans":"B","multi":false,"note":"","ex":"考点是 Logistic 回归的输出形式。线性结果经 Sigmoid 映射到 0 与 1 之间，表示属于正类的概率；模型直接给出的是概率值，类别标签需再按阈值判定，选 B。"},{"n":224,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型的损失函数通常是（ ）。","opts":[{"k":"A","t":"均方误差（MSE）"},{"k":"B","t":"交叉熵损失"},{"k":"C","t":"绝对误差"},{"k":"D","t":"信息熵"}],"ans":"B","multi":false,"note":"","ex":"考点是 Logistic 回归的损失函数。其输出为概率，用交叉熵即对数损失衡量预测分布与真实标签的差异；均方误差面向回归，直接用于分类还易带来非凸优化问题，选 B。"},{"n":225,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic Regression 模型的损失函数是（ ）。（ ）","opts":[{"k":"A","t":"交叉熵"},{"k":"B","t":"均方误差"},{"k":"C","t":"Hinge loss"},{"k":"D","t":"分类准确率"}],"ans":"A","multi":false,"note":"","ex":"考点仍是 Logistic 回归的损失函数，即交叉熵。均方误差是线性回归的损失，Hinge loss 用于支持向量机，准确率是评估指标不能充当损失，选 A。"},{"n":226,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型的 Sigmoid 函数的输出范围是（ ）。","opts":[{"k":"A","t":"[0, 1]"},{"k":"B","t":"[-1, 1]"},{"k":"C","t":"[0, ∞)"},{"k":"D","t":"(-∞, ∞)"}],"ans":"A","multi":false,"note":"","ex":"考点是 Sigmoid 函数的值域。输出随 z 增大从趋近 0 到趋近 1，单调不减，取值落在 0 与 1 之间，恰好可解释为概率，选 A；其余区间都不符。"},{"n":227,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的阈值（threshold）通常用于（ ）。","opts":[{"k":"A","t":"确定模型的复杂度"},{"k":"B","t":"确定分类的边界"},{"k":"C","t":"确定模型的训练时间"},{"k":"D","t":"确定模型的损失函数"}],"ans":"B","multi":false,"note":"","ex":"考点是阈值的作用。模型输出概率后，按阈值（通常取 0.5）判定样本为正类或负类，阈值决定了分类的边界，与模型复杂度、训练时间、损失函数无关，选 B。"},{"n":228,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的正则化方法不包括（ ）。","opts":[{"k":"A","t":"L1 正则化（Lasso）"},{"k":"B","t":"L2 正则化（Ridge）"},{"k":"C","t":"Dropout"},{"k":"D","t":"Elastic Net"}],"ans":"C","multi":false,"note":"","ex":"考点是 Logistic 回归的正则化手段。L1 正则化、L2 正则化以及两者结合的 Elastic Net 都是线性模型的常用正则化；Dropout 随机丢弃神经元，属于神经网络技术，选 C。"},{"n":229,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的特征缩放的主要目的是（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"提高模型的准确性"},{"k":"D","t":"使特征具有相同的尺度"}],"ans":"D","multi":false,"note":"","ex":"考点是特征缩放的目的。它把不同量纲的特征缩放到相同尺度，让各维度对训练的影响均衡、梯度下降更平稳，其直接目的就是统一特征尺度，选 D。"},{"n":230,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的参数更新通常使用哪种优化算法？（ ）","opts":[{"k":"A","t":"梯度下降"},{"k":"B","t":"随机梯度下降"},{"k":"C","t":"动量梯度下降"},{"k":"D","t":"所有上述选项"}],"ans":"D","multi":false,"note":"","ex":"考点是 Logistic 回归的优化算法。其交叉熵损失可用多种梯度类方法最小化，梯度下降、随机梯度下降、动量梯度下降都能用于参数更新，故选 D。"},{"n":231,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的特征选择方法不包括（ ）。","opts":[{"k":"A","t":"前向选择"},{"k":"B","t":"后向消除"},{"k":"C","t":"逐步选择"},{"k":"D","t":"随机选择"}],"ans":"D","multi":false,"note":"","ex":"考点是特征选择的常见方法。前向选择逐个引入特征、后向消除逐个剔除特征、逐步选择是两者结合，均有明确的评价标准；随机选择缺乏依据，不属于特征选择方法，选 D。"},{"n":232,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的评估指标不包括（ ）。","opts":[{"k":"A","t":"准确率"},{"k":"B","t":"召回率"},{"k":"C","t":"F1 分数"},{"k":"D","t":"均方误差（MSE）"}],"ans":"D","multi":false,"note":"","ex":"考点是分类模型的评估指标。准确率、召回率、F1 分数都基于混淆矩阵，适合评估分类效果；均方误差衡量数值预测偏差，是回归指标，选 D。"},{"n":233,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的混淆矩阵用于（ ）。","opts":[{"k":"A","t":"评估模型的拟合优度"},{"k":"B","t":"选择特征"},{"k":"C","t":"优化模型参数"},{"k":"D","t":"增加数据量"}],"ans":"A","multi":false,"note":"","ex":"考点是混淆矩阵的用途。它统计预测类别与真实类别的组合情况，据此计算准确率、精确率、召回率等指标来评估模型表现，与选特征、调参数、增数据无关，选 A。"},{"n":234,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的 ROC 曲线用于（ ）。","opts":[{"k":"A","t":"评估模型的拟合优度"},{"k":"B","t":"选择特征"},{"k":"C","t":"优化模型参数"},{"k":"D","t":"增加数据量"}],"ans":"A","multi":false,"note":"","ex":"考点是 ROC 曲线的用途。它以不同阈值下的真正例率与假正例率作图，衡量分类器区分正负样本的能力，属于模型评估工具，不用于特征选择或参数优化，选 A。"},{"n":235,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的 AUC 值表示（ ）。","opts":[{"k":"A","t":"模型的准确率"},{"k":"B","t":"模型的召回率"},{"k":"C","t":"模型的 F1 分数"},{"k":"D","t":"模型的曲线下面积"}],"ans":"D","multi":false,"note":"","ex":"考点是 AUC 的含义。AUC 指 ROC 曲线下的面积，面积越大说明模型区分不同类别样本的能力越强，它本身不是准确率、召回率或 F1 分数，选 D。"},{"n":236,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的 Sigmoid 函数公式是（ ）","opts":[{"k":"A","t":"¾(z) = 1 1+e¡z"},{"k":"B","t":"¾(z) = 1 1+ez"},{"k":"C","t":"¾(z) = 1 1¡e¡z"},{"k":"D","t":"¾(z) = 1 1¡ez"}],"ans":"A","multi":false,"note":"","ex":"考点是 Sigmoid 函数公式。标准形式为 sigma(z) 等于 1 除以 1 加 e 的负 z 次方，对应选项 A（题面公式有乱码，¡ 即负号）；B 用了正指数，函数随 z 增大而递减，不是 Sigmoid，选 A。"},{"n":237,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的损失函数公式是（ ）。","opts":[{"k":"A","t":"Loss = ¡ 1 m Pm i=1[y(i)log(^y(i)) + (1¡ y(i))log(1¡ ^y(i))]"},{"k":"B","t":"Loss = 1 2m Pm i=1[^y(i) ¡ y(i)]2"},{"k":"C","t":"Loss = 1 m Pm i=1j^y(i) ¡ y(i)j"},{"k":"D","t":"Loss = 1 m Pm i=1 log(^y(i))"}],"ans":"A","multi":false,"note":"","ex":"考点是 Logistic 回归损失函数的公式。选项 A 即二元交叉熵：对每个样本算 y 乘 log 预测值加 1 减 y 乘 log 1 减预测值，取负后对 m 个样本求平均（题面符号乱码，¡ 为负号）；B 是均方误差，C 是平均绝对误差，选 A。"},{"n":238,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的梯度下降更新公式是（ ）。","opts":[{"k":"A","t":"µ = µ ¡ ® @Loss @µ"},{"k":"B","t":"µ = µ + ® @Loss @µ"},{"k":"C","t":"µ = µ ¡ ® @Loss @µ2"},{"k":"D","t":"µ = µ + ® @Loss @µ2"}],"ans":"A","multi":false,"note":"","ex":"考点是梯度下降的更新规则。参数应沿损失梯度反方向移动，新参数等于旧参数减去学习率乘以损失对参数的偏导（题面符号乱码，® 为学习率）；B 方向相反会使损失上升，选 A。"},{"n":239,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的学习率（α）的作用是（ ）。","opts":[{"k":"A","t":"控制模型的复杂度"},{"k":"B","t":"控制参数更新的步长"},{"k":"C","t":"控制模型的训练时间"},{"k":"D","t":"控制模型的损失函数"}],"ans":"B","multi":false,"note":"","ex":"考点是学习率的作用。更新公式中学习率与梯度相乘，决定参数每次移动的步长，太大易震荡发散，太小收敛缓慢；它不控制模型复杂度、训练时间或损失函数，选 B。"},{"n":240,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的正则化参数（λ）的作用是（ ）。","opts":[{"k":"A","t":"控制模型的复杂度"},{"k":"B","t":"控制参数更新的步长"},{"k":"C","t":"控制模型的训练时间"},{"k":"D","t":"控制模型的损失函数"}],"ans":"A","multi":false,"note":"","ex":"考点是正则化参数 λ 的作用。λ 越大对参数的惩罚越强，参数被压得越小、模型越简单，因此它控制模型复杂度以抑制过拟合；控制步长的是学习率，选 A。"},{"n":241,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的特征工程不包括（ ）。","opts":[{"k":"A","t":"多项式特征"},{"k":"B","t":"交互特征"},{"k":"C","t":"编码分类特征"},{"k":"D","t":"数据清洗"}],"ans":"D","multi":false,"note":"","ex":"考点是特征工程的范畴。构造多项式特征、交互特征以及对分类特征编码，都是在生成或转换模型输入；数据清洗处理缺失值与异常值，属于数据预处理环节，选 D。"},{"n":242,"sec":"第三章 线性模型·Logistic回归","stem":"Logistic 回归模型中的过拟合和欠拟合可以通过以下哪种方法来解决？\n（ ）","opts":[{"k":"A","t":"增加数据量"},{"k":"B","t":"减少模型复杂度"},{"k":"C","t":"增加模型复杂度"},{"k":"D","t":"所有上述选项"}],"ans":"D","multi":false,"note":"","ex":"考点是过拟合与欠拟合的对策。欠拟合时应增加模型复杂度，过拟合时应减少模型复杂度，增加数据量有助于缓解过拟合，三种手段对应不同情形，故选 D。"},{"n":243,"sec":"第三章 线性模型·Logistic回归","stem":"逻辑回归将输出概率限定在 [0,1] 之间。下列哪个函数起到这样的作用？\n（ ）","opts":[{"k":"A","t":"Sigmoid 函数"},{"k":"B","t":"tanh 函数"},{"k":"C","t":"ReLU 函数"},{"k":"D","t":"Leaky ReLU 函数"}],"ans":"A","multi":false,"note":"","ex":"考点是把输出概率限定在 0 与 1 之间的函数。Sigmoid 的值域恰为 0 到 1，是逻辑回归采用的函数；tanh 的范围是 -1 到 1，ReLU 与 Leaky ReLU 无上界，选 A。"},{"n":244,"sec":"第三章 线性模型·Logistic回归","stem":"在 logistic regession 中，如果同时加入 L1 和 L2 范数，会产生什么效果（ ）。\n（ ）","opts":[{"k":"A","t":"可以做特征选择，在一定程度上防止过拟合"},{"k":"B","t":"能解决维数灾难问题"},{"k":"C","t":"能加快计算速度"},{"k":"D","t":"能获得更准确的结果"}],"ans":"A","multi":false,"note":"","ex":"考点是 L1 与 L2 正则化结合的效果。L1 能把部分参数压成零从而做特征选择，L2 平滑参数抑制过拟合，两者结合可兼得；解决维数灾难或必然更准确并无依据，选 A。"},{"n":245,"sec":"第三章 线性模型·Logistic回归","stem":"假如使用逻辑回归对样本进行分类，得到训练样本的准确率和测试样本的\n准确率。现在，在数据中增加一个新的特征，其它特征保持不变。然后重新训练\n测试。则下列说法正确的是？（ ）","opts":[{"k":"A","t":"训练样本准确率一定会降低"},{"k":"B","t":"训练样本准确率一定增加或保持不变"},{"k":"C","t":"测试样本准确率一定会降低"},{"k":"D","t":"测试样本准确率一定增加或保持不变"}],"ans":"B","multi":false,"note":"解析：在模型中增加更多特征一般会增加训练样本的准确率，减小 bias。但是\n测试样本准确率不一定增加，除非增加的特征是有效特征。\n这题对应的知识点也包括了增加模型复杂度，虽然会减小训练样本误差，但是容\n易发生过拟合。","ex":"考点是增加特征对准确率的影响。新特征扩大假设空间，模型至少能保持原有拟合，训练准确率只会增加或不变；但新特征未必有效、还可能过拟合，测试准确率不保证变化，A、C、D 过于绝对，选 B。"},{"n":246,"sec":"第三章 线性模型·Logistic回归","stem":"逻辑回归与多元回归分析有哪些不同之处？（ ）","opts":[{"k":"A","t":"逻辑回归用来预测事件发生的概率"},{"k":"B","t":"逻辑回归用来计算拟合优度指数"},{"k":"C","t":"逻辑回归用来对回归系数进行估计"},{"k":"D","t":"以上都是"}],"ans":"D","multi":false,"note":"解析：A 选项，逻辑回归是用来解决分类问题的，可以用于预测事件发生的概\n率。\nB 选项，一般来说，为了测量真实样本与模型的拟合程度，可以使用逻辑回归\n来计算拟合优度指数。\nC 选项，在拟合逻辑回归模型之后，我们还可以根据系数值，来判断各个独立\n特征与目标输出的关系（正相关或负相关）","ex":"考点是逻辑回归的功能。它能预测事件发生的概率（A），可用于计算拟合优度指数衡量模型与样本的贴合程度（B），拟合后还能依据系数判断特征与目标的正负相关（C），三项都成立，选 D。"},{"n":247,"sec":"第三章 线性模型·Logistic回归","stem":"线性回归和逻辑回归中，关于损失函数对权重系数的偏导数，下列说法正\n确的是？","opts":[{"k":"A","t":"两者不一样"},{"k":"B","t":"两者一样"},{"k":"C","t":"无法确定"}],"ans":"B","multi":false,"note":"线性回归的损失函数为\nJ = 1 2m\nmP\ni=1\n(y ¡ ^y)2\n逻辑回归的损失函数为：\nJ = 1 2m\nmP\ni=1\nylog^y + (1¡ y)log(1¡ ^y)\n逻辑回归输出层包含了 Sigmoid 非线性函数，其损失函数对 Sigmoid 函数之前\n的线性输出 Z 的偏导数与线性回归的损失函数对线性输出 Z 的偏导数一样，\n都是：\ndZ = ^Y ¡ Y","ex":"考点是两类回归的梯度形式。线性回归用均方误差、逻辑回归用交叉熵，损失函数本身不同，但对线性输出 Z 的偏导都化简为预测值减真实值，进而对权重系数的偏导形式也一致，选 B。"},{"n":248,"sec":"第三章 线性模型·Logistic回归","stem":"假设使用逻辑回归进行 n 多类别分类，使用 One-vs-rest 分类法。下列说\n法正确的是？ （ ）","opts":[{"k":"A","t":"对于 n 类别，需要训练 n 个模型"},{"k":"B","t":"对于 n 类别，需要训练 n-1 个模型"},{"k":"C","t":"对于 n 类别，只需要训练 1 个模型"},{"k":"D","t":"以上说法都不对"}],"ans":"A","multi":false,"note":"解析：One-vs-rest 分类法中，假设有 n 个类别，那么就会建立 n 个二项分类\n器，每个分类器针对其中一个类别和剩余类别进行分类。进行预测时，利用这 n\n个二项分类器进行分类，得到数据属于当前类的概率，选择其中概率最大的一个\n类别作为最终的预测结果。","ex":"考点是 OvR 多分类策略。对 n 个类别，每个类别各训练一个二分类器，负责把该类与其余类分开，共需 n 个模型；预测时取输出概率最大的类别，选 A。"},{"n":249,"sec":"第三章 线性模型·Logistic回归","stem":"下图是两个不同 β0、β1 对应的逻辑回归模型（绿色和黑色）：\n关于两个逻辑回归模型中的 β0、β1 值，下列说法正确的是？（ ）\n注意：y= β0+β1*x， β0 是截距，β1 是权重系数。","opts":[{"k":"A","t":"绿色模型的β1 比黑色模型的β1 大"},{"k":"B","t":"绿色模型的β1 比黑色模型的β1 小"},{"k":"C","t":"两个模型的β1 相同"},{"k":"D","t":"以上说法都不对"}],"ans":"B","multi":false,"note":"本题原卷含图，此处未收录图片\n解析：逻辑回归模型最终还要经过 Sigmoid 非线性函数，Sigmoid 是增函数，\n其图形与上图中的黑色模型相近。黑色模型是增函数，说明其 β1>0，绿色模型\n是减函数，说明其β1<0。所以，得出结论：绿色模型的β1 比黑色模型的β1\n小。","ex":"考点是 β1 的符号对曲线形状的影响。Sigmoid 是增函数，黑色模型随 x 递增说明其 β1 大于 0，绿色模型递减说明其 β1 小于 0，故绿色的 β1 比黑色小，选 B。原题含图，此讲解基于题面信息。"},{"n":250,"sec":"第三章 线性模型·Logistic回归","stem":"使用梯度下降训练 Logistic 回归分类器后,如果发现它对训练集欠拟合,在训\n练集或验证集上没有达到所需的性能,那么以下哪项可能是有希望采取的步骤?\n（ ）","opts":[{"k":"A","t":"采用其他优化算法,因为梯度下降法得到的可能是局部极小值"},{"k":"B","t":"增加训练样本"},{"k":"C","t":"增加多项式特征值"},{"k":"D","t":"增加训练集样本数在全部数据集中的比例"}],"ans":"BC","multi":true,"note":"","ex":"考点是欠拟合的应对。增加多项式特征能提升模型复杂度、直接缓解欠拟合（C）；按题库口径，增加训练样本也视为有希望的步骤（B）。A 不对，交叉熵损失是凸函数，不存在陷入局部极小的问题；D 只是增大训练集占比，无助于提升模型能力。（按题库答案口径）"},{"n":251,"sec":"第三章 线性模型·Logistic回归","stem":"在求解对率回归时,下列哪个选项是极大似然法的优势?（ ）","opts":[{"k":"A","t":"优化目标是凸函数"},{"k":"B","t":"具有闭式解"},{"k":"C","t":"可以使用梯度下降法求解"},{"k":"D","t":"优化目标连续可微"}],"ans":"ACD","multi":true,"note":"极大似然法不具有封闭解，只有数值解（通过数值逼近等方法获得），解析求解\n如最小二乘解，当X>X 为满秩矩阵，或正定矩阵才有闭解： ^w = (X>X)¡1X>y","ex":"考点是对率回归极大似然估计的性质。对数似然是凸函数（A）、连续可微（D），因此可用梯度下降等数值方法求解（C）；但它没有闭式解，只能数值逼近，B 错误，故选 ACD。"},{"n":252,"sec":"第三章 线性模型·Logistic回归","stem":"以下关于多分类算法的说法，正确的是（ ）","opts":[{"k":"A","t":"线性回归通过设置阈值可以直接用于多分类"},{"k":"B","t":"K-近邻算法无法处理超过两个类别的分类任务"},{"k":"C","t":"支持向量机不能通过任何方式扩展到多分类任务"},{"k":"D","t":"逻辑回归通过 Softmax 函数推广后，是处理多分类问题的常用基线模型"}],"ans":"D","multi":false,"note":"","ex":"考点是多分类的常用做法。逻辑回归配合 Softmax 可输出各类别概率，是常用的多分类基线，D 正确；线性回归输出连续值不宜直接分类，KNN 本身可处理多类别，SVM 可用 OvO、OvR 等方式扩展，A、B、C 均错误。"},{"n":253,"sec":"第三章 线性模型·Logistic回归","stem":"将多分类问题拆分为多个二分类问题，对于包含 N 个类别的数据集，OvR\n策略需要训练多少个分类器？（ ）","opts":[{"k":"A","t":"N"},{"k":"B","t":"N-1"},{"k":"C","t":"N(N-1)/2"},{"k":"D","t":"N(N+1)/2"}],"ans":"A","multi":false,"note":"","ex":"考点是 OvR 的分类器数量。OvR 为每个类别各训练一个该类对其余类的二分类器，N 个类别即 N 个分类器；N(N-1)/2 是 OvO 的数量，选 A。"},{"n":254,"sec":"第三章 线性模型·Logistic回归","stem":"将多分类问题拆分为多个二分类问题，对于包含 N 个类别的数据集，“一对\n一”(OvO) 策略需要训练多少个分类器？（ ）","opts":[{"k":"A","t":"N"},{"k":"B","t":"N-1"},{"k":"C","t":"N(N-1)/2"},{"k":"D","t":"N(N+1)/2"}],"ans":"C","multi":false,"note":"","ex":"考点是 OvO 的分类器数量。OvO 对每两个类别各训练一个二分类器，从 N 个类别中取两个的组合数为 N(N-1)/2，故选 C；对比之下 OvR 只需 N 个。"},{"n":255,"sec":"第三章 线性模型·Logistic回归","stem":"在 OvR 策略中，对于一个新样本，最终如何决定其所属类别？ （ ）","opts":[{"k":"A","t":"所有分类器中，输出概率最高的那个类别"},{"k":"B","t":"所有分类器中，决策函数值（或置信度）最高的那个类别"},{"k":"C","t":"进行投票，得票最多的类别获胜"},{"k":"D","t":"随机选择一个分类器的结果"}],"ans":"B","multi":false,"note":"","ex":"考点是 OvR 的预测规则。N 个分类器各自给出样本属于其负责类别的决策函数值或置信度，预测时取置信度最高的类别作为结果；得票最多的投票方式是 OvO 的做法，选 B。"},{"n":256,"sec":"第三章 线性模型·Logistic回归","stem":"在 OvO 策略中，对于一个新样本，最终如何决定其所属类别？（ ）","opts":[{"k":"A","t":"选择所有分类器中置信度最高的类别"},{"k":"B","t":"计算所有类别的平均概率，选择最高的"},{"k":"C","t":"进行投票，得票最多的类别获胜"},{"k":"D","t":"选择将样本判别为“正例”次数最多的类别"}],"ans":"C","multi":false,"note":"","ex":"考点是 OvO 的预测规则。每个二分类器把样本判给其中一类并视为一票，最后得票最多的类别胜出；按最高置信度选择是 OvR 的思路，选 C。"},{"n":257,"sec":"第三章 线性模型·Logistic回归","stem":"关于 OvR 和 OvO 策略的对比，以下说法错误的是？（ ）","opts":[{"k":"A","t":"OvR 训练的分类器数量比 OvO 少"},{"k":"B","t":"OvO 的每个分类器只使用包含两个类别的子集数据进行训练，数据量更小，训练可能更快"},{"k":"C","t":"OvR 容易出现类别不平衡问题（正例 vs 所有负例）"},{"k":"D","t":"OvO 通常比 OvR 的泛化误差更小，因此在所有情况下都应优先选择 OvO"}],"ans":"D","multi":false,"note":"","ex":"考点是 OvR 与 OvO 的对比。OvR 训练的分类器更少，OvO 每个分类器只用两类数据、训练可能更快，OvR 存在正类对全部负类的不平衡，A、B、C 正确；OvO 并非在所有情况下都更优，D 说法绝对化，选 D。"},{"n":258,"sec":"第三章 线性模型·Logistic回归","stem":"以下哪个损失函数通常不直接用于多分类问题的输出层优化？（ ）","opts":[{"k":"A","t":"交叉熵损失 (Cross-Entropy Loss)"},{"k":"B","t":"均方误差 (Mean Squared Error)"},{"k":"C","t":"KL 散度 (Kullback-Leibler Divergence)"},{"k":"D","t":"负对数似然 (Negative Log-Likelihood)"}],"ans":"B","multi":false,"note":"","ex":"考点是多分类损失函数的选择。交叉熵、KL 散度、负对数似然都度量概率分布的差异，是多分类输出层的常用损失；均方误差面向回归，对概率输出层通常不直接使用，选 B。"},{"n":259,"sec":"第三章 线性模型·Logistic回归","stem":"在神经网络中，处理多分类问题时，输出层最常使用哪种激活函数？（ ）","opts":[{"k":"A","t":"Sigmoid"},{"k":"B","t":"Tanh"},{"k":"C","t":"ReLU"},{"k":"D","t":"Softmax"}],"ans":"D","multi":false,"note":"","ex":"考点是多分类网络输出层的激活函数。Softmax 把各类别得分归一化为和为 1 的概率分布，天然适配多分类；Sigmoid 用于二分类或多标签输出，ReLU、Tanh 常用于隐藏层，选 D。"},{"n":260,"sec":"第三章 线性模型·Logistic回归","stem":"Softmax 函数的主要作用是什么？（ ）","opts":[{"k":"A","t":"将输出值压缩到[-1, 1]区间"},{"k":"B","t":"将输出值映射为概率分布，所有类别概率之和为 1"},{"k":"C","t":"引入非线性，帮助网络学习复杂模式"},{"k":"D","t":"防止梯度消失"}],"ans":"B","multi":false,"note":"","ex":"考点是 Softmax 的作用。它对各类别得分取指数再归一化，输出和为 1 的概率分布；压缩到 -1 到 1 的是 tanh，引入非线性、防止梯度消失也不是它的主要作用，选 B。"},{"n":261,"sec":"第三章 线性模型·Logistic回归","stem":"评估多分类模型性能时，以下哪个指标不适用于多分类场景（需要宏平均\n或微平均）？（ ）","opts":[{"k":"A","t":"准确率 (Accuracy)"},{"k":"B","t":"精确率 (Precision)"},{"k":"C","t":"召回率 (Recall)"},{"k":"D","t":"AUC (Area Under the ROC Curve)"}],"ans":"D","multi":false,"note":"","ex":"考点是多分类的评估指标。准确率可直接统计，精确率、召回率可按类别计算后取宏平均或微平均；AUC 基于 ROC 曲线，本质面向二分类的正负样本排序，多分类需额外改造，选 D。"},{"n":262,"sec":"第三章 线性模型·Logistic回归","stem":"对于严重不平衡的多分类数据集，以下哪个评估指标最不合适？（ ）","opts":[{"k":"A","t":"宏平均 F1 (Macro F1)"},{"k":"B","t":"微平均 F1 (Micro F1)"},{"k":"C","t":"准确率 (Accuracy)"},{"k":"D","t":"加权平均 F1 (Weighted F1)"}],"ans":"C","multi":false,"note":"","ex":"考点是不平衡数据集的评估指标。类别严重不平衡时，准确率被多数类主导，模型全预测多数类也能得到很高的准确率，因此最不合适；宏平均、微平均、加权平均 F1 都能更好反映各类表现，选 C。"},{"n":263,"sec":"第三章 线性模型·Logistic回归","stem":"在多分类的混淆矩阵中，行表示真实类别，列表示预测类别。那么，一个\n类别的“精确率 (Precision)” 应如何计算？（ ）","opts":[{"k":"A","t":"对角线上的值 / 该行所有值之和"},{"k":"B","t":"对角线上的值 / 该列所有值之和"},{"k":"C","t":"该行所有值之和 / 总样本数"},{"k":"D","t":"该列所有值之和 / 总样本数"}],"ans":"B","multi":false,"note":"精确率 = TP / (TP + FP)。","ex":"考点是混淆矩阵中精确率的计算。精确率指预测为该类的样本中真正属于该类的比例，等于 TP 除以 TP 加 FP；行是真实、列是预测，故为对角线上的值除以该列所有值之和，选 B。"},{"n":264,"sec":"第三章 线性模型·Logistic回归","stem":"在多分类的混淆矩阵中，行表示真实类别，列表示预测类别。一个类别的“召\n回率 (Recall)” 应如何计算？（ ）","opts":[{"k":"A","t":"对角线上的值 / 该行所有值之和"},{"k":"B","t":"对角线上的值 / 该列所有值之和"},{"k":"C","t":"该行所有值之和 / 总样本数"},{"k":"D","t":"该列所有值之和 / 总样本数"}],"ans":"A","multi":false,"note":"召回率 = TP / (TP + FN)。","ex":"考点是混淆矩阵中召回率的计算。召回率指真实属于该类的样本中被正确预测的比例，等于 TP 除以 TP 加 FN，分母是该类真实样本总数，即该行所有值之和，选 A。"},{"n":265,"sec":"第三章 线性模型·Logistic回归","stem":"对于多分类问题，如果模型对每个类别的预测置信度都很低，但最终预测\n类别是正确的，以下说法正确的是？（ ）","opts":[{"k":"A","t":"模型的准确率会很低"},{"k":"B","t":"模型的交叉熵损失会很高"},{"k":"C","t":"模型的交叉熵损失会很低"},{"k":"D","t":"说明模型过拟合"}],"ans":"B","multi":false,"note":"","ex":"考点是交叉熵损失与置信度的关系。损失按预测概率计算，即使预测类别正确，置信度低意味着正确类别的概率小，负对数损失依然很大，故交叉熵损失会很高；准确率只看最终类别，不受影响，选 B。"},{"n":266,"sec":"第三章 线性模型·Logistic回归","stem":"在决策树模型中处理多分类问题，节点的分裂准则通常使用什么？（ ）","opts":[{"k":"A","t":"基尼不纯度 (Gini Impurity) 或 信息增益 (Information Gain)"},{"k":"B","t":"均方误差 (MSE)"},{"k":"C","t":"交叉熵 (Cross-Entropy)"},{"k":"D","t":"边际最大化 (Margin Maximization)"}],"ans":"A","multi":false,"note":"","ex":"考点是决策树分类的分裂准则。分类树用基尼不纯度或信息增益衡量划分后节点纯度的提升来选分裂特征；均方误差用于回归树，边际最大化是 SVM 的思路，选 A。"},{"n":267,"sec":"第三章 线性模型·Logistic回归","stem":"在 K-近邻 (KNN) 算法中处理多分类问题，一个样本的类别通常如何决\n定？（ ）","opts":[{"k":"A","t":"计算样本到所有类别中心的距离，选择最近的类别"},{"k":"B","t":"在 K 个最近邻中，进行多数投票 和"},{"k":"C","t":"在 K 个最近邻中，选择距离加权投票最多的类别 都对，且是最常用的方法"},{"k":"D","t":""}],"ans":"D","multi":false,"note":"","ex":"考点是 KNN 多分类的判决规则。KNN 统计 K 个最近邻的类别，可用简单多数投票，也可按距离加权投票，两者都是常用做法，即 B 和 C 都对，D 项即此含义（题面选项文字缺损）；A 是最近类中心法的思路。（按题库答案口径）"},{"n":268,"sec":"第三章 线性模型·Logistic回归","stem":"对于类别数量非常多（例如，成千上万）的多分类问题，以下哪种输出层\n设计通常是最有效和高效的？（ ）","opts":[{"k":"A","t":"标准 Softmax"},{"k":"B","t":"Sigmoid + 二元交叉熵（多标签方式）"},{"k":"C","t":"Hierarchical Softmax (层次 Softmax) 或 负采样 (Negative Sampling)"},{"k":"D","t":"线性回归输出层负采样是 Word2Vec 等模型中处理大规模词表分类的常用技巧。）"}],"ans":"C","multi":false,"note":"（解析：标准 Softmax 计算量大（需要计算所有类别的概率）。层次 Softmax 和","ex":"考点是超大类别数下的输出层设计。标准 Softmax 要计算并归一化所有类别的概率，类别上万时代价过高；层次 Softmax 借助树结构、负采样只抽少量负类，都能大幅降低计算量，是 Word2Vec 等大规模分类的常用方案，选 C。"},{"n":269,"sec":"第三章 线性模型·Logistic回归","stem":"在机器学习多分类中，“标签编码” (Label Encoding) 和“独热编码” (One-Hot\nEncoding) 的区别是什么？（ ）","opts":[{"k":"A","t":"标签编码将类别映射为数值（如 0, 1, 2），独热编码将每个类别转换为一个二进制向量"},{"k":"B","t":"标签编码适用于多分类问题，独热编码适用于二分类问题"},{"k":"C","t":"标签编码引入了类别间的序关系，这总是有利于模型训练"},{"k":"D","t":"独热编码占用的内存更少，计算更快"}],"ans":"A","multi":false,"note":"","ex":"考点是两种类别编码的定义。标签编码把类别直接映射为 0、1、2 等数值，独热编码把每个类别变为一位为 1 其余为 0 的二进制向量，A 正确；标签编码的隐含序关系并非总有利，独热编码维度更高也不省内存，B、C、D 错误。"},{"n":270,"sec":"第四章 决策树","stem":"决策树模型主要用于解决哪种类型的问题？（ ）","opts":[{"k":"A","t":"回归问题"},{"k":"B","t":"分类问题"},{"k":"C","t":"聚类问题"},{"k":"D","t":"降维问题"}],"ans":"B","multi":false,"note":"","ex":"考点是决策树的用途。决策树按特征逐步划分样本空间，叶节点给出类别，是典型的分类模型，回归树是其向回归任务的扩展；聚类与降维是无监督任务，不是它的主要定位，选 B。"},{"n":271,"sec":"第四章 决策树","stem":"决策树模型最常用于以下哪类任务？（ ）","opts":[{"k":"A","t":"聚类"},{"k":"B","t":"回归和分类"},{"k":"C","t":"降维"},{"k":"D","t":"特征提取"}],"ans":"B","multi":false,"note":"","ex":"本题考查决策树的应用场景。决策树是经典监督学习模型，通过一系列属性判断给出类别或数值，最常用于分类和回归任务；聚类、降维、特征提取都不是它的主要用途，故选 B。"},{"n":272,"sec":"第四章 决策树","stem":"决策树模型中的“分裂”是指（ ）。","opts":[{"k":"A","t":"将数据集分成多个子集"},{"k":"B","t":"将特征分成多个类别"},{"k":"C","t":"将模型分成多个部分"},{"k":"D","t":"将数据点分成多个类别"}],"ans":"A","multi":false,"note":"","ex":"本题考查分裂的含义。分裂指按所选特征的不同取值把当前节点的数据集划分成若干子集，每个子集对应一个子节点；它划分的对象是数据集，不是特征本身、模型或直接给出类别，故选 A。"},{"n":273,"sec":"第四章 决策树","stem":"决策树的分裂依据通常依赖以下哪种指标？（ ）","opts":[{"k":"A","t":"均方误差"},{"k":"B","t":"欧氏距离"},{"k":"C","t":"信息增益"},{"k":"D","t":"梯度值"}],"ans":"C","multi":false,"note":"","ex":"本题考查决策树的分裂依据。决策树选择划分属性的经典指标是信息增益，增益越大说明划分后纯度提升越多；均方误差、欧氏距离、梯度值都不是分裂依据，故选 C。"},{"n":274,"sec":"第四章 决策树","stem":"决策树模型中的“信息增益”用于（ ）。","opts":[{"k":"A","t":"评估特征的重要性"},{"k":"B","t":"评估模型的性能"},{"k":"C","t":"评估数据的质量"},{"k":"D","t":"评估特征的多样性"}],"ans":"A","multi":false,"note":"","ex":"本题考查信息增益的作用。信息增益衡量用某特征划分数据后不纯度下降的程度，增益越大说明该特征对分类贡献越大，因此它用于评估特征的重要性，而非评估模型性能或数据质量，故选 A。"},{"n":275,"sec":"第四章 决策树","stem":"决策树模型中的“基尼不纯度”用于（ ）。","opts":[{"k":"A","t":"评估特征的重要性"},{"k":"B","t":"评估模型的性能"},{"k":"C","t":"评估数据的纯度"},{"k":"D","t":"评估特征的多样性"}],"ans":"C","multi":false,"note":"","ex":"本题考查基尼不纯度的作用。基尼不纯度衡量从数据集中随机抽两个样本类别不一致的概率，反映数据的纯度，值越小越纯，故选 C；它不是评估模型性能或特征重要性的指标。"},{"n":276,"sec":"第四章 决策树","stem":"以下关于决策树算法的描述，哪一项是正确的？（ ）","opts":[{"k":"A","t":"ID3 算法通过基尼指数来选择最优特征"},{"k":"B","t":"C4.5 算法使用信息增益来选择最优特征"},{"k":"C","t":"ID3 算法使用信息增益来选择最优特征"},{"k":"D","t":"CART 算法使用信息增益率来选择最优特征CART 算法使用基尼指数。"}],"ans":"C","multi":false,"note":"解析：ID3 算法使用信息增益来选择最优特征，而 C4.5 算法使用信息增益率，","ex":"本题考查三种决策树算法的特征选择标准。ID3 用信息增益，C4.5 用信息增益率，CART 用基尼指数，A、B、D 的搭配均错误，只有 ID3 使用信息增益的 C 正确。"},{"n":277,"sec":"第四章 决策树","stem":"以下关于信息增益和信息增益率的描述，哪一项是正确的？（ ）","opts":[{"k":"A","t":"信息增益率是信息增益的简单修正，用于避免偏向于选择具有较多值的特征"},{"k":"B","t":"信息增益率与信息增益完全相同，只是名称不同"},{"k":"C","t":"信息增益率总是比信息增益小"},{"k":"D","t":"信息增益率是基尼指数的另一种说法免偏向于选择具有较多值的特征。信息增益率 = 信息增益 / 分裂信息。"}],"ans":"A","multi":false,"note":"解析：信息增益率是信息增益的修正版本，通过引入分裂信息（特征的熵）来避","ex":"本题考查信息增益率的定义。信息增益率等于信息增益除以特征自身的分裂信息，是对信息增益的修正，用于避免偏向取值较多的特征，故选 A；它与信息增益不是同一概念，也并非恒更小。"},{"n":278,"sec":"第四章 决策树","stem":"以下关于基尼指数的描述，哪一项是正确的？（ ）","opts":[{"k":"A","t":"基尼指数用于衡量数据的不纯度，值越小表示数据越纯净"},{"k":"B","t":"基尼指数用于衡量数据的不纯度，值越大表示数据越纯净"},{"k":"C","t":"基尼指数是信息增益的另一种说法"},{"k":"D","t":"基尼指数是信息增益率的另一种说法类别分布越集中）。CART 算法通过最小化基尼指数来选择最优特征。"}],"ans":"A","multi":false,"note":"解析：基尼指数用于衡量数据的不纯度。基尼指数的值越小，表示数据越纯净（即","ex":"本题考查基尼指数的含义。基尼指数衡量数据集的不纯度，值越小表示类别分布越集中、数据越纯净，CART 通过最小化基尼指数选择最优划分，故选 A，B 把方向说反了。"},{"n":279,"sec":"第四章 决策树","stem":"以下关于决策树算法特征选择的描述，哪一项是正确的？（ ）","opts":[{"k":"A","t":"ID3 算法在特征选择时更倾向于选择具有较多值的特征"},{"k":"B","t":"C4.5 算法在特征选择时更倾向于选择具有较少值的特征"},{"k":"C","t":"CART 算法在特征选择时更倾向于选择具有较多值的特征"},{"k":"D","t":"所有决策树算法在特征选择时都倾向于选择具有较多值的特征特征。C4.5 算法通过引入信息增益率来修正这一问题，避免偏向于具有较多值的特征。CART 算法使用基尼指数，与特征的值数量无关。"}],"ans":"A","multi":false,"note":"解析：ID3 算法使用信息增益来选择特征，而信息增益倾向于选择具有较多值的","ex":"本题考查各算法对多值特征的偏好。ID3 的信息增益偏向取值较多的特征，故选 A；C4.5 引入信息增益率正是为修正这一偏向，CART 用基尼指数，与特征取值数量无关。"},{"n":280,"sec":"第四章 决策树","stem":"在 ID3 算法中，用于选择最佳划分属性的指标是（ ）","opts":[{"k":"A","t":"Gini 指数"},{"k":"B","t":"熵"},{"k":"C","t":"方差"},{"k":"D","t":"均值"}],"ans":"B","multi":false,"note":"","ex":"本题考查 ID3 的划分依据。ID3 以熵为基础计算信息增益来选择最佳划分属性，本题选项中与之对应的是熵，故选 B；Gini 指数属于 CART，方差与均值不是其划分指标。"},{"n":281,"sec":"第四章 决策树","stem":"在 ID3 算法中，用于选择最佳划分属性的指标是（ ）","opts":[{"k":"A","t":"Gini 指数"},{"k":"B","t":"信息增益"},{"k":"C","t":"信息增益率"},{"k":"D","t":"均方误差"}],"ans":"B","multi":false,"note":"","ex":"本题考查 ID3 的划分依据。ID3 直接用信息增益选择最佳划分属性，故选 B；信息增益率是 C4.5 的标准，Gini 指数属于 CART，均方误差用于回归树。"},{"n":282,"sec":"第四章 决策树","stem":"C4.5 算法相比 ID3 算法，引入了哪种指标来解决偏好多值特征的问题？\n（ ）","opts":[{"k":"A","t":"Gini 指数"},{"k":"B","t":"信息增益"},{"k":"C","t":"信息增益率"},{"k":"D","t":"均方误差"}],"ans":"C","multi":false,"note":"","ex":"本题考查 C4.5 对 ID3 的改进。C4.5 引入信息增益率，用信息增益除以特征的分裂信息，克服 ID3 偏好取值多特征的缺点，故选 C；Gini 指数属于 CART 算法。"},{"n":283,"sec":"第四章 决策树","stem":"以下哪种算法使用基尼指数作为其特征选择标准？（ ）","opts":[{"k":"A","t":"ID3"},{"k":"B","t":"C4.5"},{"k":"C","t":"CART"},{"k":"D","t":"K-means"}],"ans":"C","multi":false,"note":"","ex":"本题考查 CART 的划分标准。CART 分类树以基尼指数最小作为特征选择标准，故选 C；ID3 用信息增益，C4.5 用信息增益率，K-means 是聚类算法，不涉及特征选择。"},{"n":284,"sec":"第四章 决策树","stem":"C4.5 算法在选择划分属性时使用以下那一项？（ ）","opts":[{"k":"A","t":"信息增益"},{"k":"B","t":"均方误差"},{"k":"C","t":"距离函数"},{"k":"D","t":"方差增益"}],"ans":"A","multi":false,"note":"","ex":"本题考查 C4.5 的属性选择标准。C4.5 的准则建立在信息增益之上，信息增益率也是由信息增益修正而来，本题选项中没有信息增益率，正确项为信息增益，故选 A；均方误差、距离函数、方差增益均不是它的选择标准。"},{"n":285,"sec":"第四章 决策树","stem":"CART 决策树使用哪种指标来划分数据？（ ）","opts":[{"k":"A","t":"信息增益"},{"k":"B","t":"信息增益率"},{"k":"C","t":"Gini 指数"},{"k":"D","t":"卡方检验"}],"ans":"C","multi":false,"note":"","ex":"本题考查 CART 的划分指标。CART 分类树用 Gini 指数选择划分特征，回归树用平方误差最小化，故选 C；信息增益对应 ID3，信息增益率对应 C4.5，卡方检验不属于 CART。"},{"n":286,"sec":"第四章 决策树","stem":"下列哪种情况最容易导致决策树过拟合？（ ）","opts":[{"k":"A","t":"训练数据太少"},{"k":"B","t":"树的深度较小"},{"k":"C","t":"使用正则化"},{"k":"D","t":"进行剪枝"}],"ans":"A","multi":false,"note":"","ex":"本题考查过拟合的成因。训练数据太少时，决策树容易把个别样本的细节和噪声都学进去，形成过拟合；树深度较小、使用正则化、进行剪枝都是抑制过拟合的手段，故选 A。"},{"n":287,"sec":"第四章 决策树","stem":"决策树模型的一个显著优点是（ ）","opts":[{"k":"A","t":"能处理高维稀疏数据"},{"k":"B","t":"不需要数据预处理"},{"k":"C","t":"可解释性强"},{"k":"D","t":"对异常值敏感"}],"ans":"C","multi":false,"note":"","ex":"本题考查决策树的优点。决策树从根到叶的判定路径直观清晰，是一条条可读的规则，可解释性强是其显著优点，故选 C；对异常值敏感是缺点，其余两项也不是它的典型优点。"},{"n":288,"sec":"第四章 决策树","stem":"决策树模型的基本构建方法是（ ）。","opts":[{"k":"A","t":"逐步构建"},{"k":"B","t":"一次性构建"},{"k":"C","t":"随机构建"},{"k":"D","t":"逆向构建"}],"ans":"A","multi":false,"note":"","ex":"本题考查决策树的构建方式。决策树每次选定一个属性划分节点，再对子集递归重复该过程，属于逐步构建，故选 A；一次性构建、随机构建、逆向构建都不符合其生成方式。"},{"n":289,"sec":"第四章 决策树","stem":"决策树模型中的“叶节点”是指（ ）。","opts":[{"k":"A","t":"决策树的根节点"},{"k":"B","t":"决策树的中间节点"},{"k":"C","t":"决策树的终端节点"},{"k":"D","t":"决策树的分支节点"}],"ans":"C","multi":false,"note":"","ex":"本题考查叶节点的定义。叶节点是没有子节点的终端节点，存放最终的判定结果，故选 C；根节点是整棵树的起点，中间节点和分支节点还要继续向下划分。"},{"n":290,"sec":"第四章 决策树","stem":"决策树模型中，叶节点表示什么？（ ）","opts":[{"k":"A","t":"特征的集合"},{"k":"B","t":"最终的预测结果"},{"k":"C","t":"最大的信息增益点"},{"k":"D","t":"不可分的属性"}],"ans":"B","multi":false,"note":"","ex":"本题考查叶节点代表的含义。预测样本沿判定路径下行到叶节点即结束，叶节点给出该样本最终的类别或数值，也就是预测结果，故选 B；特征集合、最大信息增益点都不是叶节点的含义。"},{"n":291,"sec":"第四章 决策树","stem":"以下哪个过程可以防止决策树模型过拟合？（ ）","opts":[{"k":"A","t":"增加树的深度"},{"k":"B","t":"剪枝"},{"k":"C","t":"使用所有特征"},{"k":"D","t":"重复训练"}],"ans":"B","multi":false,"note":"","ex":"本题考查防止过拟合的手段。剪枝通过裁掉过度细分的分支来简化树结构，是防止决策树过拟合的典型过程，故选 B；增加树深度、使用所有特征会加剧过拟合，重复训练也无此作用。"},{"n":292,"sec":"第四章 决策树","stem":"以下哪种不是决策树常用的剪枝方式？（ ）","opts":[{"k":"A","t":"预剪枝"},{"k":"B","t":"后剪枝"},{"k":"C","t":"硬剪枝"},{"k":"D","t":"极小剪枝"}],"ans":"C","multi":false,"note":"","ex":"本题考查剪枝方式的分类。决策树的剪枝分为预剪枝和后剪枝两类，硬剪枝不是教材中的常用剪枝方式，故选 C。"},{"n":293,"sec":"第四章 决策树","stem":"决策树的构建是一个什么样的过程？（ ）","opts":[{"k":"A","t":"自顶向下的贪心算法"},{"k":"B","t":"自底向上的贪心算法"},{"k":"C","t":"全局搜索"},{"k":"D","t":"随机生成"}],"ans":"A","multi":false,"note":"","ex":"本题考查决策树构建的整体性质。决策树从根节点开始，每次只选当前最优的划分属性并递归向下，是自顶向下的贪心算法，故选 A；自底向上、全局搜索、随机生成均不符合。"},{"n":294,"sec":"第四章 决策树","stem":"决策树在处理缺失值时通常采用哪种方式？（ ）","opts":[{"k":"A","t":"删除该样本"},{"k":"B","t":"随机填补"},{"k":"C","t":"基于样本权重分布分裂"},{"k":"D","t":"使用主成分分析填补"}],"ans":"C","multi":false,"note":"","ex":"本题考查缺失值的处理。决策树通常不直接删除含缺失值的样本，而是按样本权重把样本分配到各子节点参与分裂，即基于样本权重分布分裂，故选 C；随机填补和主成分分析填补不是其典型做法。"},{"n":295,"sec":"第四章 决策树","stem":"下列哪项不是决策树模型的优点？（ ）","opts":[{"k":"A","t":"可处理非线性问题"},{"k":"B","t":"训练速度快"},{"k":"C","t":"易于可视化"},{"k":"D","t":"不受特征缩放影响"}],"ans":"D","multi":false,"note":"","ex":"本题考查决策树的优缺点。可处理非线性问题、训练速度快、易于可视化都是决策树的典型优点；按题库口径，不受特征缩放影响不属于其优点，故选 D。（按题库答案口径）"},{"n":296,"sec":"第四章 决策树","stem":"决策树中，如果某属性划分后信息增益为 0，说明（ ）","opts":[{"k":"A","t":"该属性非常重要"},{"k":"B","t":"划分后类别纯度提高了"},{"k":"C","t":"划分后类别纯度没有提升"},{"k":"D","t":"该属性是最优的划分点"}],"ans":"C","multi":false,"note":"","ex":"本题考查信息增益为 0 的含义。信息增益等于划分前后熵的下降量，增益为 0 说明该属性划分后类别纯度没有任何提升，对分类没有帮助，故选 C；它既不代表属性重要，也不是最优划分点。"},{"n":297,"sec":"第四章 决策树","stem":"当决策树模型中所有样本都属于同一类别时，节点应该如何处理？（ ）","opts":[{"k":"A","t":"继续划分"},{"k":"B","t":"将其设为叶节点"},{"k":"C","t":"删除该节点"},{"k":"D","t":"赋予随机类别"}],"ans":"B","multi":false,"note":"","ex":"本题考查递归停止条件。节点内所有样本同属一类时已足够纯净，无需继续划分，应将其设为叶节点并标记为该类别，故选 B；继续划分只会增加复杂度和过拟合风险。"},{"n":298,"sec":"第四章 决策树","stem":"决策树构建过程中的“贪心”策略指的是（ ）","opts":[{"k":"A","t":"全局最优划分"},{"k":"B","t":"随机选择划分特征"},{"k":"C","t":"每一步选择局部最优划分"},{"k":"D","t":"后退搜索"}],"ans":"C","multi":false,"note":"","ex":"本题考查贪心策略的含义。决策树每次分裂只选当前节点上最优的划分属性，不考虑该选择对后续生长的影响，即每一步取局部最优、不保证全局最优，故选 C。"},{"n":299,"sec":"第四章 决策树","stem":"以下哪个不是使用决策树进行回归时的常用策略？（ ）","opts":[{"k":"A","t":"最小化叶节点样本方差"},{"k":"B","t":"使用 Gini 指数"},{"k":"C","t":"采用平均值作为预测值"},{"k":"D","t":"最小化误差平方和"}],"ans":"B","multi":false,"note":"","ex":"本题考查回归树的常用策略。回归树以叶节点样本均值为预测值，分裂时最小化误差平方和或叶节点样本方差；Gini 指数是分类树的指标，不用于回归，故选 B。"},{"n":300,"sec":"第四章 决策树","stem":"决策树模型最适合哪种特征类型（ ）","opts":[{"k":"A","t":"连续型特征"},{"k":"B","t":"离散型特征"},{"k":"C","t":"二值特征"},{"k":"D","t":"所有类型都适合"}],"ans":"D","multi":false,"note":"","ex":"本题考查决策树对特征类型的适应性。决策树既能按取值划分离散特征，也能用阈值划分连续特征，二值特征自然适用，因此各种类型都适合，故选 D。"},{"n":301,"sec":"第四章 决策树","stem":"在特征数目较多时，哪种类型更容易过拟合？（ ）","opts":[{"k":"A","t":"线性回归"},{"k":"B","t":"决策树"},{"k":"C","t":"逻辑回归"},{"k":"D","t":"朴素贝叶斯"}],"ans":"B","multi":false,"note":"","ex":"本题考查模型的过拟合倾向。决策树会不断生长，把训练数据的细节都学进去，特征越多越容易过拟合；线性回归、逻辑回归、朴素贝叶斯的模型形式相对受控，过拟合倾向较小，故选 B。"},{"n":302,"sec":"第四章 决策树","stem":"在实际使用中，通常不会单独使用决策树，而是（ ）","opts":[{"k":"A","t":"与聚类模型结合"},{"k":"B","t":"与神经网络结合"},{"k":"C","t":"构建集成模型，如随机森林"},{"k":"D","t":"与 SVM 组合构建超平面"}],"ans":"C","multi":false,"note":"","ex":"本题考查决策树的实际用法。单棵决策树容易过拟合、性能不稳定，实际中通常把多棵树组合成随机森林等集成模型来提升泛化能力，故选 C。"},{"n":303,"sec":"第四章 决策树","stem":"决策树模型中的“剪枝”是指（ ）。","opts":[{"k":"A","t":"增加树的深度"},{"k":"B","t":"减少树的深度"},{"k":"C","t":"增加树的分支"},{"k":"D","t":"减少树的分支"}],"ans":"B","multi":false,"note":"","ex":"本题考查剪枝的含义。剪枝裁掉树中过度生长的分支，使树的层次变浅、深度减小，从而抑制过拟合，故选 B；增加深度或增加分支都会使模型更复杂，与剪枝目的相反。"},{"n":304,"sec":"第四章 决策树","stem":"决策树模型中的“预剪枝”是指（ ）。","opts":[{"k":"A","t":"在树构建过程中提前停止"},{"k":"B","t":"在树构建完成后进行剪枝"},{"k":"C","t":"在树构建过程中增加分支"},{"k":"D","t":"在树构建完成后增加分支"}],"ans":"A","multi":false,"note":"","ex":"本题考查预剪枝的定义。预剪枝在树构建过程中提前停止生长，例如限制最大深度，或当前划分不能带来增益时不再分裂，故选 A；树构建完成后再剪枝的是后剪枝。"},{"n":305,"sec":"第四章 决策树","stem":"决策树模型中的“后剪枝”是指（ ）。","opts":[{"k":"A","t":"在树构建过程中提前停止"},{"k":"B","t":"在树构建完成后进行剪枝"},{"k":"C","t":"在树构建过程中增加分支"},{"k":"D","t":"在树构建完成后增加分支"}],"ans":"B","multi":false,"note":"","ex":"本题考查后剪枝的定义。后剪枝先让树完整生长，再自底向上考察各分支，裁掉对泛化性能无帮助的子树，故选 B；在构建过程中提前停止的是预剪枝。"},{"n":306,"sec":"第四章 决策树","stem":"决策树模型中的“特征选择”是指（ ）。","opts":[{"k":"A","t":"选择用于分裂的特征"},{"k":"B","t":"选择用于评估的特征"},{"k":"C","t":"选择用于预测的特征"},{"k":"D","t":"选择用于优化的特征"}],"ans":"A","multi":false,"note":"","ex":"本题考查特征选择的含义。特征选择指依据信息增益等准则，从当前属性集中选出用于划分节点的最优特征，故选 A；评估、预测、优化都不是这一步骤的直接目的。"},{"n":307,"sec":"第四章 决策树","stem":"决策树模型中的“分裂标准”不包括（ ）。","opts":[{"k":"A","t":"信息增益"},{"k":"B","t":"基尼不纯度"},{"k":"C","t":"均方误差"},{"k":"D","t":"特征方差"}],"ans":"D","multi":false,"note":"","ex":"本题考查常见的分裂标准。信息增益对应 ID3，基尼不纯度对应 CART，均方误差用于回归树的划分，特征方差不属于决策树的分裂标准，故选 D。"},{"n":308,"sec":"第四章 决策树","stem":"决策树模型中的“树深度”是指（ ）。","opts":[{"k":"A","t":"树的宽度"},{"k":"B","t":"树的高度"},{"k":"C","t":"树的分支数"},{"k":"D","t":"树的节点数"}],"ans":"B","multi":false,"note":"","ex":"本题考查树深度的概念。树深度指根节点到最深叶节点经过的层数，也就是树的高度，故选 B；宽度、分支数、节点数是另外的结构统计量。"},{"n":309,"sec":"第四章 决策树","stem":"决策树模型中的“树宽度”是指（ ）。","opts":[{"k":"A","t":"树的深度"},{"k":"B","t":"树的节点数"},{"k":"C","t":"树的分支数"},{"k":"D","t":"树的最大宽度"}],"ans":"D","multi":false,"note":"","ex":"本题考查树宽度的概念。树宽度指各层节点数的最大值，即树的最大宽度，与纵向的深度相对应，故选 D；节点总数和分支数都不是宽度的含义。"},{"n":310,"sec":"第四章 决策树","stem":"决策树模型中的“树的节点数”是指（ ）。","opts":[{"k":"A","t":"树的深度"},{"k":"B","t":"树的宽度"},{"k":"C","t":"树的分支数"},{"k":"D","t":"树的总节点数"}],"ans":"D","multi":false,"note":"","ex":"本题考查节点数的概念。树的节点数指整棵树包含的所有节点的总数，包括根节点、中间节点和叶节点，故选 D；深度、宽度、分支数都不是节点数量的统计。"},{"n":311,"sec":"第四章 决策树","stem":"决策树模型中的“树的分支数”是指（ ）。","opts":[{"k":"A","t":"树的深度"},{"k":"B","t":"树的宽度"},{"k":"C","t":"树的总分支数"},{"k":"D","t":"树的节点数"}],"ans":"C","multi":false,"note":"","ex":"本题考查分支数的概念。树的分支数指树中所有父子连接即总分支的数量，故选 C；深度是纵向层数，宽度是每层最大节点数，都与分支数含义不同。"},{"n":312,"sec":"第四章 决策树","stem":"下列哪个不是决策树算法（ ）。","opts":[{"k":"A","t":"ID3 算法"},{"k":"B","t":"ID4 算法"},{"k":"C","t":"C4.5 算法"},{"k":"D","t":"CART 算法"}],"ans":"B","multi":false,"note":"","ex":"本题考查决策树算法的常见种类。ID3、C4.5、CART 是经典决策树算法，ID4 不是教材中常见的决策树算法，故选 B。"},{"n":313,"sec":"第四章 决策树","stem":"决策树生成有几种算法（ ）。","opts":[{"k":"A","t":"1"},{"k":"B","t":"2"},{"k":"C","t":"3"},{"k":"D","t":"4"}],"ans":"C","multi":false,"note":"","ex":"本题考查决策树生成算法的数量。按教材口径，决策树生成算法主要有 ID3、C4.5、CART 三种，故选 C。"},{"n":314,"sec":"第四章 决策树","stem":"信息熵是度量样本集合（ ）最常用的一种指标。","opts":[{"k":"A","t":"纯度"},{"k":"B","t":"对称差"},{"k":"C","t":"大小"},{"k":"D","t":"重要性"}],"ans":"A","multi":false,"note":"","ex":"本题考查信息熵的意义。信息熵是度量样本集合纯度最常用的指标，熵越小表示类别越集中、纯度越高，决策树基于它计算信息增益来选择划分属性，故选 A。"},{"n":315,"sec":"第四章 决策树","stem":"目标变量在训练集上的 7 个实际值为[1,1,1,1,0,0,0]，目标变量的熵近似值是\n（log3/7=-0.847, log4/7=-0.560）。（ ）","opts":[{"k":"A","t":"0.683"},{"k":"B","t":"-0.683"},{"k":"C","t":"0.724"},{"k":"D","t":"-0.243"}],"ans":"A","multi":false,"note":"","ex":"本题考查信息熵的计算。7 个样本中取值为 1 的有 4 个、为 0 的有 3 个，熵等于各类占比与其对数乘积之和的相反数，代入题给对数值得约 0.683，且熵非负，可先排除两个负值选项，故选 A。"},{"n":316,"sec":"第四章 决策树","stem":"在属性划分中，信息增益越大，结点的纯度（ ）。","opts":[{"k":"A","t":"不变"},{"k":"B","t":"变为零"},{"k":"C","t":"提升越大"},{"k":"D","t":"降低越快"}],"ans":"C","multi":false,"note":"","ex":"本题考查信息增益与纯度的关系。信息增益是划分前后熵的下降量，增益越大说明划分让类别分布越集中，结点纯度提升越大，故选 C。"},{"n":317,"sec":"第四章 决策树","stem":"关于决策树节点划分指标描述正确的是（ ）。（ ）","opts":[{"k":"A","t":"类别非纯度越大越好"},{"k":"B","t":"信息增益越大越好"},{"k":"C","t":"信息增益率越大越好"},{"k":"D","t":"基尼系数越大越好"}],"ans":"B","multi":false,"note":"","ex":"本题考查划分指标的大小取向。信息增益越大说明划分带来的纯度提升越大，越大越好，故选 B；类别非纯度和基尼系数都是越小越好，A、D 的说法不成立。"},{"n":318,"sec":"第四章 决策树","stem":"以下描述中，属于决策树策略的是（ ）。（ ）","opts":[{"k":"A","t":"最优投影方向"},{"k":"B","t":"梯度下降法"},{"k":"C","t":"最大特征值"},{"k":"D","t":"最大信息增益"}],"ans":"D","multi":false,"note":"","ex":"本题考查决策树的核心策略。决策树每次分裂选择使信息增益最大的属性，最大信息增益是其典型策略，故选 D；最优投影方向和最大特征值属于降维，梯度下降法用于参数优化。"},{"n":319,"sec":"第四章 决策树","stem":"剪枝是决策树学习算法对付（ ）现象的主要手段。","opts":[{"k":"A","t":"标记噪声"},{"k":"B","t":"数据少"},{"k":"C","t":"过拟合"},{"k":"D","t":"欠拟合"}],"ans":"C","multi":false,"note":"","ex":"本题考查剪枝的目的。剪枝通过裁掉过度细分的分支降低模型复杂度，是决策树对付过拟合的主要手段，故选 C；标记噪声、数据少和欠拟合都不是剪枝针对的现象。"},{"n":320,"sec":"第四章 决策树","stem":"决策树属于（ ）模型。","opts":[{"k":"A","t":"判别式"},{"k":"B","t":"生成式"},{"k":"C","t":"判别式和生成式"},{"k":"D","t":"以上都不对"}],"ans":"A","multi":false,"note":"","ex":"本题考查决策树的模型类别。决策树直接学习特征到类别的映射，不建模联合概率分布，属于判别式模型，故选 A；生成式模型如朴素贝叶斯需要先估计联合分布再求后验。"},{"n":321,"sec":"第四章 决策树","stem":"下列（）是决策树的预测过程。（ ）","opts":[{"k":"A","t":"将测试示例从一个中间节点开始，沿着划分属性所构成的“判定测试序列”下行，知道叶节点。"},{"k":"B","t":"将测试实例从一个中间节点开始，沿着划分属性所构成的“判定测试序列”上行，直到根节点。"},{"k":"C","t":"将测试示例从叶节点开始，沿着划分属性 所构成的“判定测试序列”上行，直到根节点。"},{"k":"D","t":"将测试示例从根节点开始，沿着划分属性所构成的“判定测试序列”下行，直到叶节点。"}],"ans":"D","multi":false,"note":"","ex":"本题考查决策树的预测过程。预测时测试样本从根节点出发，依次按各节点的划分属性选择分支向下行进，直到叶节点得到结果，故选 D；A 的起点不对，B、C 的行进方向不对。"},{"n":322,"sec":"第四章 决策树","stem":"决策树划分时,若当前结点包含的样本集合为空,则应该怎么做?（ ）","opts":[{"k":"A","t":"将结点标记为叶结点,其类别标记为父结点中样本最多的类"},{"k":"B","t":"将结点标记为叶结点,其类别标记为父结点中样本最少的类"},{"k":"C","t":"将结点标记为叶结点,其类别标记为父结点中任意一个类"},{"k":"D","t":"从其他结点获得样本,继续进行划分用父节点的分布作为当前节点先验分布，一般都标记为父节点最多的类"}],"ans":"A","multi":false,"note":"","ex":"本题考查划分后样本集为空的处理。某子节点没有样本时无法依据自身确定类别，按题库口径将其标为叶节点，类别取父结点中样本最多的类，故选 A；注意与属性集为空时取当前节点最多类的情形区分。"},{"n":323,"sec":"第四章 决策树","stem":"决策树划分时,当遇到以下哪种情形时,将结点标记为叶节点,其类别标记为\n当前样本集中样本数最多的类？（ ）","opts":[{"k":"A","t":"当前属性集为空,或所有样本在所有属性上取值相同"},{"k":"B","t":"当前属性集不为空,或所有样本在所有属性上取值相同"},{"k":"C","t":"当前结点包含的样本集合为空,或当前属性集为空"},{"k":"D","t":"当前结点包含的样本集合为空,或所有样本在所有属性上取值相同"}],"ans":"A","multi":false,"note":"","ex":"本题考查无法继续划分的停止情形。当属性集为空或所有样本在所有属性上取值相同时不能再划分，把节点标为叶节点，类别取当前样本集中样本数最多的类，故选 A；样本集为空时则取父结点最多的类。"},{"n":324,"sec":"第四章 决策树","stem":"随着决策树学习时的深度增加,会发生人现象? （ ）","opts":[{"k":"A","t":"位于叶结点的样本越来越少"},{"k":"B","t":"不会把数据中不该学到的特性学出来"},{"k":"C","t":"决策树不会过拟合"},{"k":"D","t":"叶结点一定学到一般规律"}],"ans":"A","multi":false,"note":"","ex":"本题考查树加深带来的现象。树越深划分越细，每个叶节点覆盖的样本越来越少，极端时几乎逐个记忆训练样本，学到不该学的细节而过拟合，故选 A；B、C、D 的说法都与实际相反。"},{"n":325,"sec":"第四章 决策树","stem":"关于剪枝,下列说法错误的是（ ）","opts":[{"k":"A","t":"对于同一棵树,进行预剪枝和后剪枝得到的决策树是一样的"},{"k":"B","t":"决策树的剪枝算法可以分为两类,分别称为预剪枝和后剪枝"},{"k":"C","t":"预剪枝在树的训练过程中通过停止分裂对树的规模进行限制"},{"k":"D","t":"后剪枝先构造出一棵完整的树,然后通过某种规则消除掉部分节点,用叶子节点替代"}],"ans":"A","multi":false,"note":"","ex":"考点是预剪枝与后剪枝的区别。预剪枝在训练中提前停止分裂，后剪枝先生成完整树再自底向上剪除节点，两者得到的树一般不同，故A说法错误；B、C、D分别正确描述了剪枝分类与两类剪枝的做法。"},{"n":326,"sec":"第四章 决策树","stem":"预剪枝欠拟合风险（ ），后剪枝欠拟合风险（ ）。","opts":[{"k":"A","t":"降低;降低"},{"k":"B","t":"增加;基本不变"},{"k":"C","t":"基本不变;基本不变"},{"k":"D","t":"基本不变;增加"}],"ans":"B","multi":false,"note":"","ex":"考点是两种剪枝的欠拟合风险。预剪枝提前停止分支，可能把看似无用实则必要的分支也剪掉，欠拟合风险增加；后剪枝在完整树上自底向上剪枝，一般不会过度限制模型，欠拟合风险基本不变，故选B。"},{"n":327,"sec":"第四章 决策树","stem":"在大数据集上训练决策树，为了使用较少时间，我们可以（ ）","opts":[{"k":"A","t":"增加数的深度"},{"k":"B","t":"增加学习率"},{"k":"C","t":"减少树的深度"},{"k":"D","t":"减少树的数量"}],"ans":"C","multi":false,"note":"","ex":"考点是决策树的训练开销。树越深需要评估与生成的分支越多，减少树的深度能明显缩短大数据集上的训练时间；学习率和树的数量不是单棵决策树的参数，故选C。"},{"n":328,"sec":"第四章 决策树","stem":"假设学习到的决策树如下，请问属性值为（色泽，根蒂，敲声，纹理，脐\n部，触感）=（乌黑，稍蜷，浊响，清晰，稍凹，硬滑）的西瓜应判别为（ ）?\n（ ）","opts":[{"k":"A","t":"好瓜"},{"k":"B","t":"坏瓜"},{"k":"C","t":"好瓜坏瓜都可以"},{"k":"D","t":"无法判断"}],"ans":"A","multi":false,"note":"本题原卷含图，此处未收录图片","ex":"考点是决策树的预测过程。从根节点起按纹理、根蒂、色泽等属性取值逐层走到叶节点，该组属性值与西瓜数据集中编号8样本一致，最终判为好瓜。原题含图，此讲解基于题面信息。"},{"n":329,"sec":"第四章 决策树","stem":"在决策树中，信息增益的定义为（ ）?（ ）","opts":[{"k":"A","t":"Ent(D) = ¡jyjPk=1pk log2pk"},{"k":"B","t":"Gain(D; a) = Ent(D)¡jVjPv=1DjVjjDj Ent(Dv)"},{"k":"C","t":"Gain ratio(D; a) = Gain(D;a) IV (a)"},{"k":"D","t":"Gain index(D; a) =jVjPv=1DjVjjDj Gain(Dv)"}],"ans":"B","multi":false,"note":"","ex":"考点是信息增益的定义。信息增益等于划分前的信息熵Ent(D)减去按属性a划分后各分支熵按样本数加权的和，即选项B的表达式；A是信息熵的定义，C是增益率，故选B。"},{"n":330,"sec":"第四章 决策树","stem":"如果在大型数据集上训练决策树。为了花费更少的时间来训练这个模型，\n下列哪种做法是正确的？（ ）","opts":[{"k":"A","t":"增加树的深度"},{"k":"B","t":"增加学习率"},{"k":"C","t":"减小树的深度"},{"k":"D","t":"减少树的数量"}],"ans":"C","multi":false,"note":"","ex":"考点是决策树的训练开销。减小树的深度可减少分裂判断次数，在大数据集上能明显缩短训练时间；学习率不是决策树的参数，单棵决策树也谈不上树的数量，故选C。"},{"n":331,"sec":"第五章 神经网络","stem":"神经网络的基本单元是什么？（ ）","opts":[{"k":"A","t":"神经元"},{"k":"B","t":"层"},{"k":"C","t":"权重"},{"k":"D","t":"偏置"}],"ans":"A","multi":false,"note":"","ex":"考点是神经网络的结构组成。神经网络由大量神经元按层连接而成，神经元是最基本的处理单元，层是神经元的组织方式，权重和偏置是连接上的参数，故选A。"},{"n":332,"sec":"第五章 神经网络","stem":"神经网络中的激活函数的作用是什么？（ ）","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"引入非线性因素"},{"k":"C","t":"减少计算时间"},{"k":"D","t":"增加数据量"}],"ans":"B","multi":false,"note":"","ex":"考点是激活函数的作用。没有激活函数时多层网络等价于一个线性模型，激活函数对加权输入做非线性变换，使网络能够拟合非线性关系，故选B。"},{"n":333,"sec":"第五章 神经网络","stem":"以下哪个不是常见的激活函数？（ ）","opts":[{"k":"A","t":"Sigmoid"},{"k":"B","t":"ReLU"},{"k":"C","t":"Tanh"},{"k":"D","t":"Linear"}],"ans":"D","multi":false,"note":"","ex":"考点是常见激活函数的辨识。Sigmoid、ReLU、Tanh都是常用的非线性激活函数；Linear是线性函数，无法引入非线性，一般不作激活函数，故选D。"},{"n":334,"sec":"第五章 神经网络","stem":"神经网络中的前向传播是指什么？（ ）","opts":[{"k":"A","t":"从输入层到输出层的信号传递"},{"k":"B","t":"从输出层到输入层的信号传递"},{"k":"C","t":"权重的更新过程"},{"k":"D","t":"损失函数的计算过程"}],"ans":"A","multi":false,"note":"","ex":"考点是前向传播的含义。前向传播指信号从输入层经各隐层逐层加权与激活，最终到达输出层给出预测结果，即选项A；权重更新是反向传播之后的训练步骤，故选A。"},{"n":335,"sec":"第五章 神经网络","stem":"神经网络中的反向传播是指什么？（ ）","opts":[{"k":"A","t":"从输入层到输出层的信号传递"},{"k":"B","t":"从输出层到输入层的信号传递"},{"k":"C","t":"权重的更新过程"},{"k":"D","t":"损失函数的计算过程"}],"ans":"B","multi":false,"note":"","ex":"考点是反向传播的含义。反向传播把输出层误差沿网络从输出层向输入层方向逐层回传，据此计算各层参数的梯度以供更新，故选B。"},{"n":336,"sec":"第五章 神经网络","stem":"神经网络中的损失函数通常用于（ ）。","opts":[{"k":"A","t":"评估模型的性能"},{"k":"B","t":"选择特征"},{"k":"C","t":"优化模型参数"},{"k":"D","t":"增加数据量"}],"ans":"A","multi":false,"note":"","ex":"考点是损失函数的用途。损失函数度量预测值与真实值的差距，数值越小拟合越好，用于评估模型性能；参数优化是梯度下降基于损失完成的，故选A。"},{"n":337,"sec":"第五章 神经网络","stem":"神经网络中的梯度下降算法用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"优化模型参数"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是梯度下降的用途。梯度下降沿损失函数的负梯度方向迭代更新权重与偏置，使损失逐步减小，是优化模型参数的基本方法，故选C。"},{"n":338,"sec":"第五章 神经网络","stem":"以下哪个不是神经网络的常见优化算法？（ ）","opts":[{"k":"A","t":"梯度下降"},{"k":"B","t":"随机梯度下降"},{"k":"C","t":"动量梯度下降"},{"k":"D","t":"线性回归"}],"ans":"D","multi":false,"note":"","ex":"考点是常见优化算法的辨识。梯度下降、随机梯度下降、动量梯度下降都是神经网络常用的参数优化算法；线性回归是一种回归模型而非优化算法，故选D。"},{"n":339,"sec":"第五章 神经网络","stem":"神经网络中的学习率（α）的作用是（ ）。","opts":[{"k":"A","t":"控制模型的复杂度"},{"k":"B","t":"控制参数更新的步长"},{"k":"C","t":"控制模型的训练时间"},{"k":"D","t":"控制模型的损失函数"}],"ans":"B","multi":false,"note":"","ex":"考点是学习率的作用。学习率决定每次参数更新沿梯度方向前进的距离，即控制参数更新的步长，过大易震荡、过小收敛慢，故选B。"},{"n":340,"sec":"第五章 神经网络","stem":"神经网络中的正则化方法不包括（ ）。","opts":[{"k":"A","t":"L1 正则化"},{"k":"B","t":"L2 正则化"},{"k":"C","t":"Dropout"},{"k":"D","t":"增加数据量"}],"ans":"D","multi":false,"note":"","ex":"考点是正则化方法的范围。L1、L2正则化通过惩罚权重大小抑制过拟合，Dropout通过随机丢弃神经元抑制过拟合；增加数据量是数据层面的扩充手段，不属于正则化，故选D。"},{"n":341,"sec":"第五章 神经网络","stem":"神经网络中的过拟合是指（ ）。","opts":[{"k":"A","t":"模型在训练数据上表现很好，但在测试数据上表现很差"},{"k":"B","t":"模型在训练数据上表现很差"},{"k":"C","t":"模型在测试数据上表现很好"},{"k":"D","t":"模型训练时间过长"}],"ans":"A","multi":false,"note":"","ex":"考点是过拟合的定义。过拟合指模型把训练数据的细节甚至噪声也学了进去，训练集表现很好而测试集表现很差，泛化能力差，故选A。"},{"n":342,"sec":"第五章 神经网络","stem":"神经网络中的欠拟合是指（ ）。","opts":[{"k":"A","t":"模型在训练数据上表现很好，但在测试数据上表现很差"},{"k":"B","t":"模型在训练数据上表现很差"},{"k":"C","t":"模型在测试数据上表现很好"},{"k":"D","t":"模型训练时间过短"}],"ans":"B","multi":false,"note":"","ex":"考点是欠拟合的定义。欠拟合指模型学习能力不足，连训练数据的基本规律都没有学好，训练集表现很差，自然也难以泛化，故选B。"},{"n":343,"sec":"第五章 神经网络","stem":"神经网络中的隐藏层的作用是（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"提高模型的准确性"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是隐藏层的作用。隐藏层对输入做逐层非线性变换，提取更抽象的特征、增强网络表达能力，从而提高模型拟合数据的准确性，故选C。"},{"n":344,"sec":"第五章 神经网络","stem":"神经网络中的权重初始化方法不包括（ ）。","opts":[{"k":"A","t":"随机初始化"},{"k":"B","t":"零初始化"},{"k":"C","t":"Xavier 初始化"},{"k":"D","t":"均值初始化"}],"ans":"D","multi":false,"note":"","ex":"考点是权重初始化方法。随机初始化、零初始化、Xavier初始化都是常见的初始化方法；均值初始化不是标准的权重初始化方法，故选D。"},{"n":345,"sec":"第五章 神经网络","stem":"神经网络中的偏置项（bias）的作用是（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"提高模型的准确性"},{"k":"C","t":"增加数据量"},{"k":"D","t":"提供一个偏移量，帮助模型更好地拟合数据"}],"ans":"D","multi":false,"note":"","ex":"考点是偏置项的作用。偏置在加权输入之外加一个可学习的常数，使激活函数的输入整体平移，从而帮助模型更好地拟合数据，故选D。"},{"n":346,"sec":"第五章 神经网络","stem":"神经网络中的 Dropout 技术用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"防止过拟合"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是Dropout的作用。Dropout在训练时按概率随机丢弃部分神经元，迫使网络不过度依赖个别单元，从而防止过拟合，故选C。"},{"n":347,"sec":"第五章 神经网络","stem":"神经网络中的 Batch Normalization 技术用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"提高模型的泛化能力"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是Batch Normalization的作用。它对每个小批量的输入做标准化，稳定各层分布、加快训练收敛，从而提高模型的泛化能力，故选C。"},{"n":348,"sec":"第五章 神经网络","stem":"神经网络中的学习率调度（Learning Rate Scheduling）用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"优化模型参数"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是学习率调度的用途。训练过程中按阶段动态调整学习率，让参数更新更平稳、收敛更好，本质上是服务于参数优化，故选C。"},{"n":349,"sec":"第五章 神经网络","stem":"神经网络中的早停（Early Stopping）技术用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"防止过拟合"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是早停的作用。当验证集性能不再提升时提前结束训练，避免模型继续学习训练集中的噪声细节，从而防止过拟合，故选C。"},{"n":350,"sec":"第五章 神经网络","stem":"神经网络中的交叉验证用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"评估模型的性能"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是交叉验证的用途。交叉验证把数据分成多份轮流充当训练集与验证集，综合评估模型在未见数据上的表现，用于评估模型性能，故选C。"},{"n":351,"sec":"第五章 神经网络","stem":"单层感知机模型主要解决哪种类型的问题？（ ）","opts":[{"k":"A","t":"回归问题"},{"k":"B","t":"分类问题"},{"k":"C","t":"聚类问题"},{"k":"D","t":"降维问题"}],"ans":"B","multi":false,"note":"","ex":"考点是单层感知机的适用任务。单层感知机通过线性判别边界对输入做类别判定，主要解决线性可分的分类问题，故选B。"},{"n":352,"sec":"第五章 神经网络","stem":"单层感知机模型的输出是（ ）。","opts":[{"k":"A","t":"连续值"},{"k":"B","t":"离散标签"},{"k":"C","t":"概率分布"},{"k":"D","t":"频率分布"}],"ans":"B","multi":false,"note":"","ex":"考点是单层感知机的输出形式。感知机对加权输入经阈值型激活判定，输出正负两类离散标签，而不是连续值或概率分布，故选B。"},{"n":353,"sec":"第五章 神经网络","stem":"感知机学习算法中，权重更新的依据是（ ）。","opts":[{"k":"A","t":"损失函数的梯度"},{"k":"B","t":"模型的准确率"},{"k":"C","t":"特征的重要性"},{"k":"D","t":"数据的分布"}],"ans":"A","multi":false,"note":"","ex":"考点是感知机权重更新的依据。感知机依据误分类样本对应的损失函数梯度更新权重，使分界面向减小分类错误的方向移动，故选A。"},{"n":354,"sec":"第五章 神经网络","stem":"感知机模型的激活函数通常是（ ）。","opts":[{"k":"A","t":"Sigmoid 函数"},{"k":"B","t":"ReLU 函数"},{"k":"C","t":"Tanh 函数"},{"k":"D","t":"线性函数"}],"ans":"A","multi":false,"note":"","ex":"考点是感知机的激活函数。感知机用阈值型函数判别类别，Sigmoid是其常用的平滑形式，可把加权输入映射到0与1之间完成二分类判别，故选A。"},{"n":355,"sec":"第五章 神经网络","stem":"在感知机模型中，如果一个样本被错误分类，那么（ ）。","opts":[{"k":"A","t":"增加学习率"},{"k":"B","t":"减小学习率"},{"k":"C","t":"更新权重"},{"k":"D","t":"忽略错误"}],"ans":"C","multi":false,"note":"","ex":"考点是感知机的更新时机。感知机学习规则只对被错误分类的样本更新权重，使分界面向正确方向调整，分类正确的样本不引起更新，故选C。"},{"n":356,"sec":"第五章 神经网络","stem":"感知机模型不能解决以下哪种问题（ ）。","opts":[{"k":"A","t":"线性可分问题"},{"k":"B","t":"非线性可分问题"},{"k":"C","t":"二分类问题"},{"k":"D","t":"多分类问题"}],"ans":"B","multi":false,"note":"","ex":"考点是单层感知机的局限。单层感知机只能学习线性判别边界，异或这类非线性可分问题无法解决，这也是发展多层网络的原因，故选B。"},{"n":357,"sec":"第五章 神经网络","stem":"感知机模型的损失函数通常是（ ）。","opts":[{"k":"A","t":"均方误差"},{"k":"B","t":"交叉熵损失"},{"k":"C","t":"Hinge 损失"},{"k":"D","t":"对数似然损失"}],"ans":"C","multi":false,"note":"","ex":"考点是感知机的损失函数。感知机采用误分类点到超平面距离之和构造损失，其形式对应Hinge损失；均方误差和交叉熵多用于其他模型，故选C。"},{"n":358,"sec":"第五章 神经网络","stem":"以下哪种方法不是感知机模型用来避免过拟合的（ ）。","opts":[{"k":"A","t":"正则化"},{"k":"B","t":"早停"},{"k":"C","t":"数据增强"},{"k":"D","t":"权重衰减"}],"ans":"C","multi":false,"note":"","ex":"考点是感知机抑制过拟合的手段。正则化、早停、权重衰减都是常用的抗过拟合方法；数据增强靠扩充样本来实现，不属于感知机模型自身的手段，故选C。"},{"n":359,"sec":"第五章 神经网络","stem":"感知机模型的训练通常在什么情况下停止？（ ）","opts":[{"k":"A","t":"达到最大迭代次数"},{"k":"B","t":"模型准确率达到 100%"},{"k":"C","t":"模型收敛"},{"k":"D","t":"训练数据用完"}],"ans":"C","multi":false,"note":"","ex":"考点是感知机训练的停止条件。训练目标是找到能正确划分所有样本的超平面，当误分类点不再出现、算法收敛时停止；最大迭代次数只是工程保底设置，故选C。"},{"n":360,"sec":"第五章 神经网络","stem":"感知机模型的权重初始化为（ ）。","opts":[{"k":"A","t":"随机值"},{"k":"B","t":"零"},{"k":"C","t":"固定值"},{"k":"D","t":"根据数据分布"}],"ans":"A","multi":false,"note":"","ex":"考点是感知机的权重初始化。权重通常初始化为随机值，避免初始分界面有固定偏向；全零或固定值会让不同特征难以区分更新，故选A。"},{"n":361,"sec":"第五章 神经网络","stem":"神经元模型是（ ）。","opts":[{"k":"A","t":"生物神经"},{"k":"B","t":"神经网络中最基本的组成部分"},{"k":"C","t":"计算机存储单元"},{"k":"D","t":"多层感知机"}],"ans":"B","multi":false,"note":"","ex":"考点是神经元模型的定位。神经元模型用加权输入加阈值激发来模拟生物神经元，是构成神经网络最基本的组成部分，故选B。"},{"n":362,"sec":"第五章 神经网络","stem":"为了解决如何模拟人类的感性思维，例如视觉理解、直觉思维、悟性等，\n研究这找到一个重要的信息处理机制是（ ）。","opts":[{"k":"A","t":"专家系统"},{"k":"B","t":"人工神经网络"},{"k":"C","t":"模式识别"},{"k":"D","t":"智能代理"}],"ans":"B","multi":false,"note":"","ex":"考点是人工神经网络的定位。模拟视觉理解、直觉思维等感性思维需要能从数据中学习并泛化的机制，人工神经网络正是研究找到的重要信息处理机制，故选B。"},{"n":363,"sec":"第五章 神经网络","stem":"感知机学习算法原始形式迭代是（ ）的。","opts":[{"k":"A","t":"震荡"},{"k":"B","t":"发散"},{"k":"C","t":"约束"},{"k":"D","t":"收敛"}],"ans":"D","multi":false,"note":"","ex":"考点是感知机原始形式的收敛性。当训练数据线性可分时，感知机学习算法原始形式的迭代必在有限步内收敛，这是Novikoff定理的结论，故选D。"},{"n":364,"sec":"第五章 神经网络","stem":"BP 算法基于（ ）策略对参数进行调整。","opts":[{"k":"A","t":"梯度下降"},{"k":"B","t":"梯度上升"},{"k":"C","t":"最小化误差"},{"k":"D","t":"误差逆传播"}],"ans":"A","multi":false,"note":"","ex":"考点是BP算法的调整策略。BP算法前向计算输出误差，再将误差逐层反传，基于梯度下降策略沿负梯度方向调整各层参数，故选A。"},{"n":365,"sec":"第五章 神经网络","stem":"BP 算法经常使用（ ）方法调整参数。（ ）","opts":[{"k":"A","t":"梯度下降"},{"k":"B","t":"梯度上升"},{"k":"C","t":"最小二乘法"},{"k":"D","t":"极大似然法"}],"ans":"A","multi":false,"note":"","ex":"考点是BP算法调参的方法。BP网络训练中最常用梯度下降及其变体迭代更新权重和阈值，使损失逐步下降，故选A。"},{"n":366,"sec":"第五章 神经网络","stem":"BP 神经网络的学习规则是（ ）。（ ）","opts":[{"k":"A","t":"梯度上升法"},{"k":"B","t":"梯度下降法"},{"k":"C","t":"梯度提升法"},{"k":"D","t":"梯度曲线法"}],"ans":"B","multi":false,"note":"","ex":"考点是BP网络的学习规则。BP网络以损失最小为目标，沿负梯度方向更新参数，其学习规则即梯度下降法，故选B。"},{"n":367,"sec":"第五章 神经网络","stem":"对单层感知机判别分类，描述不正确的是（ ）。（ ）","opts":[{"k":"A","t":"线性分类"},{"k":"B","t":"监督学习"},{"k":"C","t":"错误误差最小"},{"k":"D","t":"错误误差最大"}],"ans":"D","multi":false,"note":"","ex":"考点是单层感知机的判别特性。单层感知机是线性分类模型、用监督学习训练，目标是使分类误差尽量小；误差最大与该目标相悖，描述不正确，故选D。"},{"n":368,"sec":"第五章 神经网络","stem":"多层感知机表示异或逻辑时最少需要（ ）个隐含层（仅考虑二元入）。","opts":[{"k":"A","t":"1"},{"k":"B","t":"2"},{"k":"C","t":"3"},{"k":"D","t":"4"}],"ans":"B","multi":false,"note":"","ex":"考点是多层感知机表示异或的结构。异或线性不可分，单层感知机无法实现，必须引入隐层组合线性边界；本题按题库答案取最少2个隐含层，故选B。（按题库答案口径）"},{"n":369,"sec":"第五章 神经网络","stem":"单位阶跃函数的缺点是什么?（ ）","opts":[{"k":"A","t":"不连续且不可微"},{"k":"B","t":"单调增"},{"k":"C","t":"非负"},{"k":"D","t":"最大值为 1"}],"ans":"A","multi":false,"note":"","ex":"考点是单位阶跃函数的性质。阶跃函数在阈值处从0跳变到1，函数不连续因而不可微，无法用梯度方法训练，这也是引入sigmoid等连续函数的原因，故选A。"},{"n":370,"sec":"第五章 神经网络","stem":"以下方法不可以用于特征降维的是（ ）。","opts":[{"k":"A","t":"Linear Discriminate Analysis"},{"k":"B","t":"Principal Component Analysis"},{"k":"C","t":"Singular Value Decomposition"},{"k":"D","t":"Monte Carlo method"}],"ans":"D","multi":false,"note":"","ex":"考点是特征降维方法。LDA、PCA、SVD分别通过投影或矩阵分解实现降维；Monte Carlo方法是一类随机模拟方法，与降维无关，故选D。"},{"n":371,"sec":"第五章 神经网络","stem":"GRU 和 LSTM 的说法正确的是（ ）。","opts":[{"k":"A","t":"GRU 通过 output gate 控制 memory"},{"k":"B","t":"LSTM 对 memory 不做控制，直接传递给下一个 unit"},{"k":"C","t":"GRU 不对上一时刻的信息做任何控制"},{"k":"D","t":"GRU 的参数比 LSTM 的参数少"}],"ans":"D","multi":false,"note":"","ex":"考点是GRU与LSTM的对比。GRU只有更新门和重置门，比LSTM的输入、遗忘、输出三个门结构更简单，参数更少，故选D；GRU没有输出门，A错误。"},{"n":372,"sec":"第五章 神经网络","stem":"以下哪种激活函数可以导致梯度消失（ ）。（ ）","opts":[{"k":"A","t":"ReLU"},{"k":"B","t":"Tanh"},{"k":"C","t":"Leaky LeLU"},{"k":"D","t":"都不是"}],"ans":"B","multi":false,"note":"","ex":"考点是激活函数与梯度消失。Tanh的导数两端趋近0且最大为1，深层网络中连乘后梯度容易指数级衰减，导致梯度消失；ReLU正区间导数恒为1，故选B。"},{"n":373,"sec":"第五章 神经网络","stem":"以下哪种激活函数可以导致梯度消失（ ）。（ ）","opts":[{"k":"A","t":"ReLU"},{"k":"B","t":"sigmoid"},{"k":"C","t":"Leaky LeLU"},{"k":"D","t":"都不是"}],"ans":"B","multi":false,"note":"","ex":"考点是激活函数与梯度消失。sigmoid的导数最大只有0.25，深层网络反向传播时逐层连乘使梯度迅速变小，容易梯度消失；ReLU正区间导数恒为1，故选B。"},{"n":374,"sec":"第五章 神经网络","stem":"下列哪个函数常被用作神经网络中的激活函数（ ）。","opts":[{"k":"A","t":"y = 1 1+e¡x"},{"k":"B","t":"y = log(x)"},{"k":"C","t":"y = x2"},{"k":"D","t":"y = 2x + 1"}],"ans":"A","multi":false,"note":"","ex":"考点是激活函数的辨识。y等于1除以(1+e的负x次方)是sigmoid函数，非线性、可微且把输出压到0与1之间，是经典激活函数；其余是普通线性或运算函数，故选A。"},{"n":375,"sec":"第五章 神经网络","stem":"下列哪个函数不满足作为神经网络激活函数的常见条件（ ）。","opts":[{"k":"A","t":"y = ReLU(x) = max(0; x)"},{"k":"B","t":"y = tanh(x)"},{"k":"C","t":"y = sin(x)"},{"k":"D","t":"y = sigmoid(x)"}],"ans":"C","multi":false,"note":"","ex":"考点是激活函数的常见条件。常用激活函数一般要求非线性且单调，ReLU、tanh、sigmoid都满足；sin(x)周期波动、不单调，不符合常见条件，故选C。"},{"n":376,"sec":"第五章 神经网络","stem":"下列哪个激活函数在输入小于 0 时，存在“神经元死亡”（输出恒为 0）的问\n题（ ）。","opts":[{"k":"A","t":"y = max(0; x)"},{"k":"B","t":"y = tanh(x)"},{"k":"C","t":"y = 1 1+e¡x"},{"k":"D","t":"y = ln(1 + ex)"}],"ans":"A","multi":false,"note":"","ex":"考点是ReLU的神经元死亡问题。y=max(0,x)即ReLU，输入小于0时输出恒为0、梯度也为0，神经元长期不被激活就是神经元死亡，故选A。"},{"n":377,"sec":"第五章 神经网络","stem":"如果一个神经网络的所有层都使用 y=3x 作为激活函数，那么该网络实际上\n等价于（ ）。","opts":[{"k":"A","t":"一个多层非线性分类器"},{"k":"B","t":"一个单层线性回归模型"},{"k":"C","t":"一个多层感知机（MLP）"},{"k":"D","t":"一个卷积神经网络（CNN）"}],"ans":"B","multi":false,"note":"","ex":"考点是线性激活的等价性。多个线性变换的复合仍是线性变换，各层都用y=3x的网络无论多少层都等价于一个单层线性模型，故选B。"},{"n":378,"sec":"第五章 神经网络","stem":"下列哪个函数不可以做激活函数（ ）。","opts":[{"k":"A","t":"y = tanh(x)"},{"k":"B","t":"y = sin(x)"},{"k":"C","t":"y = max(0; x)"},{"k":"D","t":"y = 2x + 1"}],"ans":"D","multi":false,"note":"","ex":"考点是激活函数的非线性要求。y=2x+1是线性函数，多层叠加后仍是线性变换，无法引入非线性表达能力，不适合做激活函数，故选D。"},{"n":379,"sec":"第五章 神经网络","stem":"下列哪个选项是神经网络万有逼近的正确表述?（ ）","opts":[{"k":"A","t":"仅需一个包含足够多神经元的隐层,多层前馈神经网络就能以任意精度逼近任意复杂度的可测函数"},{"k":"B","t":"仅需一个包含足够多神经的隐层,多层前馈神经网络就能完美表示任意复杂度的连续函数"},{"k":"C","t":"仅需一个包含足够多神经元的隐层,多层前馈神经网络就能以任意精度逼近任意复杂度的连续函数"},{"k":"D","t":"仅需一个包含 100000000 个神经元的隐层,多前馈神经网络就能以任意精度逼近任意复杂度的连续函数"}],"ans":"C","multi":false,"note":"","ex":"考点是万有逼近定理。只需一个含足够多神经元的隐层，多层前馈网络就能以任意精度逼近任意复杂度的连续函数，C表述正确；B错在说成完美表示，A的可测函数范围过大，D的神经元数量并非固定十亿个。"},{"n":380,"sec":"第五章 神经网络","stem":"下列哪个模型不具备万有逼近性?（ ）","opts":[{"k":"A","t":"线性模型"},{"k":"B","t":"泰勒展开"},{"k":"C","t":"傅里叶变换"},{"k":"D","t":"决策树"}],"ans":"A","multi":false,"note":"","ex":"考点是万有逼近性的判定。线性模型只能表达线性关系，无论参数如何调整都难以逼近任意连续函数，故不具备万有逼近性；泰勒展开、傅里叶变换在条件充分时可逼近，决策树加深后也能细分空间。"},{"n":381,"sec":"第五章 神经网络","stem":"下列关于多层前馈神经网络的描述中错误的是哪个?（ ）","opts":[{"k":"A","t":"可以使用 BP 算法优化"},{"k":"B","t":"至少包含一个隐层"},{"k":"C","t":"神经元之间不存在同层连接"},{"k":"D","t":"输入层可以直接连接到输出层"}],"ans":"D","multi":false,"note":"","ex":"考点是多层前馈网络的结构。多层前馈网络按定义至少含一个隐层，若输入层直接连到输出层就退化为单层网络，故D的描述错误；可用BP算法优化、同层神经元间不连接，A、B、C均为正确描述。"},{"n":382,"sec":"第五章 神经网络","stem":"下列哪个选项的步长(学习率)调整方法是给出的四种方案中最好的?（ ）","opts":[{"k":"A","t":"先使用较大的步长,后使用较小的步长"},{"k":"B","t":"先使用较小的步长,后使用较大的步长"},{"k":"C","t":"直使用较大的步长"},{"k":"D","t":"直使用较小的步长"}],"ans":"A","multi":false,"note":"","ex":"考点是学习率的调整策略。训练初期离最优解远，先用大步长快速下降，后期接近最优解，改用小步长避免在极值点附近振荡或跳过，故先大后小是四种方案中最好的，A正确。"},{"n":383,"sec":"第五章 神经网络","stem":"下列哪项使神经网络具有非线性?（ ）","opts":[{"k":"A","t":"随机梯度下降"},{"k":"B","t":"激活函数"},{"k":"C","t":"卷积函数"},{"k":"D","t":"权重矩阵"}],"ans":"B","multi":false,"note":"跟上面广义线性模型的内容呼应，目的就是映射到非线性的真实值","ex":"考点是网络非线性的来源。权重矩阵与卷积运算都是线性变换，多层堆叠仍等价于线性模型；激活函数对神经元输出做非线性变换，才使网络能拟合非线性关系，与广义线性模型引入联系函数的思想呼应。"},{"n":384,"sec":"第五章 神经网络","stem":"目前神经网络最常用的网络结构是下列哪个选项?（ ）","opts":[{"k":"A","t":"单层后向网络"},{"k":"B","t":"多层后向网络"},{"k":"C","t":"单层前馈网络"},{"k":"D","t":"多层前馈网络"}],"ans":"D","multi":false,"note":"","ex":"考点是常用网络结构。多层前馈网络信号逐层向前传播、结构清晰，配合BP算法可有效训练，是目前应用最广泛的网络结构，故选D；并没有后向网络这类常用结构，单层前馈网络表达能力有限。"},{"n":385,"sec":"第五章 神经网络","stem":"BP 算法的每一轮采用的是什么学习规则?（ ）","opts":[{"k":"A","t":"广义感知机学习规则"},{"k":"B","t":"广义最小二乘学习规则"},{"k":"C","t":"广义决策树学习规则"},{"k":"D","t":"广义支持向量机学习规则"}],"ans":"A","multi":false,"note":"","ex":"考点是BP算法的学习规则。BP算法每一轮根据误差逆传播按负梯度方向更新连接权与阈值，这是感知机学习规则的推广，即广义感知机学习规则，故选A；与最小二乘、决策树、SVM的规则无关。"},{"n":386,"sec":"第五章 神经网络","stem":"下列关于 BP 算法使用小步长优化神经网络的说法中正确的是哪个?（ ）","opts":[{"k":"A","t":"一定能学到最优解"},{"k":"B","t":"可以较好的避免振荡现象"},{"k":"C","t":"训练速度快"},{"k":"D","t":"学得的解比使用大步长具有更小的泛化误差"}],"ans":"B","multi":false,"note":"","ex":"考点是学习率大小对训练的影响。小步长每次参数更新幅度小，能较好避免在极值附近来回振荡，B正确；但它收敛慢、不保证学到最优解，也不能保证泛化误差一定比大步长小，A、C、D错误。"},{"n":387,"sec":"第五章 神经网络","stem":"在训练神经网络时，如果出现训练误差过高，下列哪种方法不能大幅度降\n低训练误差（ ）。（ ）","opts":[{"k":"A","t":"增加一个隐藏层"},{"k":"B","t":"在隐藏层中增加更多神经元"},{"k":"C","t":"对训练数据进行标准化"},{"k":"D","t":"增加训练数据"}],"ans":"D","multi":false,"note":"","ex":"考点是降低训练误差的手段。训练误差过高说明模型拟合能力不足，增加隐藏层、增加神经元、数据标准化都有助于提升拟合能力；而增加训练数据主要提升泛化能力，不会大幅降低训练误差，故选D。"},{"n":388,"sec":"第五章 神经网络","stem":"增加以下哪些超参数可能导致随机森林模型过拟合数据（ ）。（ ）\n（1）决策树的数量；（2）决策树的深度；（3）学习率","opts":[{"k":"A","t":"（1）"},{"k":"B","t":"（2）"},{"k":"C","t":"（3）"},{"k":"D","t":"（2）（3）"}],"ans":"B","multi":false,"note":"","ex":"考点是随机森林的过拟合来源。决策树深度越大，单棵树越复杂、越容易记住训练样本，从而使森林过拟合，故（2）正确；树的数量增加使集成更稳定、不易过拟合，随机森林也没有学习率这个超参数。"},{"n":389,"sec":"第五章 神经网络","stem":"以下关于深度神经网络训练的说法正确的是（ ）。（ ）","opts":[{"k":"A","t":"训练过程需要用到梯度，梯度衡量了损失函数相对于模型参数的变化率"},{"k":"B","t":"损失函数衡量了模型预测结果与真实值之间的差异"},{"k":"C","t":"训练过程基于一种叫做反向传播的技术"},{"k":"D","t":"以上都正确"}],"ans":"D","multi":false,"note":"","ex":"考点是深度网络训练的基本概念。梯度衡量损失函数对模型参数的变化率，损失函数衡量预测与真实值的差异，训练基于反向传播技术，三项表述均正确，故选D以上都正确。"},{"n":390,"sec":"第五章 神经网络","stem":"以下哪一项在神经网络中引入了非线性（ ）。（ ）","opts":[{"k":"A","t":"Dropout"},{"k":"B","t":"LeLU"},{"k":"C","t":"卷积函数"},{"k":"D","t":"随机梯度下降"}],"ans":"B","multi":false,"note":"","ex":"考点是非线性的引入。B项LeLU即ReLU激活函数，对神经元输出做非线性变换，为网络引入非线性；Dropout是正则化手段，卷积是线性运算，随机梯度下降是优化方法，均不引入非线性。"},{"n":391,"sec":"第五章 神经网络","stem":"关于 CNN，以下结论正确的是（ ）。（ ）","opts":[{"k":"A","t":"在同样层数、每层神经元数量一样的情况下，CNN 比全连接网络拥有更多的参数"},{"k":"B","t":"CNN 可以用于非监督学习，但是普通神经网络不行"},{"k":"C","t":"Pooling 层用于减少图片的空间分辨率"},{"k":"D","t":"接近输出层的 filter 主要用于提取图像的边缘信息"}],"ans":"C","multi":false,"note":"","ex":"考点是CNN各组件的作用。池化层对特征图下采样，减少空间分辨率并降低计算量，C正确；CNN因权值共享参数比同规模全连接网络少，接近输出的卷积核提取高层语义而非边缘信息，普通神经网络也能用于无监督学习。"},{"n":392,"sec":"第五章 神经网络","stem":"梯度爆炸问题是指在训练深度神经网络的时候，梯度变得过大而损失函数\n变为无穷。在 RNN 中，下面哪种方法可以较好地处理梯度爆炸问题（ ）。（ ）","opts":[{"k":"A","t":"梯度裁剪"},{"k":"B","t":"dropout"},{"k":"C","t":"加入正则项"},{"k":"D","t":"都不行"}],"ans":"A","multi":false,"note":"","ex":"考点是RNN梯度爆炸的处理。梯度裁剪把过大的梯度按范数缩放到阈值以内再更新，能较好抑制RNN中的梯度爆炸，故选A；dropout与正则项主要用来抑制过拟合和缓解梯度消失，对爆炸效果不佳。"},{"n":393,"sec":"第五章 神经网络","stem":"下列关于卷积神经网络，说法正确的是（ ）。（ ）","opts":[{"k":"A","t":"卷积神经网络只能有一个卷积核"},{"k":"B","t":"卷积神经网络可以有多个卷积核，但是必须同大小"},{"k":"C","t":"卷积神经网络可以有多个卷积核，可以不同大小"},{"k":"D","t":"卷积神经网络不能使用在文本这种序列数据中"}],"ans":"C","multi":false,"note":"","ex":"考点是卷积核的设置。卷积层可以有多个卷积核以提取多种特征，且卷积核大小可以不同，故C正确；CNN经一维卷积也能处理文本等序列数据，D错误；A、B对卷积核数量与大小的限制不成立。"},{"n":394,"sec":"第五章 神经网络","stem":"对于神经网络模型，当样本足够多时，少量输入样本中带有较大的误差甚\n至个别错误对模型的输入-输出映射关系影响很小，这属于（ ）","opts":[{"k":"A","t":"泛化能力"},{"k":"B","t":"容错能力"},{"k":"C","t":"搜索能力"},{"k":"D","t":"非线性映射能力"}],"ans":"B","multi":false,"note":"","ex":"考点是神经网络特性的辨析。样本足够多时，少量输入样本带较大误差甚至错误对学到的输入输出映射影响很小，这体现网络对噪声和异常的容忍，属于容错能力，故选B；泛化能力指对未见样本的预测表现。"},{"n":395,"sec":"第五章 神经网络","stem":"机器学习训练时，Mini-Batch 的大小优选为 2 个的幂，如 256 或 512。它\n背后的原因是什么？（ ）","opts":[{"k":"A","t":"Mini-Batch 为偶数的时候，梯度下降算法训练的更快"},{"k":"B","t":"Mini-Batch 设为 2 的幂，是为了符合 CPU、GPU 的内存要求，利于并行化处理"},{"k":"C","t":"不使用偶数时，损失函数是不稳定的"},{"k":"D","t":"以上说法都不对"}],"ans":"B","multi":false,"note":"","ex":"考点是Mini-Batch取2的幂的原因。CPU与GPU的内存分配和并行计算单元按二进制组织，批大小取2的幂利于内存对齐与并行化处理，故B正确；训练快慢、损失稳定与偶数与否并无必然关系。"},{"n":396,"sec":"第五章 神经网络","stem":"下列哪些算法可以用来够造神经网络（多选）？（ ）","opts":[{"k":"A","t":"kNN"},{"k":"B","t":"线性回归"},{"k":"C","t":"逻辑回归"}],"ans":"BC","multi":true,"note":"解析：本题考查的是 kNN、线性回归、逻辑回归与神经网络之间的一些关系。\nkNN 是一种基于实例的学习算法，不具有任何训练参数。因此不能用来构造神\n经网络。\n线性回归和逻辑回归都可以用来构造神经网络模型，其实二者就是单神经元的神\n经网络。","ex":"考点是单神经元网络与经典算法的关系，多选题选B、C。线性回归与逻辑回归都可视为单个神经元构成的网络，能用来构造神经网络；kNN是基于实例的惰性学习，没有可训练参数，不能用来构造神经网络。"},{"n":397,"sec":"第五章 神经网络","stem":"下面哪个不是神经网络必须包括的结构（ ）？","opts":[{"k":"A","t":"输入层"},{"k":"B","t":"卷积层"},{"k":"C","t":"激活函数"},{"k":"D","t":"输出层"}],"ans":"B","multi":false,"note":"","ex":"考点是神经网络必备结构。输入层、输出层与激活函数是神经网络的基本组成，而卷积层只是卷积神经网络特有的层，普通神经网络不需要卷积层也能构成，故卷积层不是必备结构，选B。"},{"n":398,"sec":"第五章 神经网络","stem":"神经网络算法不能完成下列哪项任务（ ）？","opts":[{"k":"A","t":"分类"},{"k":"B","t":"回归"},{"k":"C","t":"硬件制造"},{"k":"D","t":"机器翻译"}],"ans":"C","multi":false,"note":"","ex":"考点是神经网络的应用边界。分类、回归与机器翻译都是神经网络能完成的学习任务，而硬件制造不属于学习任务，神经网络算法无法直接完成，故选C。"},{"n":399,"sec":"第五章 神经网络","stem":"下列哪项任务不属于神经网络算法的典型应用（ ）。","opts":[{"k":"A","t":"图像识别（分类任务）"},{"k":"B","t":"房价预测（回归任务）"},{"k":"C","t":"机器翻译（序列到序列任务）"},{"k":"D","t":"数据库底层存储引擎的开发"}],"ans":"D","multi":false,"note":"","ex":"考点是神经网络的典型应用。图像识别、房价预测、机器翻译分别对应分类、回归与序列到序列任务，都是典型应用；数据库底层存储引擎开发属于系统软件工程，与神经网络算法无关，故选D。"},{"n":400,"sec":"第五章 神经网络","stem":"在一个 3-5-1 的神经网络中，有多少个待定参数?","opts":[{"k":"A","t":"9"},{"k":"B","t":"15"},{"k":"C","t":"20"},{"k":"D","t":"26"}],"ans":"D","multi":false,"note":"需通过学习确定的参数数目:(d +L+1)q +L，d 为输入层神经元数量，L\n为输出层神经元数量，q 为隐层神经元数量:(3 +1+1)5 +1=26","ex":"考点是网络待定参数的计算。3-5-1网络输入层3个、隐层5个、输出层1个神经元，参数为输入到隐层权值15、隐层阈值5、隐层到输出权值5、输出阈值1，共26个，对应公式(d+L+1)q+L，故选D。"},{"n":401,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）主要用于解决哪种类型的问题？（ ）","opts":[{"k":"A","t":"回归问题"},{"k":"B","t":"分类问题"},{"k":"C","t":"聚类问题"},{"k":"D","t":"降维问题"}],"ans":"B","multi":false,"note":"","ex":"考点是SVM的主要用途。支持向量机通过最大间隔超平面区分不同类别样本，主要用于解决分类问题，故选B；虽有支持向量回归等扩展，但聚类与降维并非其主要用途。"},{"n":402,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）的核心思想是什么？（ ）","opts":[{"k":"A","t":"最大化数据点之间的距离"},{"k":"B","t":"最小化数据点之间的距离"},{"k":"C","t":"最大化间隔"},{"k":"D","t":"最小化间隔"}],"ans":"C","multi":false,"note":"","ex":"考点是SVM的核心思想。SVM寻找能把两类样本分开且间隔最大的超平面，间隔越大通常泛化越好，故核心思想是最大化间隔，选C；A说最大化数据点之间的距离，表述对象不准确。"},{"n":403,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）的核心基本思想是（ ）。","opts":[{"k":"A","t":"找到一条直线穿过尽可能多的样本点"},{"k":"B","t":"在特征空间中寻找一个最大间隔超平面，将不同类别的样本分开"},{"k":"C","t":"利用树状结构对样本进行递归划分"},{"k":"D","t":"计算样本之间的欧氏距离进行投票分类"}],"ans":"B","multi":false,"note":"","ex":"考点是SVM的基本思想。SVM在特征空间中寻找一个最大间隔超平面将不同类别样本分开，B正确；C是决策树的划分方式，D是kNN的做法，A的穿过尽可能多样本点不是SVM的目标。"},{"n":404,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“支持向量”是指（ ）。","opts":[{"k":"A","t":"用于分类的向量"},{"k":"B","t":"用于回归的向量"},{"k":"C","t":"决定分类边界的样本点"},{"k":"D","t":"用于聚类的向量"}],"ans":"C","multi":false,"note":"","ex":"考点是支持向量的定义。支持向量是距离超平面最近、位于间隔边界上并决定超平面位置的样本点，故选C；它并非按用于分类、回归或聚类来定义。"},{"n":405,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“间隔”是指（ ）。","opts":[{"k":"A","t":"两个类别的距离"},{"k":"B","t":"两个支持向量之间的距离"},{"k":"C","t":"两个类别的平均距离"},{"k":"D","t":"两个类别的最大距离"}],"ans":"B","multi":false,"note":"","ex":"考点是间隔的定义。SVM的间隔指两类支持向量所在间隔边界之间的距离，即异类支持向量间的距离2/||w||，故选B；A、C、D关于类别距离的说法都不是间隔的定义。"},{"n":406,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“核函数”用于（ ）。","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"映射数据到高维空间"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是核函数的作用。核函数把原始低维数据隐式映射到高维特征空间，使线性不可分的数据变得线性可分，且无需显式写出高维向量，故选C；它并非用来增加数据量。"},{"n":407,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“线性核”是指（ ）。","opts":[{"k":"A","t":"将数据映射到线性空间"},{"k":"B","t":"将数据映射到高维空间"},{"k":"C","t":"不进行任何映射"},{"k":"D","t":"将数据映射到低维空间"}],"ans":"C","multi":false,"note":"不对输入数据进行非线性映射，直接在原始特征空间构造一个线性分类器的核函\n数。","ex":"考点是线性核的含义。线性核不对输入数据做非线性映射，直接在原始特征空间中构造线性分类器，相当于不进行任何映射，故选C；A、B把线性核说成映射到线性或高维空间均不正确。"},{"n":408,"sec":"第六章 支持向量机","stem":"当数据在原始空间中线性不可分时，SVM 通常采用什么方法来解决（ ）。","opts":[{"k":"A","t":"引入核函数（Kernel Trick），将数据映射到高维空间使其线性可分"},{"k":"B","t":"增加更多的线性分类器进行投票"},{"k":"C","t":"直接放弃该数据集"},{"k":"D","t":"删掉分类错误的样本点"}],"ans":"A","multi":false,"note":"","ex":"考点是线性不可分时的处理。SVM引入核函数，把数据隐式映射到更高维空间使其线性可分，即核技巧，故选A；增加投票、放弃数据集或删除错分样本都不是SVM的做法。"},{"n":409,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“多项式核”用于（ ）。","opts":[{"k":"A","t":"处理线性可分数据"},{"k":"B","t":"处理非线性可分数据"},{"k":"C","t":"增加模型的复杂度"},{"k":"D","t":"减少计算时间"}],"ans":"B","multi":false,"note":"","ex":"考点是多项式核的用途。多项式核把原始特征做高阶组合映射到高维空间，用于处理非线性可分的数据，故选B；线性可分数据用线性核即可，它也不是为了增加复杂度或减少计算时间。"},{"n":410,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“径向基函数（RBF）核”用于（ ）。","opts":[{"k":"A","t":"处理线性可分数据"},{"k":"B","t":"处理非线性可分数据"},{"k":"C","t":"增加模型的复杂度"},{"k":"D","t":"减少计算时间"}],"ans":"B","multi":false,"note":"","ex":"考点是RBF核的用途。径向基（高斯）核把样本映射到高维甚至无限维空间，适合处理非线性可分数据，是最常用的非线性核，故选B；它并非用于线性可分数据或减少计算时间。"},{"n":411,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“正则化参数（C）”的作用是（ ）。","opts":[{"k":"A","t":"控制模型的复杂度"},{"k":"B","t":"控制参数更新的步长"},{"k":"C","t":"控制模型的训练时间"},{"k":"D","t":"控制模型的损失函数"}],"ans":"A","multi":false,"note":"","ex":"考点是正则化参数C的作用。C权衡间隔与训练错误：C越大对误分类惩罚越重、模型越复杂，C越小容忍更多错误、模型越简单，可见C控制模型复杂度，故选A。"},{"n":412,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“松弛变量（ξ）”用于：","opts":[{"k":"A","t":"增加模型的复杂度"},{"k":"B","t":"减少计算时间"},{"k":"C","t":"允许一些数据点违反分类边界"},{"k":"D","t":"增加数据量"}],"ans":"C","multi":false,"note":"","ex":"考点是松弛变量的作用。软间隔SVM引入松弛变量ξ，允许部分样本不满足约束、违反分类边界甚至被误分类，从而在有噪声的数据上得到更稳健的解，故选C。"},{"n":413,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“对偶问题”是指：","opts":[{"k":"A","t":"原始优化问题的对偶形式"},{"k":"B","t":"原始优化问题的逆问题"},{"k":"C","t":"原始优化问题的简化形式"},{"k":"D","t":"原始优化问题的扩展形式"}],"ans":"A","multi":false,"note":"","ex":"考点是对偶问题的概念。SVM利用拉格朗日乘子法把原始约束优化问题转化为对偶形式求解，对偶问题就是原始优化问题的对偶形式，故选A；它不是逆问题、简化形式或扩展形式。"},{"n":414,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“拉格朗日乘子法”用于：","opts":[{"k":"A","t":"求解对偶问题"},{"k":"B","t":"求解原始问题"},{"k":"C","t":"增加模型的复杂度"},{"k":"D","t":"减少计算时间"}],"ans":"A","multi":false,"note":"","ex":"考点是拉格朗日乘子法的用途。SVM求解时先对约束写出拉格朗日函数，再转化到对偶问题求解，即拉格朗日乘子法用于求解对偶问题，故选A。"},{"n":415,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“核技巧”是指：","opts":[{"k":"A","t":"使用核函数映射数据到高维空间"},{"k":"B","t":"使用核函数映射数据到低维空间"},{"k":"C","t":"使用核函数减少计算时间"},{"k":"D","t":"使用核函数增加数据量"}],"ans":"A","multi":false,"note":"","ex":"考点是核技巧的含义。核技巧是用核函数直接计算高维空间中的内积，等价于把数据映射到高维空间而不显式构造映射，故选A；映射到低维、减少计算时间、增加数据量都不是它的含义。"},{"n":416,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“线性 SVM”是指：","opts":[{"k":"A","t":"使用线性核的 SVM"},{"k":"B","t":"使用多项式核的 SVM"},{"k":"C","t":"使用 RBF 核的 SVM"},{"k":"D","t":"使用 sigmoid 核的 SVM"}],"ans":"A","multi":false,"note":"","ex":"考点是线性SVM的界定。使用线性核、直接在原始特征空间学习线性超平面的SVM称为线性SVM，故选A；多项式核、RBF核、sigmoid核对应的都不是线性SVM。"},{"n":417,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“非线性 SVM”是指：","opts":[{"k":"A","t":"使用线性核的 SVM"},{"k":"B","t":"使用多项式核的 SVM"},{"k":"C","t":"使用 RBF 核的 SVM"},{"k":"D","t":"使用 sigmoid 核的 SVM"}],"ans":"B","multi":false,"note":"","ex":"考点是非线性SVM的界定。多项式核把数据映射到高维空间实现非线性分类，使用它的SVM就是非线性SVM，故选B；线性核对应的是线性SVM，不用核函数则是线性情形。"},{"n":418,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“软间隔”是指：","opts":[{"k":"A","t":"允许一些数据点违反分类边界"},{"k":"B","t":"不允许任何数据点违反分类边界"},{"k":"C","t":"增加模型的复杂度"},{"k":"D","t":"减少计算时间"}],"ans":"A","multi":false,"note":"","ex":"考点是软间隔的含义。软间隔SVM允许部分样本不满足约束、违反分类边界或间隔要求，以换取在噪声数据上更好的泛化性能，故选A；不允许任何样本违反边界的是硬间隔。"},{"n":419,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“硬间隔”是指：","opts":[{"k":"A","t":"允许一些数据点违反分类边界"},{"k":"B","t":"不允许任何数据点违反分类边界"},{"k":"C","t":"增加模型的复杂度"},{"k":"D","t":"减少计算时间"}],"ans":"B","multi":false,"note":"","ex":"考点是硬间隔的含义。硬间隔SVM要求所有样本严格满足约束条件，不允许任何数据点违反分类边界，仅适用于线性可分数据，故选B；允许少量违反的是软间隔。"},{"n":420,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“C 参数”越大，模型的复杂度：","opts":[{"k":"A","t":"越高"},{"k":"B","t":"越低"},{"k":"C","t":"不变"},{"k":"D","t":"无法确定"}],"ans":"A","multi":false,"note":"","ex":"考点是C参数与复杂度的关系。C越大对违反约束或误分类的惩罚越重，模型倾向于拟合所有训练样本、间隔变小，模型复杂度越高，容易过拟合，故选A。"},{"n":421,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“C 参数”越小，模型的复杂度：","opts":[{"k":"A","t":"越高"},{"k":"B","t":"越低"},{"k":"C","t":"不变"},{"k":"D","t":"无法确定"}],"ans":"B","multi":false,"note":"","ex":"考点是C参数与复杂度的关系。C越小对误分类越宽容，允许更多样本违反间隔约束，模型倾向选择更简单的超平面，复杂度越低、欠拟合风险增大，故选B。"},{"n":422,"sec":"第六章 支持向量机","stem":"支持向量机（SVM）中的“γ参数”（在 RBF 核中）越大，模型的复杂度：","opts":[{"k":"A","t":"越高"},{"k":"B","t":"越低"},{"k":"C","t":"不变"},{"k":"D","t":"无法确定"}],"ans":"A","multi":false,"note":"","ex":"考点是RBF核γ参数与复杂度的关系。γ越大高斯核影响范围越窄，决策边界越弯曲、越贴合训练样本，模型复杂度越高、易过拟合，故选A。"},{"n":423,"sec":"第六章 支持向量机","stem":"支持向量机常用的核函数有几种（ ）。","opts":[{"k":"A","t":"1"},{"k":"B","t":"2"},{"k":"C","t":"3"},{"k":"D","t":"4"}],"ans":"C","multi":false,"note":"","ex":"考点是SVM常用核函数的种类。按课程口径，常用核函数有线性核、多项式核、径向基（高斯）核三种，故选C；sigmoid等其他核使用较少，不计入常用之列。"},{"n":424,"sec":"第六章 支持向量机","stem":"支持向量机常用的核函数（ ）","opts":[{"k":"A","t":"高斯核函数"},{"k":"B","t":"二项式核函数"},{"k":"C","t":"贝叶斯核函数"},{"k":"D","t":"网络核函数"}],"ans":"A","multi":false,"note":"","ex":"考点是常用核函数的识别。高斯核即径向基核，是SVM最常用的核函数之一，故选A；二项式核、贝叶斯核、网络核都不是标准的常用核函数名称。"},{"n":425,"sec":"第六章 支持向量机","stem":"SVM 的原理的简单描述，可概括为（ ）。","opts":[{"k":"A","t":"最小均方误差分类"},{"k":"B","t":"最小距离分类"},{"k":"C","t":"最大间隔分类"},{"k":"D","t":"最近邻分类"}],"ans":"C","multi":false,"note":"","ex":"考点是SVM原理的概括。SVM通过构造最大间隔超平面把类别分开，可概括为最大间隔分类，故选C；最小均方误差对应最小二乘思想，最近邻对应kNN，均非SVM。"},{"n":426,"sec":"第六章 支持向量机","stem":"支持向量机的学习策略是（ ）。","opts":[{"k":"A","t":"间隔最小化"},{"k":"B","t":"间隔最大化"},{"k":"C","t":"间隔平均化"},{"k":"D","t":"间隔随机化"}],"ans":"B","multi":false,"note":"","ex":"考点是SVM的学习策略。SVM的学习策略是间隔最大化，并可将该策略形式化为凸二次规划问题求解，故选B；间隔最小化、平均化、随机化都不是其策略。"},{"n":427,"sec":"第六章 支持向量机","stem":"对于线性可分的二分类任务样本集.将训练样本分开的超平面有很多,支持\n向量机试图寻找满足什么条件的超平面?（ ）","opts":[{"k":"A","t":"在正负类样本“正中间”的"},{"k":"B","t":"靠近正类样本的"},{"k":"C","t":"靠近负类样本的"},{"k":"D","t":"以上说法都不对"}],"ans":"A","multi":false,"note":"","ex":"考点是最大间隔超平面的位置。线性可分时能把样本分开的超平面有无穷多个，SVM选取位于正负类样本正中间、使间隔最大的那个，此时模型对扰动最稳健，故选A。"},{"n":428,"sec":"第六章 支持向量机","stem":"下面关于支持向量机的说法错误的是（ ）","opts":[{"k":"A","t":"支持向量机基本型是一个凸二次规划问题"},{"k":"B","t":"将训练样本分开的超平面仅由支持向量决定"},{"k":"C","t":"支持向量机的核心思想是最大化间隔"},{"k":"D","t":"支持向量机更适合做分类任务"}],"ans":"D","multi":false,"note":"要看具体问题的效果","ex":"考点是SVM性质的正误判断。SVM基本型是凸二次规划、分离超平面仅由支持向量决定、核心思想是最大化间隔，A、B、C均正确；更适合做分类任务的说法绝对，效果需视具体问题而定，故选D。"},{"n":429,"sec":"第六章 支持向量机","stem":"SVM 的算法性能取决于（ ）。（ ）","opts":[{"k":"A","t":"核函数的选择"},{"k":"B","t":"核函数的参数"},{"k":"C","t":"软间隔参数 C"},{"k":"D","t":"以上所有"}],"ans":"D","multi":false,"note":"","ex":"考点是SVM性能的影响因素。核函数的选择决定模型是否匹配数据分布，核函数参数（如γ）与软间隔参数C共同控制复杂度和泛化能力，三者都影响SVM性能，故选D以上所有。"},{"n":430,"sec":"第六章 支持向量机","stem":"SVM 的对偶问题是（ ）。（ ）","opts":[{"k":"A","t":"线性优化问题"},{"k":"B","t":"二次优化问题"},{"k":"C","t":"凸二次优化"},{"k":"D","t":"带约束的线性优化"}],"ans":"C","multi":false,"note":"","ex":"考点是SVM对偶问题的性质。SVM原始问题是凸二次规划，其拉格朗日对偶问题同样是凸二次优化问题，存在全局最优解，故选C；它不是线性优化或带约束线性优化问题。"},{"n":431,"sec":"第六章 支持向量机","stem":"以下对支持向量机中的支撑向量的描述，正确的是（ ）。（ ）","opts":[{"k":"A","t":"最大特征向量"},{"k":"B","t":"最优投影向量"},{"k":"C","t":"最大间隔支撑面上的向量"},{"k":"D","t":"最速下降方向"}],"ans":"C","multi":false,"note":"","ex":"考点是支撑向量的刻画。支持向量是位于最大间隔边界（支撑面）上的样本点，正是它们决定最优超平面，故选C；最大特征向量、最优投影向量、最速下降方向都不是其含义。"},{"n":432,"sec":"第六章 支持向量机","stem":"假定有一个数据集 S，但该数据集有很多误差，采用软间隔 SVM 训练，阈\n值为 C，如果 C 的值很小，以下哪种说法正确？（ ）。（ ）","opts":[{"k":"A","t":"会发生误分类现象"},{"k":"B","t":"数据将被正确分类"},{"k":"C","t":"不确定"},{"k":"D","t":"以上都不对"}],"ans":"A","multi":false,"note":"","ex":"考点是软间隔SVM中C取值的影响。C很小时对违反约束的惩罚很轻，模型容忍大量错误以换取更大间隔，因此在误差很多的数据集上会出现误分类现象，故选A。"},{"n":433,"sec":"第六章 支持向量机","stem":"软间隔 SVM 的阈值趋于无穷，下面哪种说法正确（ ）。（ ）","opts":[{"k":"A","t":"只要最佳分类超平面存在，它就能将所有数据全部正确分类"},{"k":"B","t":"软间隔 SVM 分类器将正确分类数据"},{"k":"C","t":"会发生误分类现象"},{"k":"D","t":"以上都不对"}],"ans":"A","multi":false,"note":"","ex":"考查软间隔 SVM 惩罚参数趋于无穷的极限行为：惩罚无穷大意味着任何误分类都不可接受，软间隔退化为硬间隔，只要最佳分类超平面存在就能将所有数据全部正确分类，故选 A；B 缺少这一前提条件。"},{"n":434,"sec":"第六章 支持向量机","stem":"有两个样本点，第一个点为正样本，它的特征向量是(0,-1)；第二个点为负\n样本，它的特征向量是(2,3)，从这两个样本点组成的训练集构建一个线性 SVM\n分类器的分类面方程是（ ）。（ ）","opts":[{"k":"A","t":"2x+y=4"},{"k":"B","t":"x+2y=5"},{"k":"C","t":"x+2y=3"},{"k":"D","t":"以上都不对"}],"ans":"C","multi":false,"note":"注：两条直线相互垂直，它们的斜率乘积为-1。目标的分界面经过这两点连线的\n中点。","ex":"考查两样本线性 SVM 最大间隔分类面的求法：分类面应与两样本连线垂直且过其中点(1,1)，法向量平行于连线方向，据此可解得 x+2y=3，两个样本到该面的距离相等，故选 C。"},{"n":435,"sec":"第六章 支持向量机","stem":"假定你使用阶数为 2 的线性核 SVM，将模型的应用到实际数据集上后，其\n训练准确率和测试准确率均为 100%。现在增加模型复杂度（增加核函数的阶），\n会发生以下哪种情况（ ）。（ ）","opts":[{"k":"A","t":"过拟合"},{"k":"B","t":"欠拟合"},{"k":"C","t":"什么都不会发生，因为模型准确率已经达到极限"},{"k":"D","t":"以上都不对"}],"ans":"A","multi":false,"note":"","ex":"考查模型复杂度与过拟合：二阶核 SVM 在训练集和测试集上都已达到 100% 准确率，再升高核函数阶数只会进一步贴合训练数据的细节和噪声，泛化能力不再提升甚至下降，属于过拟合，故选 A。"},{"n":436,"sec":"第六章 支持向量机","stem":"下面哪一项不是支持向量机基本型得到对偶问题的求解步骤（ ）","opts":[{"k":"A","t":"引拉格朗日乘子得到拉格朗日函数"},{"k":"B","t":"对拉格朗日函数求偏导并令其为 0"},{"k":"C","t":"回带变量关系"},{"k":"D","t":"梯度下降"}],"ans":"D","multi":false,"note":"对偶问题求解步骤\n引拉格朗日乘子得到拉格朗日函数\n对拉格朗日函数求偏导并令其为 0\n回带变量关系","ex":"考查 SVM 基本型对偶问题的求解步骤：引入拉格朗日乘子得到拉格朗日函数，对各变量求偏导并令其为零，再回带变量关系即得对偶问题；梯度下降不是其中步骤，故选 D。"},{"n":437,"sec":"第六章 支持向量机","stem":"支持向量到超平面的距离为（ ）","opts":[{"k":"A","t":"1"},{"k":"B","t":"2"},{"k":"C","t":"2/||w||"},{"k":"D","t":"1/||w||"}],"ans":"D","multi":false,"note":"","ex":"考查间隔的定义：支持向量满足约束等号成立，到超平面的距离为 1/||w||；2/||w|| 是两类支持向量之间的间隔，题目问单个支持向量到超平面的距离，故选 D。"},{"n":438,"sec":"第六章 支持向量机","stem":"如果不存在一个能正确划分两类样本的超平面 SVM 的做法是（ ）","opts":[{"k":"A","t":"将样本从原始空间映射到一个更高维的特征空间,使样本在这个特征空间内线性可分"},{"k":"B","t":"将样本从原始空间映射到一个更高维的特征空间,使样本在这个特征空间内非线性可分"},{"k":"C","t":"将样本从原始空间映射到一个更低维的特征空间,使样本在这个特征空间内线性可分"},{"k":"D","t":"将样本从原始空间映射到一个更低维的特征空间,使样本在这个特征空间内非线性可分"}],"ans":"A","multi":false,"note":"","ex":"考查 SVM 处理线性不可分数据的思路：当不存在能正确划分两类样本的超平面时，将样本从原始空间映射到更高维的特征空间，使其在高维特征空间内线性可分，故选 A。"},{"n":439,"sec":"第六章 支持向量机","stem":"将样本映射到高维空间后,支持向量机问题的表达式为（ ）","opts":[{"k":"A","t":"minw;b12jjwjj2 s:t: yi(w>Á(xi) + b) ¸ 1; i = 1;2;¢¢¢ ; m"},{"k":"B","t":"minw;b12jjwjj2 s:t: yi(w>Á(xi)¡ b) ¸ 1; i = 1;2;¢¢¢ ; m"},{"k":"C","t":"minw;b12jjwjj2 s:t: yi(w>Á(xi) + b) ¸ ¡1; i = 1;2;¢¢¢ ; m"},{"k":"D","t":"minw;b12jjwjj2 s:t: yi(w>Á(xi)¡ b) ¸ ¡1; i = 1;2;¢¢¢ ; m"}],"ans":"A","multi":false,"note":"真实值与预测值相乘大于等于 1 才代表分类正确","ex":"考查映射到高维后的 SVM 基本型：目标函数仍为最小化 1/2||w||²，约束为标记 yi 与预测值 wᵀφ(xi)+b 同号且乘积不小于 1，即 yi(wᵀφ(xi)+b)≥1，故选 A。"},{"n":440,"sec":"第六章 支持向量机","stem":"SVM 算法的性能取决于（ ）","opts":[{"k":"A","t":"核函数的选择"},{"k":"B","t":"核函数的参数"},{"k":"C","t":"软间隔参数"},{"k":"D","t":"以上所有"}],"ans":"D","multi":false,"note":"","ex":"考查影响 SVM 性能的因素：核函数的选择决定映射方式，核函数的参数控制映射的具体形状，软间隔参数权衡间隔与误分类容忍度，三者共同决定最终性能，故选 D 以上所有。"},{"n":441,"sec":"第六章 支持向量机","stem":"SVM 中的代价参数 C 表示什么（ ）","opts":[{"k":"A","t":"在分类准确性和模型复杂度之间的权衡"},{"k":"B","t":"交叉验证的次数"},{"k":"C","t":"以上都不对"},{"k":"D","t":"用到的核函数"}],"ans":"A","multi":false,"note":"","ex":"考查软间隔 SVM 中代价参数 C 的含义：C 控制对训练误分类的惩罚力度，C 偏大更追求分对训练样本，C 偏小更追求大间隔，本质是分类准确性和模型复杂度之间的权衡，故选 A。"},{"n":442,"sec":"第六章 支持向量机","stem":"下列有关支持向量机说法不正确的是（ ）","opts":[{"k":"A","t":"得到的是局部最优解"},{"k":"B","t":"具有很好的推广能力"},{"k":"C","t":"是凸二次优化问题"},{"k":"D","t":"采用结构风险最小化原理"}],"ans":"A","multi":false,"note":"","ex":"考查 SVM 的基本性质：SVM 基本型是凸二次规划问题，局部最优即全局最优，说它只能得到局部最优解是不正确的，故选 A；其余三项都是 SVM 的正确性质。"},{"n":443,"sec":"第六章 支持向量机","stem":"下列有关核函数不正确的是（ ）","opts":[{"k":"A","t":"可以采用 cross-validation 方法选择最佳核函数"},{"k":"B","t":"满足 mercer 条件的函数不一定能作为支持向量机的核函数"},{"k":"C","t":"极大地提高了学习机器的非线性处理能力"},{"k":"D","t":"函数与非线性映射并不是一一对应的关系"}],"ans":"B","multi":false,"note":"","ex":"考查核函数的相关论断：满足 Mercer 条件的函数一定能作为支持向量机的核函数，因此 B 的说法不正确，故选 B；交叉验证选核、提升非线性处理能力、核函数与非线性映射并非一一对应均为正确说法。"},{"n":444,"sec":"第六章 支持向量机","stem":"一对一法分类器，k 个类别需要多少个 SVM（ ）","opts":[{"k":"A","t":"k(k-1)/2"},{"k":"B","t":"k(k-1)"},{"k":"C","t":"k"},{"k":"D","t":"k!"}],"ans":"A","multi":false,"note":"","ex":"考查一对一多分类策略所需的二分类器数目：k 个类别中任意两个类别都要训练一个 SVM，组合数为 k(k-1)/2，故选 A。"},{"n":445,"sec":"第七章 KNN","stem":"以下哪个模型不是分类模型。（ ）","opts":[{"k":"A","t":"最近邻"},{"k":"B","t":"K 均值"},{"k":"C","t":"朴素贝叶斯"},{"k":"D","t":"逻辑回归"}],"ans":"B","multi":false,"note":"","ex":"考查模型的任务归属：最近邻、朴素贝叶斯、逻辑回归都是分类模型，K 均值是无监督聚类算法，不属于分类模型，故选 B。"},{"n":446,"sec":"第七章 KNN","stem":"K 近邻算法是（ ）","opts":[{"k":"A","t":"有监督学习"},{"k":"B","t":"无监督学习"},{"k":"C","t":"半监督学习"},{"k":"D","t":"自主学习"}],"ans":"A","multi":false,"note":"","ex":"考查 K 近邻算法的学习类型：KNN 依靠带类别标记的训练样本，通过与已标注样本比较距离来完成预测，属于有监督学习，故选 A。"},{"n":447,"sec":"第七章 KNN","stem":"一般来说，KNN 最近邻方法在什么情况下效果好（ ）。","opts":[{"k":"A","t":"样本较多但典型性不好"},{"k":"B","t":"样本较少但典型性好"},{"k":"C","t":"样本呈团状分布"},{"k":"D","t":"样本呈链状分布"}],"ans":"B","multi":false,"note":"","ex":"考查 KNN 的适用场景：KNN 主要依靠周围的近邻点判断类别，样本较少但典型性好时近邻信息可靠、容易区分；样本呈团状或链状分布时近邻容易跨类，发挥不出求近邻的优势，故选 B。"},{"n":448,"sec":"第七章 KNN","stem":"KNN（K 近邻算法）属于一种典型的（ ）算法。","opts":[{"k":"A","t":"监督学习"},{"k":"B","t":"无监督学习"},{"k":"C","t":"半监督学习"},{"k":"D","t":"弱监督"}],"ans":"A","multi":false,"note":"","ex":"考查 KNN 的算法类型：KNN 利用带标记训练样本的类别信息进行预测，是典型的监督学习算法，故选 A。"},{"n":449,"sec":"第七章 KNN","stem":"下列选择中，关于 KNN 算法不正确的是（ ）？","opts":[{"k":"A","t":"能找出与待测样本相近的 k 个样本。"},{"k":"B","t":"距离度量是影响 KNN 算法的主要因素之一。"},{"k":"C","t":"实现过程相对简单，但是可解释性不强。"},{"k":"D","t":"KNN 的样本搜索中线性扫描效率很高。高"}],"ans":"D","multi":false,"note":"","ex":"考查 KNN 的实现特点：线性扫描要把待测样本与全部训练样本逐一计算距离，样本量大时效率很低，通常需要 kd 树等结构加速，因此说线性扫描效率很高不正确，故选 D。"},{"n":450,"sec":"第七章 KNN","stem":"影响 KNN 算法效果的主要因素不包括（ ）?","opts":[{"k":"A","t":"最近数据的距离"},{"k":"B","t":"距离度量"},{"k":"C","t":"决策规则"},{"k":"D","t":"K 的值"}],"ans":"A","multi":false,"note":"","ex":"考查影响 KNN 算法效果的主要因素：距离度量方式、k 值大小和决策规则是公认的三个关键因素；某个最近数据的距离只是计算结果，不属于方法本身的要素，故选 A。"},{"n":451,"sec":"第七章 KNN","stem":"k-NN 最近邻方法在什么情况下效果较好？（ ）","opts":[{"k":"A","t":"样本较多但典型性不好"},{"k":"B","t":"样本较少但典型性好"},{"k":"C","t":"样本呈团状分布"},{"k":"D","t":"样本呈链状分布"}],"ans":"B","multi":false,"note":"解析：K 近邻算法主要依靠的是周围的点，因此如果样本过多，则难以区分，\n典型性好的容易区分。\n样本呈团状或链状都具有迷惑性，这样 kNN 就发挥不出其求近邻的优势了，整\n体样本应该具有典型性好，样本较少，比较适宜。","ex":"考查 k-NN 适用场景：该方法依赖周围近邻点投票，样本较少但典型性好时容易区分；样本过多而典型性差难以区分，团状或链状分布会让近邻失去代表性，故选 B。"},{"n":452,"sec":"第七章 KNN","stem":"最近邻分类中测度度量，经常采用范式距离，以下属于范式距离的是\n（ ）","opts":[{"k":"A","t":"D(x; y) = P ijxi ¡ yij"},{"k":"B","t":"D(x; y) = max i jxi ¡ yij"},{"k":"C","t":"D(x; y) = [(x¡ y)>(x¡ y)]1=2"},{"k":"D","t":"D(x; y) = (x¡ y)>§¡1(x¡ y)"}],"ans":"ABC","multi":true,"note":"","ex":"考查范式距离的识别：A 是一范数即曼哈顿距离，B 是无穷范数即取各维差的最大绝对值，C 是二范数即欧氏距离，三者都是范式距离；D 含协方差矩阵的逆，是马氏距离，不属于范式距离，故选 ABC。"},{"n":453,"sec":"第七章 KNN","stem":"以下可行的最近邻分类的加速方案（
